ti-Xa calibrado se inibidor Xa; tempo de trombina diluído/ecarina se dabigatrana disponíveis. TC de crânio urgente se sinais neurológicos; buscar fonte de sangramento.", "review": "Rever sangramento/perfusão após reversão; INR cerca de 30 min após CCP4 para varfarina. Hb/coagulação/rim seriados conforme perda; vigilância de trombose e decisão posterior de reinício da anticoagulação pela causa/risco."}}, {"id": 20, "name": "Benzodiazepínicos", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Sonolência, ataxia e fala arrastada; risco maior com coingestões."}, {"x": 470, "y": 215, "title": "RECONHECER • ACIONAR CIATox", "body": "Identificar agente, dose, horário, uso habitual e coingestões.\nComa/hipoventilação: pesquisar opioides."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Via aérea e ventilação; antídoto apenas em casos selecionados."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP, ventilação e desfibrilação conforme ritmo; seguir ACLS.\nCorrigir hipóxia e investigar causas reversíveis/coingestões.\nFlumazenil NÃO tem papel na PCR por benzodiazepínicos."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + SUPORTE", "body": "Abrir via aérea; O₂ conforme necessidade. Hipoventilação/apneia: bolsa-válvula-máscara; IOT se suporte insuficiente ou via aérea insegura.\nMonitorar frequência respiratória, SpO₂, capnografia se disponível, ECG, pressão e consciência; acesso IV e glicemia.\nCorrigir hipoglicemia. Se suspeita de opioide associado, administrar naloxona antes de considerar flumazenil.\nVentilação tem prioridade; não esperar antídoto para ventilar."}, "main": {"x": 650, "y": 1020, "title": "FLUMAZENIL • NÃO É USO ROTINEIRO", "body": "Considerar na depressão respiratória por exposição isolada, com história confiável e baixo risco, após excluir contraindicações; exemplo: sedação iatrogênica.\nEvitar: dependência/uso crônico, risco convulsivo, coingestão pró-convulsivante, sinais de tricíclicos ou intoxicação mista/desconhecida.\nBenzodiazepínico usado para controlar estado de mal ou condição ameaçadora à vida: não reverter.\nSem seleção segura: suporte e observação; não usar como teste no coma indiferenciado."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; manter ventilação e investigar coingestões.\nSem ROSC: manter ressuscitação e tratamento das causas.\nReavaliar necessidade de via aérea e suporte continuamente."}], "supports": [{"x": 40, "y": 1460, "title": "AVALIAÇÃO COMPLEMENTAR", "body": "ECG e exames dirigidos ao quadro; gasometria se hipoventilação.\nPesquisar trauma, AVC, causas metabólicas e outros depressores.\nCarvão não é rotina: alto risco de aspiração em paciente sedado.\nHipotensão marcada ou arritmia: rever diagnóstico/coingestão."}, {"x": 650, "y": 1460, "title": "DOSE • SE SELECIONADO", "body": "Superdose: 0,2 mg IV em 30 s; esperar 30 s. Sem resposta suficiente: 0,3 mg em 30 s.\nDepois, 0,5 mg em 30 s a intervalos de 1 min; total até 3 mg.\nSedação iatrogênica: 0,2 mg em 15 s; repetir 0,2 mg a cada 60 s, total até 1 mg.\nTitular; evitar bolus único grande."}, {"x": 1220, "y": 1460, "title": "SEGURANÇA / RECORRÊNCIA", "body": "0,1 mg/mL: 0,2 mg = 2 mL; conferir ampola.\nRessedação é possível: retomar suporte; nova dose/infusão só com protocolo e CIATox.\nConvulsão após antídoto: suspender; suporte, protocolo de estado de mal e toxicologista.\nVigiar abstinência e arritmias."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • APÓS CADA INTERVENÇÃO", "body": "Em minutos: ventilação, consciência, pressão e via aérea; monitorização contínua nos graves.\nObjetivo: ventilação e via aérea seguras; despertar não garante recuperação respiratória.\nApós flumazenil, observar recorrência por pelo menos 3–4 h; prolongar conforme agente, dose e evolução."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA SUSTENTADA", "body": "Observar até consciência e ventilação estáveis; avaliar segurança antes da alta."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever coingestões; suporte ventilatório/UTI. Não escalar flumazenil empiricamente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP/ACLS; tratar causas em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Flumazenil pode provocar convulsão, abstinência e arritmia; suporte isolado costuma ser a conduta mais segura.\nNão reverte opioides, álcool ou outros depressores; manter investigação quando a resposta for incompleta."}, "poster": "posters/20.png", "references": "Referências: AHA 2025 • DailyMed/Flumazenil • Atlantic Canada Poison Centre", "clinical": {"exams": "Glicemia, ECG e avaliação respiratória/ETCO₂; gasometria se depressão importante. Investigar uso crônico, epilepsia, coingestão e indicação original do benzodiazepínico. Eletrólitos, creatinina e dosagens de coingestões conforme hipótese; teste urinário não determina segurança do flumazenil.", "review": "Reavaliar ventilação em minutos após cada dose; observar ressedações ≥3–4 h após flumazenil, mais se exposição longa. Convulsão ou arritmia → suspender reversão e tratar complicação; coma misto exige suporte, não escalada empírica."}}, {"id": 21, "name": "Paracetamol", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "ALERTA", "body": "Pode estar assintomático no início; não excluir risco pela aparência."}, {"x": 470, "y": 215, "title": "IDENTIFICAR • ACIONAR CIATox", "body": "Dose total, peso, horário confiável, formulação e coingestões.\nAguda ou excesso repetido >24 h?"}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "NAC precoce quando indicada; evitar atraso além de 8 h."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e correção das causas reversíveis.\nInvestigar coingestões, hipóxia e distúrbios metabólicos.\nNAC quando indicada em paralelo; não atrasar ressuscitação."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + DOSAGEM", "body": "Monitorar sinais vitais e consciência; glicemia, paracetamol sérico, AST/ALT, INR, creatinina e eletrólitos. Gasometria/lactato nos graves.\nIngestão aguda com horário confiável: colher em ≥4 h e aplicar nomograma Rumack–Matthew (4–24 h).\nNa linha de tratamento ou acima: iniciar NAC; linha começa em 150 µg/mL na 4ª hora e cai com o tempo.\nColeta <4 h não serve para posicionar no nomograma."}, "main": {"x": 650, "y": 1020, "title": "NAC IV • ESQUEMA DE 3 ETAPAS / 21 h", "body": "1ª: 150 mg/kg em 1 h.\n2ª: 50 mg/kg em 4 h (12,5 mg/kg/h).\n3ª: 100 mg/kg em 16 h (6,25 mg/kg/h). Total: 300 mg/kg.\nConferir diluição/volume conforme bula, peso e restrição hídrica; bomba de infusão. Peso >100 kg: cálculo limitado a 100 kg neste protocolo.\nSuspeita forte (>200 mg/kg ou >10 g) e resultado atrasará início além de 8 h: iniciar antes do resultado."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento da intoxicação.\nVigiar acidose, hipoglicemia, falência hepática e renal.\nSem ROSC: manter RCP e tratamento das causas."}], "supports": [{"x": 40, "y": 1460, "title": "SEM NOMOGRAMA VÁLIDO", "body": "Horário desconhecido: dosar agora; NAC se >10 µg/mL ou AST/ALT elevadas compatíveis.\nExcesso repetido >24 h: NAC se ≥20 µg/mL ou AST/ALT anormais compatíveis.\nApresentação >24 h com toxicidade: iniciar enquanto investiga.\nNomograma inválido nesses casos."}, {"x": 650, "y": 1460, "title": "ABSORÇÃO / SEGURANÇA", "body": "Liberação prolongada: se >10 µg/mL e abaixo da linha, repetir em 4–6 h.\nOpioide/anticolinérgico: pode atrasar absorção; repetir conforme CIATox.\nCarvão: só se indicado e via aérea segura; não atrasar NAC.\nReação: tratar/pausar conforme gravidade; planejar retomada."}, {"x": 1220, "y": 1460, "title": "QUADRO DE ALTO RISCO", "body": "Ingestão ≥30 g, acidose precoce, lactato alto ou alteração de consciência: toxicologista/UTI.\nDiscutir ajuste da NAC e depuração em casos extremos; fomepizol não é rotina.\nEncefalopatia, coagulopatia progressiva ou falência multissistêmica: avaliação precoce por centro transplantador."}], "review": {"x": 100, "y": 1960, "title": "ANTES DE ENCERRAR NAC • TODOS OS CRITÉRIOS", "body": "Repetir paracetamol, AST/ALT e INR antes do término; avaliar clínica e função orgânica.\nParacetamol <10 µg/mL; INR <2; AST/ALT normais para o paciente ou queda de 25–50% do pico; paciente clinicamente bem.\nExigir melhora prognóstica nos graves: pH, lactato e creatinina. Não parar só pelo relógio."}, "outcomes": [{"x": 40, "y": 2260, "title": "CRITÉRIOS ATENDIDOS", "body": "Encerrar NAC com equipe/CIATox; planejar observação e segurança da alta."}, {"x": 630, "y": 2260, "title": "CRITÉRIOS NÃO ATENDIDOS", "body": "Manter NAC ≥6,25 mg/kg/h; repetir exames em 12–24 h ou antes se piora."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatamente; tratar causas e intoxicação em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "150 µg/mL é o ponto da linha em 4 h, não um limiar fixo para qualquer horário. 1 µg/mL = 1 mg/L.\nNAC permanece útil na apresentação tardia e na lesão hepática; não negar tratamento porque passaram 8 h."}, "poster": "posters/21.png", "references": "Referências: Consenso EUA/Canadá (JAMA 2023) • DailyMed/Acetadote • ACMT", "clinical": {"exams": "Paracetamol sérico ≥4 h após ingestão aguda de horário conhecido; valores anteriores não excluem toxicidade. AST/ALT, INR, creatinina, glicemia e eletrólitos; gasometria/lactato se grave. Se horário desconhecido/repetição de doses: não aplicar nomograma; dosar imediatamente e integrar lesão hepática. Repetir nível em absorção retardada/coingestão conforme resultado.", "review": "Antes de terminar NAC, repetir paracetamol, AST/ALT, INR e avaliação clínica. Só interromper com critérios laboratoriais e clínicos de resolução; se não atingidos, continuar infusão final e reavaliar com equipe/CIATox."}}, {"id": 22, "name": "Digoxina", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Náuseas, confusão, alterações visuais e bradi/taquiarritmias."}, {"x": 470, "y": 215, "title": "SUSPENDER DIGOXINA • ACIONAR CIATox", "body": "Distinguir superdose aguda de acúmulo crônico.\nRever função renal, dose, última tomada e interações."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Reconhecer instabilidade e obter Fab antidigoxina precocemente."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS; Fab urgente em paralelo.\nACPC: 10 frascos IV direto; repetir 5–10 em 3–5 min se necessário, com CIATox.\nEstoque parcial: dar o disponível.\nNão atrasar RCP."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + EXAMES", "body": "Monitor cardíaco contínuo, ECG de 12 derivações, pressão, acesso IV e suporte respiratório conforme necessidade.\nDosar K, Mg, creatinina e digoxina ANTES do Fab, sem atrasar tratamento de instabilidade.\nNível de digoxina ≥6 h após dose reflete melhor distribuição; resultado precoce pode superestimar carga.\nInterpretar clínica, ECG e função renal: nível isolado não define toda a gravidade."}, "main": {"x": 650, "y": 1020, "title": "Fab • INDICAÇÃO + DOSE EMPÍRICA ACPC", "body": "Ameaça à vida: arritmia ventricular grave, bradicardia/BAV com instabilidade, choque ou hipercalemia ligada à toxicidade. Não esperar nível.\nBula DigiFab: K >5,5 mEq/L em adulto com sinais rapidamente progressivos é indicação.\nAguda com comprometimento hemodinâmico e nível desconhecido: 2–4 frascos IV em 30 min; repetir conforme resposta/CIATox.\nCrônica: ACPC propõe 1 frasco por vez em 30 min, repetindo se necessário. PCR/periparada: usar esquema de resgate."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; seguir resposta ao Fab e distúrbios eletrolíticos.\nVigiar recorrência de arritmia e toxicidade.\nSem ROSC: manter ressuscitação e tratamento específico."}], "supports": [{"x": 40, "y": 1460, "title": "ARRITMIAS / ELETRÓLITOS", "body": "Fab é o tratamento principal.\nBradicardia: atropina como ponte; marcapasso com especialista.\nCorrigir K/Mg baixos com cautela.\nK alto: Fab; temporização com CIATox.\nDiálise não remove digoxina eficazmente."}, {"x": 650, "y": 1460, "title": "CÁLCULO • NEUTRALIZAÇÃO", "body": "Se dose oral conhecida:\nfrascos = mg ingeridos ×0,8 ÷0,5.\nSe nível pós-distribuição conhecido:\nfrascos = ng/mL × peso(kg) ÷100.\nArredondar para cima.\n1 frasco de 40 mg liga ≈0,5 mg de digoxina.\nEx.: 4 ng/mL, 60 kg → 2,4 → 3 frascos. Dose final com CIATox."}, {"x": 1220, "y": 1460, "title": "PREPARO / SEGURANÇA", "body": "DigiFab 40 mg: reconstituir com 4 mL de água estéril → 10 mg/mL.\nDiluir em SF 0,9% conforme bula; infundir em 30 min. PCR/periparada: IV direto após reconstituição.\nVigiar reação alérgica e queda rápida de K.\nPode descompensar IC ou acelerar resposta ventricular na FA."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • RESPOSTA CLÍNICA, ECG E POTÁSSIO", "body": "Após Fab: reavaliar em 15–30 min; repetir K frequentemente nas primeiras horas e conforme evolução.\nSeguir ritmo, pressão, perfusão, consciência e função renal; resposta máxima pode levar horas.\nDigoxina TOTAL após Fab pode subir e ser enganosa: não usar esse resultado para decidir nova dose."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Monitorização hospitalar; prolongar na disfunção renal pelo risco de rebote tardio."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever dose, diagnóstico e coingestões; Fab adicional conforme clínica e CIATox."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS e esquema de resgate com Fab imediatamente."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Empírico: ACPC. Fórmulas: neutralização completa. Definir a estratégia com CIATox; bulas/protocolos diferem.\nNão aplicar essas fórmulas a plantas ou outros glicosídeos; não misturar esquemas de dose."}, "poster": "posters/22.png", "references": "Referências: Atlantic Canada Poison Centre • DailyMed/DigiFab • SmPC DigiFab", "clinical": {"exams": "ECG/ritmo contínuos, K/Mg/Ca, creatinina, glicemia; nível de digoxina colhido ≥6 h após última dose para interpretar distribuição, sem atrasar Fab no grave. Após Fab, digoxina TOTAL não mede toxicidade residual; acompanhar clínica, ECG e K.", "review": "ECG/perfusão contínuos; rever em 15–30 min após Fab e K frequentemente nas primeiras horas. Vigiar hipocalemia, piora de IC e recorrência tardia no rim comprometido. Não redosar por digoxina TOTAL pós-Fab."}}, {"id": 23, "name": "Metanol", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Exposição + alteração visual, acidose, dor abdominal ou coma."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • ACIONAR CIATox + NEFROLOGIA", "body": "Bebida adulterada ou produto com metanol: colher amostras.\nSuspeita consistente: não esperar dosagem para tratar."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Bloquear metabolismo, corrigir acidose e remover tóxico nos graves."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS; corrigir causas reversíveis e acidemia grave em paralelo.\nAntídoto urgente e organização de depuração extracorpórea com equipe.\nNão atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + INVESTIGAÇÃO", "body": "Monitorização, acesso IV, glicemia e suporte hemodinâmico/respiratório. Se IOT: evitar perda da compensação ventilatória da acidose.\nGasometria, eletrólitos, função renal, lactato, osmolaridade medida, metanol e etanol séricos.\nCalcular ânion gap: Na − (Cl + HCO₃). Gap osmolar normal não exclui quadro tardio.\nDocumentar visão, pupilas e consciência; investigar coingestões."}, "main": {"x": 650, "y": 1020, "title": "FOMEPIZOL IV • INICIAR PRECOCEMENTE", "body": "Iniciar se exposição provável com acidose/gap osmolar ou alterações visuais compatíveis, ou metanol >20 mg/dL.\nAtaque: 15 mg/kg. Depois: 10 mg/kg a cada 12 h por 4 doses; então 15 mg/kg a cada 12 h.\nDiluir cada dose em 100 mL de SF 0,9% ou SG 5%; infundir em 30 min. Não administrar puro/em bolus.\nDurante hemodiálise intermitente: intervalo de 4 h; ajustar doses de início/fim conforme tabela do produto."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; continuar antídoto, correção metabólica e depuração se indicada.\nSem ROSC: manter ressuscitação e tratamento da causa.\nVigiar déficit visual e lesão neurológica."}], "supports": [{"x": 40, "y": 1460, "title": "ACIDOSE / ADJUVANTE", "body": "Bicarbonato IV por gasometria; vigiar Na/K, volume e ventilação.\nMeta MS: pH 7,35–7,45; manter antídoto/diálise.\nÁcido folínico: 30 mg IV 6/6 h por 48 h (NT MS 376/2025).\nSem fomepizol: etanol farmacêutico com CIATox."}, {"x": 650, "y": 1460, "title": "DIÁLISE • CRITÉRIOS EXTRIP", "body": "Qualquer um: coma, convulsão, déficit visual novo, pH ≤7,15, acidose persistente ou ânion gap >24 mmol/L.\nDisfunção renal ou metanol:\n>70 mg/dL com fomepizol;\n>60 mg/dL com etanol;\n>50 mg/dL sem bloqueador.\nClínica grave: não esperar nível."}, {"x": 1220, "y": 1460, "title": "DEPURAÇÃO / ANTÍDOTO", "body": "Preferir hemodiálise intermitente; terapia contínua se indisponível.\nManter bloqueador de ADH e folato durante depuração.\nConferir intervalo/dose do fomepizol antes, durante e após diálise.\nDiscutir transferência imediata se faltarem antídoto ou diálise; manter tratamento na espera."}, {"title": "Fomepizol • início/fim da hemodiálise", "body": "Hemodiálise intermitente: no início, se a última dose foi há ≥6 h, administrar a próxima dose; se <6 h, não dar dose extra. Durante diálise: intervalo de 4 h. Ao terminar: se última dose há <1 h, não dose extra; se 1–<3 h, dar metade da próxima dose; se ≥3 h, dar dose completa. Depois retornar ao intervalo habitual de 12 h a partir da última dose. Conferir dose vigente (10 ou 15 mg/kg) e modalidade; terapia contínua requer ajuste próprio com equipe."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • CLÍNICA + GASOMETRIA + METANOL", "body": "Após intervenções: consciência, visão, ventilação e perfusão; repetir gasometria/eletrólitos até controle.\nMonitorar tendência do ânion gap e metanol. EXTRIP: encerrar diálise quando <20 mg/dL e melhora clínica.\nEncerrar fomepizol apenas com metanol indetectável/<20 mg/dL, pH normal e resolução clínica, com CIATox."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter vigilância; documentar recuperação metabólica e avaliação visual/neurológica."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever diálise, antídoto e dose efetiva; UTI/nefrologia/CIATox e suporte avançado."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatamente; correção metabólica e antídoto em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não usar bebidas alcoólicas como tratamento. Etanol requer preparo farmacêutico e monitorização específica.\nCarvão não é útil para metanol isolado. Ausência inicial de sintomas não garante segurança."}, "poster": "posters/23.png", "references": "Referências: EXTRIP • DailyMed/Fomepizole • Atlantic Canada • Ministério da Saúde", "clinical": {"exams": "Gasometria, Na/K/Cl/HCO₃, osmolalidade medida, glicemia, ureia/creatinina, lactato, etanol e metanol se disponível; calcular ânion/gap osmolar e avaliar visão. Gap osmolar normal tardio não exclui toxicidade. Registrar hora, dose e necessidade de diálise.", "review": "Clínica visual/neurológica, pH/gap e eletrólitos seriados; nos graves a cada 2–4 h ou antes. Durante diálise conferir intervalo de fomepizol. Só parar antídoto quando metanol <20 mg/dL/indetectável, pH normal e resolução clínica."}}, {"id": 24, "name": "Etilenoglicol", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Anticongelante/solvente + embriaguez, acidose ou lesão renal."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • CIATox + NEFROLOGIA", "body": "Exposição provável: colher amostras e iniciar tratamento.\nNão esperar dosagem se a suspeita clínica for consistente."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Bloquear metabolismo e remover tóxico/metabólitos nos graves."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS imediatamente.\nTratar acidemia e distúrbios eletrolíticos graves em paralelo; antídoto urgente.\nOrganizar depuração com equipe especializada; não atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + INVESTIGAÇÃO", "body": "Monitorização, acesso IV, glicemia, ECG e suporte respiratório/hemodinâmico. Se IOT: preservar compensação ventilatória da acidose.\nGasometria, Na/K/Cl/HCO₃, Ca ionizado, Mg, creatinina, osmolaridade medida, etanol, etilenoglicol (EG) e urina.\nÂnion gap EXTRIP: Na + K − Cl − HCO₃. Gap osmolar normal ou ausência de cristais de oxalato não excluem intoxicação.\nVigiar consciência, convulsões e débito urinário."}, "main": {"x": 650, "y": 1020, "title": "FOMEPIZOL IV • NÃO AGUARDAR CONFIRMAÇÃO", "body": "Iniciar por suspeita consistente (história + acidose/gap osmolar/cristais compatíveis) ou EG >20 mg/dL.\nAtaque: 15 mg/kg. Após 12 h: 10 mg/kg a cada 12 h por 4 doses; depois 15 mg/kg a cada 12 h.\nCada dose: diluir em 100 mL de SF 0,9% ou SG 5%; infundir em 30 min. Não administrar puro/em bolus.\nHemodiálise intermitente: doses a cada 4 h; conferir ajuste de início/fim na tabela do produto."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; manter antídoto e correção metabólica.\nDiálise se indicada; monitorar lesão renal e neurológica.\nSem ROSC: permanecer em ressuscitação e tratar causa em paralelo."}], "supports": [{"x": 40, "y": 1460, "title": "SUPORTE METABÓLICO", "body": "Acidemia importante: bicarbonato IV guiado por gasometria; vigiar Na/K, Ca e volume.\nHipocalcemia sintomática: cálcio IV com ECG e Ca ionizado; evitar reposição automática.\nConvulsão: benzodiazepínico.\nSem fomepizol: etanol farmacêutico com CIATox; não usar bebidas."}, {"x": 650, "y": 1460, "title": "DIÁLISE • INDICAÇÕES", "body": "EXTRIP recomenda se:\n• coma ou convulsão por EG;\n• IRA KDIGO 2–3;\n• gap com K >27 mmol/L;\n• glicolato >12 mmol/L.\nConsiderar: gap 23–27, glicolato 8–12 ou DRC com TFG <45.\nHD intermitente preferida; contínua se indisponível."}, {"x": 1220, "y": 1460, "title": "NÍVEL / GAP OSMOLAR", "body": "Com exposição comprovada:\nFomepizol: considerar HD se EG >310 mg/dL ou gap >50.\nEtanol: HD se >310 ou gap >50; considerar se 124–310 ou gap 20–50.\nSem antídoto: HD se EG >62 ou gap >10.\nGap ajustado para etanol. Manter antídoto durante HD."}, {"title": "Fomepizol • início/fim da hemodiálise", "body": "Hemodiálise intermitente: no início, se a última dose foi há ≥6 h, administrar a próxima dose; se <6 h, não dar dose extra. Durante diálise: intervalo de 4 h. Ao terminar: se última dose há <1 h, não dose extra; se 1–<3 h, dar metade da próxima dose; se ≥3 h, dar dose completa. Depois retornar ao intervalo habitual de 12 h a partir da última dose. Conferir dose vigente (10 ou 15 mg/kg) e modalidade; terapia contínua requer ajuste próprio com equipe."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • CLÍNICA + GASOMETRIA + FUNÇÃO RENAL", "body": "Após intervenções: ABCDE, ECG, diurese, gasometria, eletrólitos e EG; repetir conforme gravidade/CIATox.\nDiálise: gap com K <18 mmol/L; confirmar correção sustentada da acidose; EG <25 mg/dL apoia suspensão.\nFomepizol: suspender apenas com EG indetectável/<20 mg/dL, pH normal e paciente assintomático (bula)."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Vigiar rebote metabólico e função renal; retirar tratamentos por critérios."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever antídoto/diálise, coingestões e suporte; manter UTI/CIATox."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratamento da causa em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Carvão não é útil para EG isolado. Não indicar diálise somente pelo volume ingerido.\nTiamina/piridoxina: adjuvantes de benefício incerto; não substituem antídoto ou diálise."}, "poster": "posters/24.png", "references": "Referências: EXTRIP 2023 • DailyMed/Fomepizole • Atlantic Canada • CDC/ATSDR", "clinical": {"exams": "Gasometria, Na/K/Cl/HCO₃, Ca ionizado, osmolalidade, glicemia, creatinina, etanol e EG se disponível; diurese/urina para cristais, cuja ausência não exclui intoxicação. Avaliar acidose, lesão renal e gap; lactato pode sofrer interferência do glicolato em certos aparelhos.", "review": "pH/gap, Ca/K, creatinina e diurese seriados, em geral 2–4 h nos graves. Conferir fomepizol sob diálise; não usar gap osmolar normal como alta. Suspensão exige resolução clínica/metabólica e nível de EG adequado."}}, {"id": 25, "name": "Betabloqueadores", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Bradicardia/BAV, choque, hipoglicemia ou coma após exposição."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • ACIONAR CIATox + UTI", "body": "Identificar fármaco, dose, horário, formulação e coingestões.\nPropranolol: QRS/convulsões; sotalol: QT/Torsades."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Restaurar perfusão; vigiar glicose, eletrólitos e arritmias."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS, desfibrilar se indicado e tratar causa em paralelo.\nConsiderar insulina/glicose e suporte extracorpóreo com equipe.\nSem ROSC: manter ressuscitação; não atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + GRAVIDADE", "body": "Monitor cardíaco, ECG seriado, acesso IV, glicemia, gasometria/lactato, K/Mg/Ca e função renal. Eco à beira-leito se disponível.\nChoque/bradicardia sintomática: cristaloide em pequenos bolus, reavaliando congestão; iniciar vasopressor sem demora.\nAdrenalina para baixo débito/bradicardia; noradrenalina para vasoplegia, tituladas à perfusão em bomba.\nSem instabilidade: observação monitorizada; formulação prolongada pode ter toxicidade tardia."}, "main": {"x": 650, "y": 1020, "title": "CHOQUE PERSISTENTE • INSULINA REGULAR IV", "body": "Hipotensão refratária a vasopressor: iniciar terapia de insulina em altas doses com glicose, em ambiente intensivo.\nBolus: 1 U/kg IV; imediatamente infusão de 1 U/kg/h.\nTitular +1 U/kg/h a cada 30 min, até 10 U/kg/h, pela perfusão; casos graves exigem ajuste com CIATox.\nMetas: PAM ≥65 mmHg, diurese >0,5 mL/kg/h e lactato em queda. Dupla checagem de dose, concentração e bomba."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento do choque tóxico.\nManter suporte até eliminação do fármaco; considerar VA-ECMO cedo se refratário.\nVigiar rebote após redução das infusões."}], "supports": [{"x": 40, "y": 1460, "title": "GLICOSE + VIGILÂNCIA", "body": "Glicose IV: 25 g inicial, conforme glicemia; depois 0,25–0,5 g/kg/h.\nTitular para 108–252 mg/dL (protocolo ACPC).\nSG 10% periférico; soluções concentradas por via central.\nGlicemia a cada 15–30 min no início/ajustes; K/Mg/P seriados. Corrigir alterações graves."}, {"x": 650, "y": 1460, "title": "BRADICARDIA / ADJUVANTE", "body": "Atropina: 1 mg IV; repetir 3–5 min, máximo 3 mg; resposta pode ser limitada.\nGlucagon: 5 mg IV em 5 min; repetir uma vez após 10 min se insuficiente (ACPC).\nSe responder: discutir infusão com CIATox. Vigiar vômitos/aspiração.\nMarcapasso: confirmar captura e perfusão."}, {"x": 1220, "y": 1460, "title": "ARRITMIA / RESGATE", "body": "Propranolol/QRS largo: bicarbonato IV (algoritmo 13).\nSotalol/Torsades: Mg IV; desfibrilar se instável.\nChoque refratário: VA-ECMO. HD: considerar para atenolol, nadolol ou sotalol.\nLipídio: benefício incerto; discutir resgate com CIATox."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • PERFUSÃO + ECG + SEGURANÇA METABÓLICA", "body": "Após cada intervenção: ABCDE, PA/FC, ECG, consciência, diurese e lactato; titular pelo débito/perfusão.\nRever glicemia/eletrólitos, volume e bombas. Não encerrar tratamento apenas porque a frequência normalizou.\nDesmame gradual após estabilidade; glicose pode ser necessária por ~24 h após insulina."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter observação conforme fármaco/formulação; vigiar hipoglicemia tardia e rebote."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever diagnóstico, doses e suporte; acionar centro com VA-ECMO antes do colapso."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratamento específico em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Insulina em altas doses exige bomba, glicose e monitorização intensiva; não é esquema subcutâneo.\nDescontaminação somente após estabilização, com via aérea segura e orientação do CIATox."}, "poster": "posters/25.png", "references": "Referências: AHA 2025 • Atlantic Canada Poison Centre (ACPC)", "clinical": {"exams": "ECG/PA contínuos, glicemia, K/Mg/Ca, gasometria/lactato, creatinina e diurese. Eco para débito/contratilidade se disponível. Durante insulina em alta dose: glicemia a cada 15–30 min no início/titulação e depois a cada hora; K inicialmente a cada hora e após ajustes.", "review": "Após cada ajuste, PA/perfusão/eco e lactato; glicemia 15–30 min no início, horária após estabilidade; K inicialmente horário. Insulina alta dose deve ser titulada pelo débito/perfusão, não só FC; manter vigilância de hipoglicemia após desmame."}}, {"id": 26, "name": "Bloqueadores dos canais de cálcio", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Hipotensão, bradicardia/BAV e hiperglicemia após exposição."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • ACIONAR CIATox + UTI", "body": "Verapamil/diltiazem: bradicardia e baixo débito.\nAmlodipino/nifedipino: vasoplegia; em overdose, efeito misto."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Restaurar perfusão; vigiar glicose, eletrólitos e arritmias."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS, desfibrilar se indicado e tratar causa em paralelo.\nConsiderar insulina/glicose e suporte extracorpóreo com equipe.\nSem ROSC: manter ressuscitação; não atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + GRAVIDADE", "body": "Monitor, ECG seriado, acesso IV, glicemia, gasometria/lactato, K/Mg/Ca ionizado e função renal; eco para perfil do choque.\nHipotensão: cristaloide em pequenos bolus, reavaliando congestão; iniciar vasopressor, cálcio e insulina precocemente.\nNoradrenalina para vasoplegia; adrenalina se baixo débito/bradicardia, em bomba e tituladas à perfusão.\nSem instabilidade: observação monitorizada com CIATox; liberação prolongada pode causar deterioração tardia."}, "main": {"x": 650, "y": 1020, "title": "HIPOTENSÃO • INSULINA REGULAR IV", "body": "Intoxicação grave com hipotensão: insulina em altas doses + glicose, associada ao suporte vasopressor; não esperar falha prolongada.\nBolus: 1 U/kg IV; imediatamente infusão de 1 U/kg/h.\nTitular +1 U/kg/h a cada 30 min, até 10 U/kg/h, pela perfusão; ajuste mais rápido somente com equipe/CIATox.\nMetas: PAM ≥65 mmHg, diurese >0,5 mL/kg/h e lactato em queda. Dupla checagem de dose, concentração e bomba."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento do choque tóxico.\nManter suporte até eliminação do fármaco; considerar VA-ECMO cedo se refratário.\nVigiar rebote após redução das infusões."}], "supports": [{"x": 40, "y": 1460, "title": "GLICOSE + VIGILÂNCIA", "body": "Glicose IV: 25 g inicial, conforme glicemia; depois 0,25–0,5 g/kg/h.\nTitular para 108–252 mg/dL (protocolo ACPC).\nSG 10% periférico; soluções concentradas por via central.\nGlicemia a cada 15–30 min no início/ajustes; K/Mg/P seriados. Corrigir alterações graves."}, {"x": 650, "y": 1460, "title": "CÁLCIO IV • ESCOLHER SAL", "body": "Gluconato 10%: 3 g (30 mL), IV em 2–5 min, veia calibrosa.\nOU cloreto 10%: 1 g (10 mL), IV em 10 min; preferir via central.\nRepetir 10–20 min conforme resposta; reavaliar após 4 doses.\nECG/PA e Ca ionizado seriados; vigiar extravasamento e hipercalcemia."}, {"x": 1220, "y": 1460, "title": "BRADICARDIA / RESGATE", "body": "Atropina: 1 mg IV; repetir 3–5 min, máximo 3 mg; efeito limitado.\nMarcapasso: ponte; verificar captura e perfusão.\nChoque refratário: VA-ECMO precoce. Diálise não remove eficazmente esses fármacos.\nGlucagon/lipídio/azul de metileno: benefício incerto; CIATox."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • PERFUSÃO + ECG + SEGURANÇA METABÓLICA", "body": "Após cada intervenção: ABCDE, PA/FC, ECG, consciência, diurese e lactato; titular pelo débito/perfusão.\nRever glicemia/eletrólitos, volume e bombas. Não encerrar tratamento apenas porque a frequência normalizou.\nDesmame gradual após estabilidade; glicose pode ser necessária por ~24 h após insulina."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter observação conforme fármaco/formulação; vigiar hipoglicemia tardia e rebote."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever diagnóstico, doses e suporte; acionar centro com VA-ECMO antes do colapso."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratamento específico em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Insulina exige glicose, bomba e monitorização intensiva. Cálcio: doses dos sais não são intercambiáveis.\nDescontaminação somente após estabilização, com via aérea segura e orientação do CIATox."}, "poster": "posters/26.png", "references": "Referências: AHA 2025 • Atlantic Canada Poison Centre (ACPC) • EXTRIP", "clinical": {"exams": "ECG/PA contínuos, glicemia, K/Mg e Ca ionizado, gasometria/lactato, creatinina e diurese; eco para perfil de choque. Glicemia a cada 15–30 min durante início/titulação da insulina e depois horária; K e Ca seriados conforme reposição/infusão.", "review": "Após cada ajuste, PAM/perfusão, glicemia, K e Ca ionizado; monitorização contínua. Desmame gradual após estabilidade; necessidade de glicose pode persistir cerca de 24 h após insulina. Não repetir cálcio sem acompanhar Ca/ECG."}}, {"id": 27, "name": "Organofosforados", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Broncorreia, miose, sudorese, vômitos/diarreia e fasciculações."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • CIATox + UTI", "body": "Síndrome colinérgica + exposição a inseticida/organofosforado.\nProteger equipe com EPI; tratar sem esperar colinesterase."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Oxigenar, ventilar e controlar secreções com atropina."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e desfibrilação se indicada.\nAspiração, ventilação e atropina específica em paralelo; tratar hipóxia.\nSem ROSC: manter ressuscitação e tratamento da intoxicação."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + VIA AÉREA", "body": "Oxigênio, aspiração e ventilação assistida; IOT precoce se falência respiratória, fraqueza ou rebaixamento.\nEvitar succinilcolina/mivacúrio: bloqueio prolongado; usar alternativa conforme protocolo de IOT.\nMonitor, ECG, acesso IV, glicemia, gasometria, eletrólitos e função renal. Colher colinesterases se disponível, sem atrasar antídoto.\nAtropina trata efeitos muscarínicos; não reverte paralisia neuromuscular. Ventilação pode continuar necessária."}, "main": {"x": 650, "y": 1020, "title": "ATROPINA IV • TITULAR À RESPOSTA RESPIRATÓRIA", "body": "Dose inicial adulta: 2 mg IV. Reavaliar em 5 min; dobrar doses sucessivas (2 → 4 → 8 → 16 mg...) até atropinização.\nMetas: broncorreia controlada/ausculta limpa, oxigenação e ventilação melhores; FC >80/min e PAS >80 mmHg (AHA/MS).\nApós controle: infusão de 10–20% da dose TOTAL de ataque por hora; titular à clínica. Ex.: total 30 mg → 3–6 mg/h.\nNão aplicar limite de 3 mg do algoritmo de bradicardia. Não usar pupila ou taquicardia isolada como meta."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; manter atropina e suporte ventilatório.\nReavaliar secreções, força muscular, perfusão e convulsões.\nPralidoxima com CIATox; vigiar recorrência e fraqueza tardia."}], "supports": [{"x": 40, "y": 1460, "title": "DESCONTAMINAÇÃO", "body": "EPI adequado antes do contato; remover e isolar roupas contaminadas.\nLavar pele/cabelos com água e sabão; irrigar olhos se expostos.\nNão atrasar suporte/antídoto. Não induzir vômitos.\nCarvão: somente caso selecionado pelo CIATox, via aérea segura; evitar se íleo."}, {"x": 650, "y": 1460, "title": "PRALIDOXIMA • ADJUVANTE", "body": "Organofosforado moderado/grave: iniciar cedo após começar atropina; não substitui atropina.\nACPC: 1–2 g IV em 30 min; depois 8–10 mg/kg/h (máx. 650 mg/h).\nAtaque: diluir em 100 mL SF 0,9%. Reduzir dose na disfunção renal.\nDuração: agente e evolução; confirmar sal/protocolo com CIATox."}, {"x": 1220, "y": 1460, "title": "SUPORTE / COMPLICAÇÕES", "body": "Convulsão/agitação: benzodiazepínico; proteger via aérea.\nChoque: volume cauteloso e vasopressor conforme perfusão.\nVigiar aspiração e arritmias.\nFraqueza cervical/proximal ou respiratória em 24–96 h: suspeitar síndrome intermediária; manter vigilância ventilatória."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • RESPIRAÇÃO + SECREÇÕES + PERFUSÃO", "body": "Durante ataque: reavaliar a cada 5 min; depois continuamente, com ajustes e documentação da dose total.\nSe broncorreia/broncoespasmo retornarem: novo bolus de atropina e aumentar infusão; rever ventilação.\nDelirium, hipertermia, íleo e retenção podem indicar excesso de atropina: ajustar com equipe, mantendo controle respiratório."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Desmame gradual da atropina após estabilidade; vigiar recidiva e fraqueza tardia."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever ventilação, exposição persistente, atropina e oxima; manter UTI/CIATox."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; hipóxia e intoxicação tratadas em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Carbamatos: atropina também é indicada; oxima deve ser individualizada pelo CIATox.\nSecreções controladas não excluem paralisia. Registrar agente, dose, resposta e necessidade de ventilação."}, "poster": "posters/27.png", "references": "Referências: AHA 2025 • Ministério da Saúde/Conitec • Atlantic Canada Poison Centre", "clinical": {"exams": "Avaliação clínica de secreções/broncoespasmo, ECG/PA/SpO₂/ETCO₂, glicemia, gasometria/lactato, eletrólitos e creatinina. Colinesterases ajudam a confirmar exposição, mas não definem atropinização nem devem atrasar tratamento. RX se aspiração/complicação respiratória.", "review": "Durante ataque, reavaliar a cada 5 min: broncorreia/ausculta, ventilação e perfusão. Se secreção volta, novo bolus e aumentar infusão. Vigiar delirium/hipertermia por excesso e fraqueza tardia/síndrome intermediária."}}, {"id": 28, "name": "Cianeto", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Exposição compatível + coma, choque, convulsão ou acidose láctica."}, {"x": 470, "y": 215, "title": "EMERGÊNCIA • CIATox + UTI", "body": "Incêndio em ambiente fechado, sais de cianeto ou nitroprussiato.\nFumaça + fuligem + alteração mental: investigar cianeto e CO."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "O₂ 100%, suporte vital e antídoto sem esperar confirmação."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e desfibrilar se indicado; ventilação com O₂ 100%.\nHidroxocobalamina urgente em paralelo.\nSem ROSC: manter ressuscitação e tratar causa; considerar suporte extracorpóreo em centro habilitado."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + SUPORTE IMEDIATO", "body": "Remover da exposição com EPI; O₂ 100%. IOT se falência respiratória, coma ou via aérea ameaçada.\nMonitor, ECG, acesso IV, gasometria/lactato, glicemia, eletrólitos, função renal e COHb/MetHb.\nColher amostras sem atrasar antídoto. Choque: volume + vasopressor; convulsão: benzodiazepínico.\nSuspender nitroprussiato se for a fonte. SpO₂ normal não exclui cianeto ou CO."}, "main": {"x": 650, "y": 1020, "title": "HIDROXOCOBALAMINA IV • PRIMEIRA ESCOLHA", "body": "Adulto: 5 g IV em 15 min. Suspeita alta de intoxicação grave: não aguardar cianeto sérico ou lactato para administrar.\nSe persistência/recorrência grave: repetir 5 g; total 10 g. Segunda dose em 15 min a 2 h conforme estado clínico.\nFrasco 5 g: reconstituir com 200 mL de SF 0,9%; inverter/balançar por ≥60 s, sem agitar. Usar equipo com filtro fornecido.\nVia exclusiva; não infundir simultaneamente com outros fármacos, especialmente nitrito/tiossulfato, no mesmo acesso."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento da intoxicação.\nReavaliar perfusão, ventilação, estado neurológico e acidose.\nPesquisar lesão por fumaça, CO, queimaduras e trauma associados."}], "supports": [{"x": 40, "y": 1460, "title": "DIAGNÓSTICO CLÍNICO", "body": "Lactato ≥8 mmol/L pode apoiar exposição isolada; em fumaça, ≥10 mmol/L aumenta suspeita.\nValores são pistas, não critérios únicos; não esperar exame no quadro grave.\nCO pode coexistir: co-oximetria e O₂ 100%; discutir oxigenoterapia hiperbárica conforme quadro."}, {"x": 650, "y": 1460, "title": "SEM HIDROXOCOBALAMINA", "body": "Acionar CIATox imediatamente.\nCianeto isolado: nitrito de sódio + tiossulfato conforme protocolo e risco de MetHb/hipotensão.\nFumaça/CO associado: preferir tiossulfato isolado como alternativa (AHA).\nTiossulfato: 12,5 g IV (50 mL a 25%) em 10 min; vigiar PA."}, {"x": 1220, "y": 1460, "title": "ADJUVANTE / SEGURANÇA", "body": "Tiossulfato pode ser associado à hidroxocobalamina com CIATox, em via separada.\nPersistência após 30 min: pode repetir 6,25 g (ACPC).\nHidroxocobalamina: vigiar hipertensão e anafilaxia; monitorar função renal por 7 dias.\nUrina/pele vermelhas: efeito esperado."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • PERFUSÃO + NEUROLOGIA + ACIDOSE", "body": "Após antídoto: ABCDE, PA/FC, consciência, diurese e tendência do lactato/pH; repetir conforme gravidade.\nPersistência do choque/coma: rever segunda dose, coexposição a CO, lesão inalatória e outras causas.\nAvisar laboratório e nefrologia: hidroxocobalamina interfere em exames colorimétricos/co-oximetria e alarmes de diálise."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter vigilância intensiva; documentar recuperação clínica/metabólica e função renal."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever antídoto e suporte; CIATox/UTI e transferência especializada se necessária."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; antídoto e ventilação em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não usar nitrito automaticamente em vítimas de fumaça: MetHb pode agravar a redução do transporte de O₂.\nA hidroxocobalamina não substitui ventilação/circulação nem trata a intoxicação por monóxido de carbono."}, "poster": "posters/28.png", "references": "Referências: AHA 2025 • DailyMed/Cyanokit • Atlantic Canada Poison Centre (ACPC)", "clinical": {"exams": "Gasometria/lactato, glicemia, eletrólitos, função renal, ECG e co-oximetria para CO/MetHb em fumaça. Dosagem de cianeto não deve atrasar tratamento. Colher antes da hidroxocobalamina se possível sem atraso; avisar sobre interferência em resultados.", "review": "Após antídoto, rever PA/perfusão, consciência e lactato/pH; repetição de 5 g só se quadro grave persiste/recorre. Investigar CO/lesão inalatória se sem resposta; avisar sobre interferência laboratorial."}}, {"id": 29, "name": "ROSC — abordagem inicial", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "SINAIS DE ROSC", "body": "Pulso/PA detectáveis, movimento ou aumento súbito do ETCO₂."}, {"x": 470, "y": 215, "title": "CONFIRMAR CIRCULAÇÃO ESPONTÂNEA", "body": "Na pausa apropriada: ritmo organizado + pulso central/PA.\nLimitar checagem a ≤10 s; ETCO₂ isolado não confirma ROSC."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Confirmar circulação e iniciar estabilização sem demora."}], "pcr": {"x": 40, "y": 615, "title": "NÃO / INCERTO • RCP", "body": "Sem pulso definido em ≤10 s: retomar compressões e seguir ACLS.\nRitmo organizado sem pulso = AESP.\nTratar 5H/5T; não interromper RCP somente porque o monitor mostra ritmo organizado."}, "assessment": {"x": 650, "y": 615, "title": "SIM • ESTABILIZAÇÃO IMEDIATA EM PARALELO", "body": "Registrar horário do ROSC; manter equipe, monitor/desfibrilador e acesso IV/IO.\nA/B: avaliar via aérea e ventilação; confirmar tubo com capnografia em onda. O₂ 100% até obter medida confiável.\nC: medir PA imediatamente; tratar hipotensão e arritmias; reavaliar perfusão.\nD/E: avaliar comandos, pupilas e glicemia; medir temperatura central e procurar causa/lesões associadas."}, "main": {"x": 650, "y": 1020, "title": "PRIMEIROS MINUTOS • METAS + EXAMES", "body": "Oxigenação: após leitura confiável, titular FiO₂ para SpO₂ 90–98% ou PaO₂ 60–105 mmHg; evitar hipóxia/hiperóxia.\nVentilação: PaCO₂ 35–45 mmHg, exceto acidemia grave que exige individualização; não hiperventilar automaticamente.\nCirculação: PAM ≥65 mmHg; fluidos conforme resposta/congestão e vasopressor em bomba se necessário.\nECG de 12 derivações; gasometria/lactato, glicemia, eletrólitos e função renal; eco/TC conforme hipótese e estabilidade."}, "rosc": [{"x": 40, "y": 1020, "title": "SE ROSC FOR CONFIRMADO", "body": "Passar para cuidados pós-PCR à direita.\nSe permanecer sem pulso: continuar algoritmo de PCR.\nQualquer perda posterior de circulação exige retorno imediato à RCP."}], "supports": [{"x": 40, "y": 1460, "title": "CAUSA / CORONÁRIAS", "body": "Continuar investigação e tratamento de 5H/5T; ROSC não prova resolução da causa.\nSupra persistente: avaliação coronária emergencial.\nSem supra: urgência se choque cardiogênico, arritmias ventriculares recorrentes ou isquemia grave.\nSem esses sinais: cateterismo imediato não é rotina."}, {"x": 650, "y": 1460, "title": "COMANDOS / TEMPERATURA", "body": "Avaliar antes da sedação, se possível; documentar confundidores.\nNão obedece ou avaliação incerta: controle deliberado de temperatura 32–37,5 °C, por ≥36 h (AHA).\nAvaliar crises e obter EEG se não obedece.\nTratar crises; mioclonia isolada não define prognóstico."}, {"x": 1220, "y": 1460, "title": "SUPORTE / DESTINO", "body": "UTI/centro capacitado; transporte com monitor, ventilação e infusões mantidos.\nEvitar glicemia <70 ou >180 mg/dL. Corrigir distúrbios conforme exames.\nSedoanalgesia conforme ventilação e PA; não ocultar exame sem registrar.\nRegistrar tempos, doses, ritmos e choques."}, {"title": "Medicamentos • apenas conforme problema", "body": "Não existe bolus de manutenção universal pós-ROSC. Hipotensão: noradrenalina em bomba, exemplo inicial 0,05–0,15 microgramas/kg/min, titulada para PAM ≥65 e perfusão. Dor/sedação: consultar os esquemas próprios de Analgesia/Sedação. Hipoglicemia: glicose 25 g IV e controle em 10–15 min. Antiarrítmico, antitrombótico, antibiótico e antídoto dependem da causa; adrenalina 1 mg em bolus não é manutenção com pulso."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • ABCDE APÓS CADA INTERVENÇÃO E DURANTE TRANSFERÊNCIA", "body": "Monitorização contínua; conferir PA, SpO₂, ETCO₂, ventilação, perfusão, consciência e temperatura.\nRepetir gasometria/lactato/eletrólitos conforme evolução; resposta inadequada exige nova busca da causa.\nPrognóstico neurológico multimodal e tardio, em geral ≥72 h após normotermia, com confundidores resolvidos."}, "outcomes": [{"x": 40, "y": 2260, "title": "METAS ATINGIDAS", "body": "Manter suporte e vigilância; avançar aos módulos específicos pós-PCR."}, {"x": 630, "y": 2260, "title": "ALTERAÇÃO PERSISTENTE", "body": "Agir sobre componente alterado: A/B, perfusão, ritmo, causa ou neurologia; reavaliar."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; desfibrilar se indicado e tratar causas reversíveis."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "ROSC = retorno da circulação espontânea. Ritmo organizado, SpO₂ ou ETCO₂ isolados não comprovam circulação.\nMetas restauradas exigem vigilância contínua; não encerrar cuidados porque os primeiros sinais normalizaram."}, "poster": "posters/29.png", "references": "Referências: AHA 2025 — Suporte Avançado de Vida e Cuidados Pós-PCR", "clinical": {"exams": "ECG de 12 derivações assim que possível, gasometria arterial/lactato, glicemia, Na/K/Mg/Ca, hemograma e creatinina; temperatura central, diurese e exame neurológico basal. Eco/US para causa/choque. TC de crânio/corpo ou angio-TC conforme hipótese e estabilidade; EEG se não despertar ou crises. Troponina elevada após PCR não define sozinha oclusão coronária.", "review": "Repetir ABCDE após cada intervenção; monitorização contínua, PAM ≥65, SpO₂ 90–98%, PaCO₂ 35–45, diurese/lactato e temperatura. Pulso perdido → PCR imediatamente. Sem comandos → controle térmico e EEG, sem prognóstico precoce."}}, {"id": 30, "name": "Oxigenação e ventilação", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto após ROSC: evitar hipóxia, hiperóxia e ventilação inadequada."}, {"x": 470, "y": 215, "title": "AVALIAR A/B IMEDIATAMENTE", "body": "Consciência, proteção da via aérea, esforço, SpO₂ e capnografia.\nGasometria arterial para PaO₂, PaCO₂ e pH."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Oxigenar e ventilar; manter perfusão em paralelo."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS imediatamente; ventilação conforme algoritmo de PCR.\nNão usar metas ventilatórias pós-PCR como substituto do protocolo de ressuscitação.\nPesquisar hipóxia e outras causas reversíveis."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • PRECISA DE VIA AÉREA / VENTILAÇÃO?", "body": "Apneia, ventilação ineficaz ou via aérea não protegida: bolsa-máscara com O₂ enquanto prepara via aérea avançada.\nComa persistente/falência respiratória: IOT por equipe habilitada; planejar risco de hipotensão e sedoanalgesia.\nConfirmar tubo com capnografia em onda; conferir fixação, profundidade, ausculta e expansão torácica.\nAcordado, protege via aérea e respira bem: pode dispensar IOT; ofertar O₂ conforme necessidade e monitorar."}, "main": {"x": 650, "y": 1020, "title": "VENTILAÇÃO PROTETORA + METAS GASOMÉTRICAS", "body": "O₂ 100% inicialmente até medida confiável; depois titular FiO₂ para SpO₂ 90–98% / PaO₂ 60–105 mmHg (AHA).\nVentilação mecânica: volume corrente 6–8 mL/kg de peso predito/ideal, calculado pela altura; não pelo peso real (ERC/RCUK).\nAjustar frequência/ventilação-minuto para PaCO₂ 35–45 mmHg; PEEP conforme oxigenação, mecânica e hemodinâmica.\nPaCO₂ arterial orienta ajuste: ETCO₂ pode subestimar PaCO₂ no choque. Avaliar pH e causa antes de corrigir números."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Retomar cuidados pós-PCR, algoritmo 29.\nConfirmar circulação e iniciar metas respiratórias à direita.\nSem ROSC: permanecer em RCP/ACLS e corrigir hipóxia em paralelo."}], "supports": [{"x": 40, "y": 1460, "title": "O₂ FORA DA META", "body": "SpO₂ <90% / PaO₂ <60: aumentar FiO₂ e avaliar tubo, secreções, pneumotórax, edema/aspiração e perfusão.\nAjustar PEEP conforme quadro, vigiando PA.\nSpO₂ >98% / PaO₂ >105: reduzir FiO₂ gradualmente, evitando dessaturação.\nLeitura duvidosa: confirmar por gasometria."}, {"x": 650, "y": 1460, "title": "CO₂ / PH ALTERADOS", "body": "PaCO₂ >45: aumentar ventilação-minuto e rever obstrução/espaço morto.\nPaCO₂ <35: reduzir ventilação-minuto; evitar hipocapnia iatrogênica.\nAcidemia metabólica grave: individualizar compensação, sem reduzir ventilação abruptamente.\nAuto-PEEP: ampliar expiração."}, {"x": 1220, "y": 1460, "title": "DETERIORAÇÃO SÚBITA", "body": "Conferir tubo deslocado/obstruído, pneumotórax e circuito.\nFalha ventilatória: ventilar manualmente; avaliar resistência/capnografia.\nPneumotórax hipertensivo: tratar sem esperar imagem.\nRever PA e retorno venoso."}, {"title": "Ventilação • ajuste inicial e peso predito", "body": "Após via aérea segura: volume corrente 6–8 mL/kg de peso predito, PEEP inicial em torno de 5 cmH₂O e FR inicial 10–12/min, depois ajustar pela gasometria, mecânica e doença pulmonar. Peso predito: homem 50 + 0,91 × (altura em cm −152,4); mulher 45,5 + 0,91 × (altura −152,4). Não usar peso real para volume. Analgesia/sedação em bomba conforme necessidade, sem ocultar hipotensão ou lesão neurológica."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • APÓS AJUSTES E DURANTE TRANSPORTE", "body": "Monitorar continuamente SpO₂, capnografia, ventilação e PA; repetir gasometria após ajustes relevantes.\nRever sincronia, pressões, volume expirado, pH e resposta clínica; tratar a causa da alteração.\nMetas atingidas: manter vigilância e reduzir suporte quando apropriado; perda do pulso → RCP imediata."}, "outcomes": [{"x": 40, "y": 2260, "title": "METAS ATINGIDAS", "body": "Manter FiO₂ mínima eficaz e ventilação protetora; planejar desmame conforme recuperação."}, {"x": 630, "y": 2260, "title": "ALTERAÇÃO PERSISTENTE", "body": "Rever causa e estratégia ventilatória; UTI/fisioterapia e suporte avançado."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar hipóxia e demais causas reversíveis."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "SpO₂ mede oxigenação, não ventilação. ETCO₂ não substitui PaCO₂ arterial no ajuste inicial.\nCO/cianeto exigem conduta específica; SDRA, DPOC e acidemia grave exigem individualização das metas."}, "poster": "posters/30.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • Resuscitation Council UK", "clinical": {"exams": "SpO₂ com curva, ETCO₂ e gasometria arterial após estabilização/ajuste ventilatório, em geral em 20–30 min ou antes se piora. Conferir altura/peso predito, volume, FR, PEEP, pressão de platô e tubo. RX/US para posição, aspiração, edema ou pneumotórax; gasometria para calibrar diferença ETCO₂–PaCO₂.", "review": "Após ajuste de FiO₂/VM, rever SpO₂/ETCO₂ imediatamente e gasometria em cerca de 20–30 min. Meta PaCO₂ 35–45, SpO₂ 90–98% pós-ROSC, pressão de platô ≤30 cmH₂O quando mensurável. Piora súbita → tubo, obstrução, pneumotórax e equipamento."}}, {"id": 31, "name": "Hemodinâmica e choque", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Após ROSC: hipotensão e hipoperfusão podem coexistir ou persistir."}, {"x": 470, "y": 215, "title": "AVALIAR CIRCULAÇÃO IMEDIATAMENTE", "body": "PA/PAM, ritmo, perfusão periférica, diurese e lactato.\nEco precoce: função ventricular, volume e causas obstrutivas."}, {"x": 1360, "y": 215, "title": "META INICIAL", "body": "PAM ≥65 mmHg (AHA); avaliar perfusão além da pressão."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS imediatos e desfibrilação conforme ritmo.\nBuscar 5H/5T; tratar causa do colapso em paralelo.\nNão manter apenas infusão vasoativa diante de perda do pulso."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • HIPOTENSÃO OU HIPOPERFUSÃO?", "body": "PAM <65 mmHg, alteração mental, extremidades frias, enchimento capilar lento, oligúria ou lactato elevado: avaliar e intervir.\nMonitor/ECG, acesso IV, gasometria/lactato, hemograma, eletrólitos e função renal; linha arterial assim que viável no choque.\nRever hipóxia, arritmia, sangramento, sedação, auto-PEEP e causas H/T. Eco/ultrassom sem atrasar suporte.\nPAM adequada com perfusão ruim: pesquisar baixo débito; não presumir estabilidade apenas pela PA."}, "main": {"x": 650, "y": 1020, "title": "TRATAR CONFORME PERFIL • FREQUENTEMENTE MISTO", "body": "Hipovolemia/responsividade provável e sem congestão: pequenos bolus de cristaloide, reavaliando perfusão e pulmões após cada um.\nHipotensão importante: vasopressor sem demora; não esperar grandes volumes. Noradrenalina é opção para vasoplegia.\nDisfunção miocárdica + baixo débito apesar de pré-carga/PA adequadas: considerar dobutamina; pode exigir vasopressor associado.\nObstrução/hemorragia/isquemia: tratamento específico imediato. Ausência de resposta exige rever o diagnóstico."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar cuidados pós-PCR (29).\nTratar choque e causa em paralelo.\nSem ROSC: permanecer em algoritmo de PCR."}], "supports": [{"x": 40, "y": 1460, "title": "VASOPRESSOR • EXEMPLO", "body": "Noradrenalina IV em bomba: início usual 0,05–0,15 mcg/kg/min de BASE; titular à PAM/perfusão (bula).\nConferir equivalência base/sal, concentração e peso. Preferir via central; vigiar acesso.\nAHA: não há evidência suficiente para um vasopressor único ideal pós-PCR."}, {"x": 650, "y": 1460, "title": "INOTRÓPICO • SE INDICADO", "body": "Dobutamina IV em bomba: iniciar 0,5–1 mcg/kg/min; titular em minutos; usual 2–20 (bula).\nSomente baixo débito/disfunção miocárdica; não tratar vasoplegia isolada com ela.\nVigiar queda de PA, taquicardia e ectopias. Associar vasopressor se necessário."}, {"x": 1220, "y": 1460, "title": "CAUSA / RESGATE", "body": "ECG: supra persistente ou choque com suspeita de isquemia → cardiologia/hemodinâmica urgente.\nTratar arritmias conforme ACLS com pulso; corrigir eletrólitos.\nChoque cardiogênico refratário: considerar suporte circulatório em casos selecionados.\nNão usar suporte mecânico de rotina."}, {"title": "Preparo • noradrenalina", "body": "Exemplo: 4 mg de noradrenalina BASE em volume final de 100 mL =40 microgramas/mL; conferir se ampola informa sal ou base, diluente/compatibilidade e dupla checagem. Vazão mL/h = dose (microgramas/kg/min) × peso ×60 ÷ concentração. Se acesso central não disponível, não atrasar vasopressor: usar veia periférica proximal adequada, bomba e vigilância frequente do sítio, com plano de acesso definitivo."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • APÓS BOLUS E CADA AJUSTE DE INFUSÃO", "body": "PA/PAM, ritmo, perfusão, consciência, diurese e tendência do lactato; repetir eco conforme evolução.\nSe congestão/sem resposta ao volume: interromper bolus e rever estratégia. Conferir bombas e acessos.\nPAM ≥65 com hipoperfusão persistente: rever débito, causa e metas individuais; desmame somente após estabilidade."}, "outcomes": [{"x": 40, "y": 2260, "title": "PERFUSÃO RESTAURADA", "body": "Manter vigilância e reduzir suporte gradualmente; acompanhar diurese e lactato."}, {"x": 630, "y": 2260, "title": "CHOQUE PERSISTENTE", "body": "Rever perfil, causa e tratamento; UTI/cardiologia e centro especializado."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatamente; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não existe dose ou prescrição vasoativa universal pós-PCR. Titular pela resposta e pelo perfil do choque.\nNão usar corticoide ou antiarrítmico profilático de rotina somente porque ocorreu PCR."}, "poster": "posters/31.png", "references": "Referências: AHA 2025 • ERC/RCUK 2025 • Bulas noradrenalina/dobutamina", "clinical": {"exams": "PA frequente/arterial se choque, ECG, diurese horária, lactato seriado, gasometria, hemograma, K/Mg/Ca e creatinina; eco para função ventricular e causa obstrutiva. Avaliar congestão e resposta dinâmica a fluido; PVC isolada não comprova responsividade. Buscar sangramento e infecção quando compatíveis.", "review": "Titular vasopressor pela PA a cada poucos minutos; rever perfusão, consciência e diurese horária. Após cada bolus, avaliar congestão e resposta. Lactato seriado, em geral 2–4 h no choque; falta de melhora exige rever causa e suporte."}}, {"id": 32, "name": "Investigação da causa / coronárias", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "ROSC não define a causa nem confirma que ela foi corrigida."}, {"x": 470, "y": 215, "title": "ESTABILIZAR E INVESTIGAR EM PARALELO", "body": "História pré-PCR, ritmo inicial, fármacos, exames e resposta à RCP.\nManter metas respiratórias e hemodinâmicas (30/31)."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Identificar causas que exigem intervenção imediata."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "Retomar RCP/ACLS, desfibrilação conforme ritmo e busca de 5H/5T.\nTratamento da causa em paralelo.\nNão atrasar ressuscitação para TC, troponina ou outros exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • EXAMES INICIAIS DIRECIONADOS", "body": "ECG de 12 derivações precocemente; repetir se traçado muito precoce, duvidoso ou evolução clínica.\nEco/POCUS: função ventricular, alterações segmentares, VD, derrame e outras causas relevantes.\nGasometria/lactato, glicemia, K/Mg/Ca, função renal e hemograma; troponina e exames adicionais conforme hipótese.\nBuscar pistas: dor torácica, dispneia, sangramento, febre, déficit focal, exposição tóxica e procedimentos recentes."}, "main": {"x": 650, "y": 1020, "title": "DECISÃO CORONÁRIA • ECG + CLÍNICA", "body": "Supra persistente + suspeita cardíaca: coronariografia emergencial, mesmo em coma.\nSem supra + choque cardiogênico, arritmias ventriculares recorrentes/refratárias ou isquemia grave: considerar cateterismo urgente.\nSem supra, estável e sem isquemia grave: estratégia diferida/seletiva com cardiologia; cateterismo imediato não é rotina.\nSuspeita cardíaca: coronariografia antes da alta; sobretudo ritmo chocável, disfunção de VE inexplicada ou isquemia grave."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar estabilização (29).\nSem ROSC: manter algoritmo de PCR.\nCom ROSC: continuar investigação e tratamento causal à direita."}], "supports": [{"x": 40, "y": 1460, "title": "CAUSAS H • REVER", "body": "Hipovolemia/hemorragia: controlar perda; volume/hemoderivados conforme causa.\nHipóxia: corrigir via aérea, ventilação e doença pulmonar.\nAcidose: tratar causa/perfusão; bicarbonato não é automático.\nHipo/hipercalemia e hipotermia: seguir algoritmos específicos e reavaliar."}, {"x": 650, "y": 1460, "title": "CAUSAS T • REVER", "body": "Pneumotórax hipertensivo: descompressão sem esperar imagem no instável.\nTamponamento: drenagem urgente conforme contexto.\nTEP: imagem se viável; reperfusão conforme risco/quadro.\nTrombose coronária: reperfusão.\nToxinas: suporte e antídoto específico com CIATox."}, {"x": 1220, "y": 1460, "title": "IMAGEM / OUTRAS CAUSAS", "body": "TC dirigida à hipótese e estabilidade: crânio, tórax/angio-TC, abdome/pelve.\nDéficit focal/cefaleia pré-PCR: investigar causa neurológica.\nHipóxia/dispneia pré-PCR: investigar TEP e causas respiratórias.\nRever trauma da RCP, sangramento e aspiração."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • HIPÓTESE + RESPOSTA AO TRATAMENTO", "body": "Após intervenção: ABCDE, ECG, perfusão e lactato/gasometria; revisar exames pendentes.\nSem resposta: ampliar diferencial e repetir avaliação/eco; mais de uma causa pode coexistir.\nDocumentar causa, intervenção definitiva, complicações e prevenção de recorrência."}, "outcomes": [{"x": 40, "y": 2260, "title": "CAUSA CONTROLADA", "body": "Manter cuidados pós-PCR e vigilância; planejar investigação e prevenção secundária."}, {"x": 630, "y": 2260, "title": "CAUSA INCERTA / PIORA", "body": "Reavaliar H/T e outras hipóteses; discutir especialistas e transferência com suporte."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Troponina elevada após PCR não comprova oclusão coronária aguda; interpretar ECG, clínica e imagem.\nAnticoagulação e trombólise dependem da causa, do risco de sangramento e das contraindicações."}, "poster": "posters/32.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • Resuscitation Council UK", "clinical": {"exams": "ECG seriado/derivações adicionais, troponina interpretada no contexto, gasometria/lactato, glicemia, eletrólitos, hemograma e rim. Eco/US à beira-leito; angio-TC se TEP/dissecção conforme estabilidade, TC de crânio se causa neurológica; testes toxicológicos dirigidos. Não atrasar reperfusão em supra persistente/instabilidade isquêmica.", "review": "Reavaliar hipótese após ECG/eco/labs e após intervenção; isquemia persistente, choque ou arritmias recorrentes exigem avaliação coronária urgente. Sem supra e estável, não indicar cateterismo emergencial automaticamente só por PCR."}}, {"id": 33, "name": "Avaliação neurológica", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Avaliar após ROSC; coma inicial não define o prognóstico."}, {"x": 470, "y": 215, "title": "ESTABILIZAÇÃO + EXAME NEUROLÓGICO", "body": "Corrigir ameaças do ABC antes de interpretar o exame.\nRegistrar horário do ROSC, estado prévio, sedação e temperatura."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Detectar causas tratáveis e evitar lesão cerebral secundária."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "Retomar RCP/ACLS e desfibrilação conforme ritmo.\nTratar causas reversíveis em paralelo.\nNão interromper ressuscitação para exame neurológico ou EEG."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + EXAME DOCUMENTADO", "body": "A/B: proteção de via aérea, SpO₂ e gasometria; seguir algoritmo 30.\nC: pressão/perfusão; evitar hipotensão (31). D: glicemia e temperatura.\nRegistrar Glasgow por componentes (E/V/M); em IOT, anotar verbal não testável. Testar abertura ocular e comandos simples.\nExaminar pupilas/fotorreação, melhor resposta motora e simetria; registrar reflexos corneanos quando indicado e movimentos anormais."}, "main": {"x": 650, "y": 1020, "title": "OBEDECE A COMANDOS? • DEFINIR A PRÓXIMA CONDUTA", "body": "SIM: examinar orientação, linguagem, força e déficits focais; investigar alterações novas. Manter vigilância pós-PCR.\nNÃO ou exame não confiável: proteger via aérea conforme necessidade, pesquisar confundidores e obter EEG prontamente.\nComa persistente: estratégia de temperatura (34), cuidados de UTI e avaliações seriadas. Não aguardar despertar para tratar causas.\nConvulsão ou mioclonia: avaliar imediatamente; seguir ramo EEG/crises abaixo."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR (29).\nSem ROSC: manter algoritmo de PCR.\nCom ROSC: seguir avaliação neurológica à direita."}], "supports": [{"x": 40, "y": 1460, "title": "CAUSAS / CONFUNDIDORES", "body": "Rever sedativos, opioides, bloqueadores neuromusculares e exposição tóxica.\nPesquisar hipoglicemia, hipóxia, choque, distúrbios de CO₂/eletrólitos e temperatura.\nCorrigir o que estiver alterado; considerar depuração renal/hepática lenta.\nSedação: titular; pausa só se segura."}, {"x": 650, "y": 1460, "title": "EEG • CRISES / MIOCLONIA", "body": "Sem comandos: EEG precoce; repetir ou monitorar continuamente conforme quadro.\nConvulsão clínica: tratar sem aguardar EEG; protocolo de crises (35).\nMioclonia: EEG para definir correlação; movimento isolado não prova crise.\nSem correlato EEG: não suprimir a mioclonia."}, {"x": 1220, "y": 1460, "title": "IMAGEM • URGÊNCIAS", "body": "Déficit focal, anisocoria nova ou deterioração: neurologia e TC urgente, após estabilização.\nPesquisar hemorragia, AVC, edema e outras causas conforme história.\nTC/angio-TC conforme hipótese; protocolo causal se indicado.\nTC inicial normal não exclui lesão hipóxico-isquêmica."}, {"title": "Intervenções dirigidas", "body": "Coma não indica sedação adicional automática. Corrigir hipoglicemia com glicose 25 g IV e reavaliar em 10–15 min; corrigir oxigenação, CO₂, PA e temperatura. Convulsão verdadeira segue benzodiazepínico/carga no tema Convulsões. Não administrar anticonvulsivante profilático a todo paciente pós-PCR."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • REGISTRAR A EVOLUÇÃO", "body": "Reexaminar após intervenções; exame diário mínimo, mais frequente se instável.\nComparar pupilas, comandos, resposta motora e crises; registrar sinais vitais, sedação e temperatura.\nPiora: repetir ABCDE/glicemia, revisar fármacos e discutir EEG/imagem urgente."}, "outcomes": [{"x": 40, "y": 2260, "title": "DESPERTA / MELHORA", "body": "Manter vigilância; avaliar cognição, deglutição e necessidades de reabilitação."}, {"x": 630, "y": 2260, "title": "COMA PERSISTENTE", "body": "Continuar suporte e investigação. Prognóstico multimodal no momento adequado (37)."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não concluir prognóstico por coma precoce, mioclonia isolada ou exame sob sedação/bloqueio neuromuscular.\nAHA: integrar prognóstico ≥72 h após normotermia e suspensão dos sedativos, sem confundidores (37)."}, "poster": "posters/33.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • Resuscitation Council UK", "clinical": {"exams": "Exame seriado: resposta a comandos, pupilas, motor, reflexos e Glasgow; registrar sedação/bloqueio e temperatura. Glicemia, gasometria, Na/K/Ca/Mg, rim/fígado. EEG precoce nos que não seguem comandos; TC se hemorragia/AVC/trauma suspeitos. Achado isolado precoce não define prognóstico.", "review": "Exame neurológico seriado e após ajuste seguro de sedação; glicemia/temperatura/ventilação ao mudar consciência. Nova assimetria pupilar/déficit → investigar lesão estrutural urgente. Não interpretar exame sob bloqueio como prognóstico."}}, {"id": 34, "name": "Controle de temperatura", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto após ROSC: medir temperatura e avaliar resposta a comandos."}, {"x": 470, "y": 215, "title": "ESTABILIZAR + PLANEJAR O CONTROLE", "body": "Manter ABCDE e tratamento da causa da PCR em paralelo.\nRegistrar temperatura inicial, método, meta e horários das fases."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Evitar febre e oscilações térmicas no paciente comatoso."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e desfibrilação conforme ritmo; tratar 5H/5T.\nNão atrasar ressuscitação para resfriamento.\nHipotermia acidental como causa: seguir algoritmo específico (6)."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • AVALIAÇÃO E MONITORIZAÇÃO", "body": "Confirmar ROSC e avaliar se obedece a comandos; considerar sedação residual (33).\nMedir temperatura central continuamente se controle ativo: sonda esofágica, vesical ou intravascular conforme disponibilidade.\nMonitorar ECG, pressão/perfusão, SpO₂, diurese e pele; gasometria, glicemia, K/Mg/P e função renal conforme evolução.\nTemperatura periférica isolada não orienta com precisão as fases do controle."}, "main": {"x": 650, "y": 1020, "title": "OBEDECE A COMANDOS? • META E DURAÇÃO", "body": "SIM: monitorar temperatura e tratar febre/causa; hipotermia induzida não é rotina.\nNÃO: iniciar estratégia protocolizada. AHA 2025: meta constante entre 32–37,5 °C; controle total por ≥36 h.\nERC/ESICM 2025: prevenir ativamente febre, alvo ≤37,5 °C por 36–72 h enquanto comatoso.\nDefinir meta com UTI/protocolo local; não há indicação universal de resfriar todos a 33 °C. Duração total inclui prevenção de febre."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar cuidados pós-PCR (29).\nSem ROSC: manter RCP e tratamento causal.\nCom ROSC: seguir decisão de temperatura à direita."}], "supports": [{"x": 40, "y": 1460, "title": "EXECUTAR • META TÉRMICA", "body": "Usar dispositivo de superfície ou endovascular com feedback, se disponível.\nAcima da meta: conferir sensor; antitérmico e controle ativo conforme protocolo.\nInvestigar infecção e outras causas de febre em paralelo.\nHipotermia espontânea 32–36 °C: não aquecer ativamente só para normotermia."}, {"x": 650, "y": 1460, "title": "TREMOR • CONFORTO", "body": "Avaliar tremores e diferenciar de convulsões; EEG se dúvida.\nAjustar analgesia e sedação, preferindo agentes de curta ação e vigiando pressão.\nTremor refratário: considerar bloqueio neuromuscular conforme protocolo, sem uso rotineiro.\nManter sedoanalgesia; bloqueio pode ocultar crises."}, {"x": 1220, "y": 1460, "title": "REAQUECER • SE INDICADO", "body": "Após fase de hipotermia prevista no protocolo: reaquecimento controlado.\nTaxa usual 0,25–0,5 °C/h; evitar >0,5 °C/h (AHA).\nVigiar pressão, ritmo, glicemia e K; ajustar reposição/insulina aos valores medidos.\nApós reaquecer: continuar prevenção de febre; evitar rebote."}, {"title": "Tremor/temperatura • suporte", "body": "Tratar dor e tremor com aquecimento periférico e analgesia/sedação tituladas, sem perder vigilância hemodinâmica. Paracetamol pode ser usado se indicado: adulto ≥50 kg, 1 g VO/IV a cada 6–8 h, máximo 4 g/dia, reduzindo limite em doença hepática/risco. Não substitui sistema de controle térmico quando necessário. Bloqueio neuromuscular somente selecionado, com sedação/analgesia e monitorização; mascara crises."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • RESPOSTA E COMPLICAÇÕES", "body": "Temperatura central contínua; reavaliar após cada ajuste: meta, tremores, perfusão e integridade da pele.\nRepetir glicemia/eletrólitos/gasometria conforme fase e alterações; intensificar no reaquecimento.\nFora da meta ou instável: revisar sensor/dispositivo, sedação, infecção e complicações; ajustar com UTI."}, "outcomes": [{"x": 40, "y": 2260, "title": "META ATINGIDA", "body": "Manter plano térmico e monitorização até completar duração; documentar resposta."}, {"x": 630, "y": 2260, "title": "ALTERAÇÃO / PIORA", "body": "Tratar choque, arritmia, distúrbios metabólicos e febre conforme causa; rever meta com UTI."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retomar imediatamente RCP/ACLS; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não usar rotineiramente grandes volumes de fluido IV gelado para resfriamento pós-ROSC.\nHipotermia/sedação confundem exame neurológico; prognóstico multimodal no tempo adequado (37)."}, "poster": "posters/34.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • AHA/NCS (cuidados intensivos)", "clinical": {"exams": "Temperatura central contínua, PA/ECG, glicemia, K/Mg/Ca, gasometria e balanço/diurese. Monitorar pele, tremor, infecção e sedação. No reaquecimento, maior vigilância de K e PA; não usar temperatura periférica para guiar controle estreito.", "review": "Temperatura central contínua e checagem frequente de tremor/PA/glicemia. Manter controle térmico ≥36 h se não segue comandos, com alvo escolhido 32–37,5 °C. Reaquecer lentamente quando indicado; vigiar K/hipotensão."}}, {"id": 35, "name": "Convulsões e mioclonias", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Convulsão, abalos ou coma persistente após ROSC exigem avaliação."}, {"x": 470, "y": 215, "title": "SUPORTE + IDENTIFICAR CRISES", "body": "Registrar início/duração, movimentos e fármacos administrados.\nAcionar UTI/neurologia e obter EEG prontamente."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Tratar crises; distinguir mioclonia de atividade epiléptica."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "Retomar RCP/ACLS e desfibrilação conforme ritmo.\nTratar causas reversíveis em paralelo.\nNão atrasar ressuscitação para EEG ou anticonvulsivantes."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + DEFINIR A SITUAÇÃO", "body": "Proteger via aérea; O₂/ventilação e perfusão conforme necessidade. ECG, SpO₂, pressão, acesso IV e glicemia imediata.\nCorrigir hipoglicemia e distúrbios de Na/Ca/Mg; pesquisar hipóxia, tóxicos e lesão cerebral. Não atrasar tratamento da crise.\nConvulsão ≥5 min ou recorrente sem recuperação: estado de mal; iniciar resgate imediatamente. Se duração desconhecida, não esperar.\nMioclonia isolada: EEG para classificar; ausência de movimentos sob bloqueio neuromuscular não exclui crise."}, "main": {"x": 650, "y": 1020, "title": "ESTADO DE MAL CONVULSIVO • BENZODIAZEPÍNICO", "body": "Escolher UMA opção: lorazepam 0,1 mg/kg IV (máx. 4 mg/dose) OU diazepam 0,15–0,2 mg/kg IV (máx. 10 mg/dose), lentamente.\nSe persistir, pode repetir UMA vez; reavaliar em cerca de 5 min e preparar segunda linha sem atrasos.\nSem acesso IV: midazolam 10 mg IM, dose única em adulto >40 kg (5 mg se 13–40 kg); obter acesso em paralelo.\nVigiar depressão respiratória/hipotensão. Convulsão clínica: tratar sem esperar EEG; crise só no EEG: discutir tratamento dirigido."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar suporte pós-PCR (29).\nSem ROSC: manter algoritmo de PCR.\nCom ROSC: continuar avaliação e tratamento à direita."}], "supports": [{"x": 40, "y": 1460, "title": "PERSISTE • SEGUNDA LINHA", "body": "Escolher carga IV: levetiracetam 60 mg/kg (máx. 4.500 mg), em 10 min; OU valproato 40 mg/kg (máx. 3.000 mg), em 10 min.\nLevetiracetam: manutenção ajustada à função renal.\nValproato: evitar em hepatopatia grave, doença mitocondrial e gestação; avaliar plaquetas.\nConfirmar dose efetivamente infundida."}, {"x": 650, "y": 1460, "title": "EEG • MIOCLONIA", "body": "Sem comandos: EEG precoce; repetido/contínuo conforme quadro.\nMioclonia com crise no EEG: tratar atividade epiléptica.\nSem correlato EEG: não suprimir mioclonia rotineiramente.\nPadrões ictais-interictais: discussão especializada; pode caber teste com fármaco não sedativo."}, {"x": 1220, "y": 1460, "title": "REFRATÁRIO • UTI + EEG", "body": "Persiste após benzodiazepínico + carga adequada: IOT/VM e EEG contínuo; anestesia IV.\nExemplo: midazolam 0,2 mg/kg IV lentamente; iniciar 0,1 mg/kg/h e titular ao EEG/perfusão.\nFaixa ENLS: 0,05–2 mg/kg/h, sob equipe especializada.\nPreparar suporte hemodinâmico; manter anticonvulsivante."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • CONTROLE CLÍNICO E ELETROGRÁFICO", "body": "Após cada etapa: crises, ventilação, pressão, perfusão e glicemia; confirmar doses e acesso.\nCessou movimento, mas segue sem comandos: investigar crise não convulsiva e sedação residual com EEG.\nControle confirmado: manutenção individualizada, tratar causa e planejar retirada gradual da anestesia com UTI/EEG."}, "outcomes": [{"x": 40, "y": 2260, "title": "CRISES CONTROLADAS", "body": "Manter vigilância e EEG conforme risco; prevenir recorrência e corrigir a causa."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / RECIDIVA", "body": "Rever doses, causas e EEG; escalonar tratamento com neurologia/UTI."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não prescrever anticonvulsivante profilático rotineiramente após PCR sem crises.\nMioclonia isolada não define prognóstico; sedação/bloqueio podem mascarar sinais clínicos (33/37)."}, "poster": "posters/35.png", "references": "Referências: AHA/ERC 2025 • AES • ESETT • NCS/ENLS 6.0", "clinical": {"exams": "Glicemia imediata, Na/K/Ca/Mg, gasometria, função renal/hepática e níveis de anticonvulsivantes quando aplicáveis. EEG contínuo ou seriado urgente se coma/crises/mioclonia após PCR. TC se lesão estrutural possível; não atrasar benzodiazepínico em estado de mal.", "
