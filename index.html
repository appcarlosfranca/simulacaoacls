review": "Contar duração real da crise; reavaliar em 3–5 min após benzodiazepínico e prontamente após carga. Se persiste, segunda linha sem atraso; refratário → via aérea, anestésico e EEG em UTI. Mioclonia sem correlato EEG não exige supressão rotineira."}}, {"id": 36, "name": "Controle metabólico", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Após ROSC: distúrbios metabólicos podem manter coma, choque e arritmias."}, {"x": 470, "y": 215, "title": "SUPORTE + EXAMES + CORREÇÃO DIRIGIDA", "body": "Manter ABCDE e tratar a causa da PCR em paralelo.\nRever insulina, soluções infundidas, função renal e temperatura."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Corrigir alterações graves e evitar supercorreção."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e desfibrilação conforme ritmo.\nInvestigar 5H/5T e tratar causas metabólicas em paralelo.\nNão administrar bicarbonato ou cálcio rotineiramente: usar quando houver indicação específica."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • AVALIAÇÃO INICIAL", "body": "ECG contínuo, pressão/perfusão, consciência, temperatura, diurese e balanço hídrico. Glicemia imediata.\nGasometria com pH/PaCO₂/HCO₃⁻ e lactato; Na/K/Mg, cálcio ionizado, fósforo, ureia/creatinina.\nSe choque ou resultado incompatível: confirmar glicemia em amostra arterial/venosa; não atrasar resgate de hipoglicemia sintomática.\nRever hemólise/pseudohipercalemia, perdas, fármacos, nutrição e exposição tóxica."}, "main": {"x": 650, "y": 1020, "title": "GLICEMIA <70 mg/dL? • TRATAR E REAVALIAR", "body": "SIM, consciente e deglutição segura: glicose 15–30 g VO. Reavaliar em 15 min; repetir se necessário até >100 mg/dL (SBD).\nRebaixamento/sem via enteral segura: glicose IV em bolus lento; se grave, 20–30 g. Exemplo: 25 g = 50 mL de glicose 50%; vigiar acesso.\nSem acesso IV: glucagon 1 mg IM/SC enquanto obtém acesso; resposta pode ser limitada no jejum prolongado/hepatopatia.\nApós resgate: repetir glicemia em 15 min, prevenir recorrência e ajustar insulina/dieta; considerar infusão de glicose se recorrente."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar cuidados pós-PCR (29).\nSem ROSC: continuar ressuscitação e tratamento causal.\nCom ROSC: seguir correção metabólica à direita."}], "supports": [{"x": 40, "y": 1460, "title": "HIPERGLICEMIA • UTI", "body": "Persistente ≥180 mg/dL: insulina por protocolo IV validado.\nMeta usual: 140–180 mg/dL (ADA). Evitar hipoglicemia.\nGlicemia a cada 1 h no início/ajustes; espaçar conforme protocolo.\nCAD/EHH: protocolo específico."}, {"x": 650, "y": 1460, "title": "ELETRÓLITOS • ECG", "body": "K alto + ECG alterado: tratar sem esperar repetição se compatível (5).\nK baixo grave/arrítmico: reposição monitorizada e correção de Mg (4/42).\nNa, Ca ionizado, Mg e P: corrigir conforme gravidade, função renal e protocolo.\nEvitar reposição empírica excessiva; KCl nunca IV direto."}, {"x": 1220, "y": 1460, "title": "ACIDOSE • RIM / PERFUSÃO", "body": "Separar componente respiratório e metabólico; comparar lactato seriado.\nCorrigir ventilação, choque, hipóxia e causa; bicarbonato não é automático (3).\nAcidose/hipercalemia refratárias ou sobrecarga com LRA: discutir diálise urgente.\nRever tóxicos, cetose, perdas e função renal."}, {"title": "Insulina IV • preparo e exemplo selecionado", "body": "Hiperglicemia persistente ≥180 mg/dL em duas medidas: preparar insulina REGULAR em bomba, exemplo 50 UI em SF 0,9%, volume final 50 mL =1 UI/mL; usar linha identificada e dupla checagem. Em adulto crítico SEM diabetes conhecido, sem CAD/EHH, com glicemia >180–270 mg/dL, um esquema de referência inicia 2 UI/h (2 mL/h); em <50 kg, insuficiência renal/hepática ou alta sensibilidade, considerar 1 UI/h. Não aplicar automaticamente a diabetes tipo 1, CAD/EHH, gravidez ou insulina em alta dose para toxinas. Garantir aporte nutricional/glicose e glicemia horária; ajustar pela glicemia atual, tendência e sensibilidade, buscando usualmente 140–180 mg/dL. Se alimentação interrompe, revisar insulina/aporte imediatamente. Hipoglicemia: parar infusão, corrigir e repetir glicemia em 10–15 min; reinício exige dose reduzida e revisão da causa. Não há uma dose fixa segura para todos os pacientes."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • APÓS CADA CORREÇÃO", "body": "Rever ABCDE, ECG, perfusão, diurese e balanço; repetir o exame que motivou a intervenção.\nHipoglicemia: 15 min; insulina IV: controle frequente. Repetir eletrólitos/gasometria conforme gravidade e reposição.\nReaquecimento: intensificar controle de glicose/K; ajustar insulina e reposição."}, "outcomes": [{"x": 40, "y": 2260, "title": "VALORES CORRIGIDOS", "body": "Manter vigilância e tratar causa; ajustar nutrição e prescrição para prevenir recorrência."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever diagnóstico, doses, perdas e rim; ampliar investigação e discutir UTI/nefrologia."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retomar RCP/ACLS imediatamente; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não buscar glicemia de 80–110 mg/dL com controle intensivo rotineiro; priorizar evitar hipoglicemia.\nHiperglicemia de estresse não confirma diabetes; alterações de Na exigem correção controlada."}, "poster": "posters/36.png", "references": "Referências: AHA/ERC 2025 • ADA 2026 • Sociedade Brasileira de Diabetes 2026", "clinical": {"exams": "Glicemia seriada, Na/K/Mg/Ca/fósforo, gasometria/lactato, ureia/creatinina e diurese. Se hiperglicemia + acidose: cetonas/beta-hidroxibutirato e osmolalidade. Verificar nutrição, insulina, corticosteroides e nefrotoxicidade; discrepância entre capilar e clínica exige amostra plasmática.", "review": "Glicemia em 10–15 min após correção de hipoglicemia; sob insulina IV, controle horário e após mudanças. Evitar <70 e >180 mg/dL no pós-PCR; reavaliar K/rim/gasometria segundo distúrbio. Não perseguir controle glicêmico estrito com risco de hipoglicemia."}}, {"id": 37, "name": "Prognóstico neurológico", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Coma após ROSC exige suporte e avaliação seriada; não prevê sozinho o desfecho."}, {"x": 470, "y": 215, "title": "AVALIAÇÃO MULTIMODAL • EQUIPE + FAMÍLIA", "body": "Registrar ROSC, reaquecimento e última dose de sedativos.\nComunicar cedo a incerteza e o plano de avaliação."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Evitar conclusão precoce ou baseada em um único exame."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e tratamento das causas reversíveis.\nPrognóstico neurológico tardio não orienta isoladamente a ressuscitação atual.\nNão atrasar RCP para exames prognósticos."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • EXAME E EXCLUSÃO DE CONFUNDIDORES", "body": "Manter suporte pós-PCR; examinar diariamente consciência, comandos, pupilas/reflexos e melhor resposta motora.\nRever sedativos, opioides, bloqueio neuromuscular e intoxicação; considerar dose cumulativa e função renal/hepática.\nCorrigir hipotermia, choque, hipóxia, distúrbios de glicose/eletrólitos e crises; documentar o que ainda limita o exame.\nJá obedece a comandos: avaliar déficits e reabilitação; não aplicar algoritmo de coma como se persistisse inconsciente."}, "main": {"x": 650, "y": 1020, "title": "TEMPO ADEQUADO + EXAME CONFIÁVEL?", "body": "AHA 2025: integrar avaliação ≥72 h após normotermia e suspensão dos sedativos, com efeitos residuais excluídos.\nERC 2025: avaliação formal em paciente sem comandos ≥72 h após ROSC, sem confundidores; considerar reaquecimento/depuração.\nAINDA NÃO: manter suporte, corrigir confundidores, coletar exames em suas janelas e reavaliar. O relógio sozinho não valida o exame.\nSIM: integrar clínica, neurofisiologia, imagem e biomarcadores com equipe experiente; buscar concordância entre modalidades."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar cuidados pós-PCR (29).\nSem ROSC: manter ressuscitação.\nCom ROSC: seguir avaliação à direita, sem interromper suporte."}], "supports": [{"x": 40, "y": 1460, "title": "CLÍNICA • NÃO ISOLAR", "body": "Ausência bilateral de reflexos pupilares/corneanos ≥72 h: sinal desfavorável apenas no conjunto.\nResposta motora ausente/extensora isolada não basta.\nMioclonia: caracterizar e obter EEG; não concluir por abalos isolados.\nDespertar e resposta motora em melhora favorecem recuperação."}, {"x": 650, "y": 1460, "title": "EEG / POTENCIAL EVOCADO", "body": "EEG precoce para crises (35); contexto/drogas alteram interpretação prognóstica.\nAHA: surto-supressão ≥72 h sem sedação pode apoiar mau prognóstico.\nN20 bilateralmente ausente ≥48 h (AHA): confirmar qualidade técnica e integrar outros exames.\nEEG contínuo sem descargas pode ser favorável."}, {"x": 1220, "y": 1460, "title": "IMAGEM / BIOMARCADORES", "body": "TC: edema extenso; leitura especializada. TC inicial normal não exclui lesão.\nRM: difusão extensa em 2–7 dias (AHA).\nNSE/NfL altos até 72 h: integrar demais exames.\nRever hemólise, método e tendência; nunca isoladamente."}, {"title": "Medicamentos e confundidores", "body": "Não há medicamento para “confirmar” mau prognóstico. Documentar última dose e duração de sedativos/analgésicos/bloqueadores, função renal/hepática e temperatura; permitir eliminação adequada. Reduzir sedação somente se clinicamente seguro, sem interromper tratamento de convulsões ou conforto necessário."}], "review": {"x": 100, "y": 1960, "title": "INTEGRAR • CONCORDÂNCIA E REAVALIAÇÃO", "body": "Concordância entre modalidades aumenta certeza; ERC usa ≥2 preditores no contexto validado.\nDiscordância ou exame duvidoso: rever técnica/confundidores, repetir e prolongar observação.\nRegistrar fundamentos e limitações; não despertar no prazo mínimo não comprova irreversibilidade."}, "outcomes": [{"x": 40, "y": 2260, "title": "SINAIS FAVORÁVEIS", "body": "Continuar suporte e reabilitação; avaliar déficits cognitivos e funcionais."}, {"x": 630, "y": 2260, "title": "INCERTO / DISCORDANTE", "body": "Manter observação e avaliações seriadas; esclarecer incerteza à família."}, {"x": 1220, "y": 2260, "title": "DESFAVORÁVEL • CONJUNTO", "body": "Discussão multidisciplinar com família: valores do paciente, comorbidades e objetivos de cuidado."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Prognóstico neurológico não é diagnóstico de morte encefálica; esta exige protocolo específico.\nDecisões sobre limites de suporte exigem avaliação global e preferências do paciente, além do prognóstico."}, "poster": "posters/37.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • Resuscitation Council UK", "clinical": {"exams": "Exame neurológico seriado após resolver sedação, bloqueio, hipotermia e alterações metabólicas; EEG, potenciais evocados somatossensitivos, TC/RM e biomarcadores conforme disponibilidade. Integrar testes concordantes em janela apropriada, em geral ≥72 h após normotermia e eliminação de sedativos; nenhum teste isolado basta.", "review": "Reavaliar quando confundidores resolvidos; prognóstico multimodal em janela tardia, em geral ≥72 h após normotermia. Resultados discordantes → ampliar observação e repetir avaliação, sem conclusão isolada."}}, {"id": 38, "name": "Reavaliação e deterioração", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "GATILHOS", "body": "Dessaturação, queda de PA, arritmia, oligúria ou piora da consciência."}, {"x": 470, "y": 215, "title": "REAVALIAR SEMPRE QUE HOUVER MUDANÇA", "body": "Chamar ajuda; preparar monitor/desfibrilador e via aérea.\nRepetir ABCDE; conferir dispositivos e infusões."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Reconhecer nova PCR e tratar a ameaça imediata."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • NOVA PCR", "body": "Paciente inconsciente, sem respiração normal: verificar pulso por ≤10 s.\nSem pulso definido: RCP/ACLS imediato; desfibrilar FV/TV sem pulso.\nTratar 5H/5T em paralelo; não esperar exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + MONITORIZAÇÃO", "body": "A: permeabilidade/proteção da via aérea; conferir tubo, fixação e capnografia.\nB: SpO₂, expansibilidade, ausculta, ventilação e gasometria; conferir circuito e pressões do ventilador.\nC: ritmo, PA/PAM, perfusão, sangramento, acessos e bombas. ECG de 12 derivações e eco/POCUS conforme quadro.\nD/E: consciência/pupilas, glicemia, crises, temperatura, exposição e lesões. Colher exames dirigidos sem atrasar intervenção."}, "main": {"x": 650, "y": 1020, "title": "QUAL ALTERAÇÃO EXIGE AÇÃO AGORA?", "body": "Hipoxemia/ventilação inadequada: corrigir via aérea/equipamento e causa respiratória; seguir ramo A/B (30).\nPAM <65 mmHg ou hipoperfusão: tratar choque conforme mecanismo e resposta; seguir ramo C (31).\nArritmia com instabilidade atribuível ao ritmo: intervenção elétrica/ACLS conforme tipo; não aguardar exames.\nRebaixamento/crises/febre/distúrbios metabólicos: corrigir causas tratáveis e investigar; seguir ramo D/E (33–36)."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE COM NOVO ROSC", "body": "Confirmar circulação e retomar suporte pós-PCR (29).\nSem ROSC: continuar ressuscitação.\nCom ROSC: reavaliar causa da recorrência e seguir à direita."}], "supports": [{"x": 40, "y": 1460, "title": "A/B • QUEDA DE SpO₂", "body": "Conferir leitura e oferecer O₂ enquanto corrige hipoxemia; ventilar se necessário.\nNo intubado: buscar deslocamento/obstrução do tubo, pneumotórax e falha do circuito.\nVentilação manual se falha mecânica; aspirar se obstrução.\nPneumotórax hipertensivo: descomprimir sem esperar imagem."}, {"x": 650, "y": 1460, "title": "C • CHOQUE / ARRITMIA", "body": "Conferir PA e infusões; eco e busca de sangramento, isquemia, tamponamento ou TEP.\nVolume se indicado; vasoativo/inotrópico conforme mecanismo (31).\nTaquiarritmia instável: cardioversão; TV polimórfica: choque não sincronizado.\nBradicardia instável: ACLS, considerar estimulação elétrica."}, {"x": 1220, "y": 1460, "title": "D/E • NEURO / METABÓLICO", "body": "Glicemia baixa: tratar imediatamente e reavaliar em 15 min (36).\nCrise: resgate + EEG (35); rever sedativos e eletrólitos.\nDéficit focal/anisocoria nova: neurologia e imagem urgente após estabilizar.\nFebre: controle de temperatura (34) e investigação da causa."}, {"title": "Tratamento depende da deterioração", "body": "Sem pulso: RCP/desfibrilação conforme ritmo e adrenalina de PCR pelo intervalo. Com pulso e choque: suporte causal/vasopressor em infusão; bradicardia instável: atropina 1 mg IV a cada 3–5 min até 3 mg e preparar estimulação. Hipoglicemia: 25 g de glicose IV. Nova taquiarritmia instável: terapia elétrica adequada. Não usar bolus de adrenalina de PCR para toda hipotensão."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR APÓS CADA INTERVENÇÃO • CICLO CONTÍNUO", "body": "ECG/SpO₂ contínuos; PA contínua por linha arterial nos críticos ou medidas frequentes até estabilizar.\nRepetir ABCDE e registrar resposta/horários/doses; exames conforme alteração.\nMetas: SpO₂ 90–98%; PaCO₂ geralmente 35–45 mmHg; PAM ≥65 mmHg. Individualizar conforme quadro."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA / ESTÁVEL", "body": "Manter monitorização, tratamento causal e plano; revisar prevenção de recorrência."}, {"x": 630, "y": 2260, "title": "SEM RESPOSTA / PIORA", "body": "Ampliar hipóteses e rever 5H/5T; UTI/especialistas e suporte definitivo sem atrasos."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retomar RCP/ACLS imediatamente; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "ROSC e sinais vitais normalizados não comprovam que a causa foi resolvida; manter vigilância.\nUma alteração pode ter várias causas; conferir também tubo, circuito, acesso, bomba e concentração infundida."}, "poster": "posters/38.png", "references": "Referências: AHA 2025 • ERC/ESICM 2025 • Resuscitation Council UK", "clinical": {"exams": "Repetir ABCDE imediatamente: pulso/ritmo, PA, SpO₂/ETCO₂, glicemia, temperatura, pupilas e perfusão. ECG de 12 derivações, gasometria/lactato, eletrólitos, hemograma e rim; US/eco ou imagem dirigida conforme hipótese. Verificar bombas, acessos, tubo, dreno e medicações antes de atribuir piora só à doença.", "review": "ABCDE imediatamente e após cada correção. Registrar o que mudou e resposta; perda do pulso/incerteza → RCP. Piora persistente com pulso → escalonar equipe, suporte e investigação da causa."}}, {"id": 39, "name": "Prescrição básica", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto após ROSC: prescrição individualizada para cuidados monitorizados."}, {"x": 470, "y": 215, "title": "ANTES DE PRESCREVER • CONFERIR DADOS", "body": "Conferir peso, alergias, causa, rim/fígado e sangramento.\nRegistrar metas, acessos e drogas administradas."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Estabilizar e tratar a causa; revisar ordens após cada mudança."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e tratamento das causas reversíveis.\nPrescrição de manutenção não substitui ressuscitação.\nApós ROSC: preparar cuidados críticos e tratamento causal."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • DESTINO, CUIDADOS E EXAMES", "body": "Destino: UTI/unidade monitorizada conforme gravidade. ECG e SpO₂ contínuos; pressão arterial contínua nos críticos.\nPrescrever balanço hídrico/diurese, temperatura e exame neurológico seriado; capnografia se via aérea avançada.\nECG de 12 derivações, gasometria/lactato, glicemia, Na/K/Mg/Ca ionizado, função renal e hemograma; repetir conforme alterações.\nEco/POCUS; EEG se não obedece a comandos. Imagem/culturas conforme hipótese, sem atrasar intervenções urgentes."}, "main": {"x": 650, "y": 1020, "title": "ORDENS BÁSICAS • METAS + REAVALIAÇÃO", "body": "Oxigênio: FiO₂ 100% até medida confiável; depois titular para SpO₂ 90–98%. Se VM: proteção pulmonar, PaCO₂ geralmente 35–45 mmHg (30).\nHemodinâmica: PAM ≥65 mmHg; fluido apenas se indicado, em alíquotas com reavaliação de perfusão/congestão. Vasoativo se necessário (31).\nSem comandos: estratégia de temperatura protocolizada (34). Glicemia: evitar <70 e >180 mg/dL; insulina por protocolo se persistente (36).\nDieta: avaliar via aérea/deglutição e estabilidade; nutrição enteral progressiva quando viável. Cabeceira a 30° se tolerado."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar suporte pós-PCR (29).\nSem ROSC: manter RCP/ACLS.\nCom ROSC: elaborar ordens à direita e revisar resposta."}], "supports": [{"x": 40, "y": 1460, "title": "SE CHOQUE • NORADRENALINA", "body": "Exemplo condicionado: noradrenalina base 0,05–0,15 mcg/kg/min IV em bomba; titular à PAM/perfusão.\nPreparo: 4 mg BASE em SG 5%, volume final 100 mL → 40 mcg/mL.\n60 kg a 0,1 mcg/kg/min → 9 mL/h. Conferir base versus sal.\nVigiar acesso/extravasamento e PA; corrigir hipovolemia."}, {"x": 650, "y": 1460, "title": "TRATAMENTO DA CAUSA", "body": "H/T: acrescentar reperfusão, drenagem, reposição, antídoto ou diálise se indicados.\nAntitrombóticos: causa, estratégia e risco de sangramento.\nAntibiótico se infecção suspeita; culturas e ajuste renal.\nSem profilaxia rotineira de arritmia ou convulsão."}, {"x": 1220, "y": 1460, "title": "CONFORTO / PREVENÇÃO", "body": "Dor: avaliar e prescrever analgesia titulada (40).\nSedação se necessária à VM/controle térmico/crises: meta e titulação (41).\nTEV e úlcera de estresse: avaliar indicação/contraindicações (43).\nK/Mg: reposição apenas se indicada, com dose/infusão e controle (42)."}, {"title": "Como escrever cada item", "body": "Registrar nome genérico, indicação, dose/unidade, via, intervalo ou velocidade, diluente/volume final, concentração da bomba, meta e critério de suspender. Ex.: noradrenalina BASE 4 mg/100 mL (40 microgramas/mL), IV contínua, iniciar conforme perfusão e titular para PAM ≥65; reavaliar acesso/PA. Separar medicamento contínuo de resgate “se necessário”, com limite de dose e quando comunicar equipe."}, {"title": "Prescrição não é uma lista fixa", "body": "Incluir apenas terapias indicadas: O₂/VM com metas, fluidos pelo perfil, analgesia/sedação com RASS, tratamento da causa, controle de glicemia/eletrólitos e prevenção selecionada. Conferir duplicidade de anticoagulação, QT, rim/fígado e alergias. Definir exames/horários e cuidados de enfermagem; suspender fármacos de ressuscitação não mais indicados após ROSC."}], "review": {"x": 100, "y": 1960, "title": "REVISAR A PRESCRIÇÃO • EFETIVIDADE E SEGURANÇA", "body": "Infusões: nome, dose/unidade, diluente, volume final, concentração, velocidade e meta.\nChecar resposta, compatibilidades, rim/fígado e pendências; revisar diariamente e após mudança clínica.\nPrescrever frequência de controles e gatilhos para chamar equipe; deterioração exige ABCDE imediato (38)."}, "outcomes": [{"x": 40, "y": 2260, "title": "ESTÁVEL / METAS ATINGIDAS", "body": "Manter vigilância e revisar necessidade de infusões, dispositivos e cuidados."}, {"x": 630, "y": 2260, "title": "FORA DA META / PIORA", "body": "Reavaliar causa e resposta; ajustar prescrição e suporte com UTI/especialistas."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retomar imediatamente RCP/ACLS e tratamento causal em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Este modelo exige adaptação ao paciente; vasoativo, anticoagulação e sedação dependem de indicação.\nNão manter corticoide, antibiótico, bicarbonato ou cálcio rotineiramente apenas por ter ocorrido PCR."}, "poster": "posters/39.png", "references": "Referências: AHA/ERC 2025 • SmPC noradrenalina (conferir formulação local)", "clinical": {"exams": "Revisar peso, alergias, função renal/hepática, ECG/QTc, K/Mg/Ca, glicemia, hemograma/coagulação e balanço. Especificar exames de controle, horário e metas na prescrição; gasometria após ajuste de VM, lactato conforme choque, K após reposição e glicemia sob insulina. Não pedir painel fixo indefinido sem indicação.", "review": "Revisar após mudança clínica e diariamente: indicação/dose/rota, diluição, metas, função renal, duplicidades, TEV, nutrição e dispositivos. Definir critérios de reduzir/suspender drogas e exames; não manter prescrição de ressuscitação em bolus após ROSC."}}, {"id": 40, "name": "Analgesia", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Dor pós-RCP, procedimentos e doença de base: avaliar e tratar a causa."}, {"x": 470, "y": 215, "title": "ANALGESIA TITULADA • DEFINIR META", "body": "Conferir peso, alergias, rim/fígado, ventilação e perfusão.\nPrescrever resgate e reavaliação; manutenção se indicada."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Aliviar dor preservando ventilação e estabilidade."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e tratamento causal imediato.\nNão atrasar ressuscitação para analgesia.\nApós ROSC: avaliar dor e iniciar plano conforme condição clínica."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • AVALIAR DOR + SEGURANÇA", "body": "Se comunica: escala numérica 0–10; se não comunica: CPOT/BPS. Definir meta, por exemplo dor ≤3/10 ou CPOT ≤2.\nBuscar fraturas, lesão torácica, isquemia e complicações; dor nova pode indicar doença ainda ativa.\nECG, PA, SpO₂, frequência/qualidade respiratória e consciência; capnografia quando indicada. Preparar suporte de via aérea.\nPosicionamento e medidas locais; tratar dor antes de aumentar sedação. Sinais vitais isolados não medem dor."}, "main": {"x": 650, "y": 1020, "title": "DOR MODERADA/INTENSA • RESGATE IV TITULADO", "body": "Exemplo: fentanila 25–50 mcg IV lentamente, em 1–3 min; começar com dose menor no idoso/frágil ou instável.\nReavaliar em cerca de 5 min; repetir pequenas alíquotas apenas se dor persistente e ventilação/perfusão adequadas. Registrar dose cumulativa.\nDor leve/como adjuvante: paracetamol se elegível; avaliar medidas locais. Dor persistente em VM: considerar infusão abaixo.\nHipoventilação, sedação excessiva ou queda de PA: suspender novas doses, dar suporte e avaliar reversão de opioide (12)."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e retomar suporte pós-PCR (29).\nSem ROSC: manter ressuscitação.\nCom ROSC: seguir plano analgésico à direita."}], "supports": [{"x": 40, "y": 1460, "title": "SE INFUSÃO • FENTANILA", "body": "Em VM/UTI, se indicada: faixa inicial de referência 0,5–1,5 mcg/kg/h; titular à dor/resposta.\nPreparo exemplo: 500 mcg em SF 0,9%, volume final 100 mL → 5 mcg/mL.\n60 kg a 0,5 mcg/kg/h → 6 mL/h.\nConferir apresentação e compatibilidade; bomba e vigilância."}, {"x": 650, "y": 1460, "title": "ADJUVANTE • PARACETAMOL", "body": "IV, ≥50 kg: 1 g a cada 6 h se indicado; máximo 4 g/dia, somando todas as vias/produtos.\n<50 kg: 15 mg/kg IV a cada 6 h; máximo 75 mg/kg/dia, sem exceder 3.750 mg/dia.\nInfundir em 15 min; via oral se segura e disponível.\nEvitar em hepatopatia grave; reduzir limite conforme risco clínico."}, {"x": 1220, "y": 1460, "title": "RISCO • AJUSTAR ESCOLHA", "body": "Opioides: depressão respiratória, bradicardia, hipotensão e acúmulo; vigiar interações.\nFentanila rápida/dose alta pode causar rigidez torácica.\nAINES: evitar se LRA, sangramento ou risco elevado; não são rotina pós-PCR.\nSedativo não substitui analgesia; plano de sedação no algoritmo 41."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • DOR + RESPIRAÇÃO + PERFUSÃO", "body": "Após resgate e cada ajuste: dor/CPOT, consciência, FR, ventilação, SpO₂ e PA; vigiar no pico do efeito.\nDor persiste: reexaminar causa e dose administrada; não empilhar doses sem avaliar resposta.\nRever diariamente infusão, resgates e efeitos adversos; reduzir/descontinuar conforme recuperação."}, "outcomes": [{"x": 40, "y": 2260, "title": "DOR CONTROLADA", "body": "Manter menor dose eficaz; planejar via enteral e desmame conforme quadro."}, {"x": 630, "y": 2260, "title": "DOR / TOXICIDADE PERSISTE", "body": "Rever diagnóstico e esquema; suporte imediato se hipoventilação/instabilidade."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Fentanila é prescrita em MICROGRAMAS: 1 mg = 1.000 mcg. Conferir concentração e unidade da bomba.\nInfusão não é automática para todo pós-PCR; ventilação espontânea exige cautela e monitorização estreita."}, "poster": "posters/40.png", "references": "Referências: SCCM/PADIS • Alberta Health Services • DailyMed/SmPC", "clinical": {"exams": "Avaliar dor por escala numérica se comunica; CPOT/BPS se não comunica. PA/FC/FR, SpO₂/ETCO₂ quando sedado, consciência e função renal/hepática. Checar dose já recebida, outros sedativos e via; não usar apenas taquicardia como escala de dor.", "review": "Reavaliar dor, RASS, PA/FR em 5–10 min após opioide IV e após cada titulação. Se hipoventilação/hipotensão, interromper e apoiar ventilação; ajustar dose e associação. Analgesia deve preceder aumento de sedativo quando dor é a causa."}}, {"id": 41, "name": "Sedação", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto intubado em VM/UTI: sedação de manutenção após PCR ou emergência."}, {"x": 470, "y": 215, "title": "SEDAR SE INDICADO • DEFINIR META", "body": "Avaliar dor, perfusão, ventilação e consciência.\nEscolher agente e titular à meta prescrita de RASS."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Conforto e sincronia com menor dose eficaz; preservar perfusão."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e correção da causa.\nNão atrasar ressuscitação para iniciar infusão.\nEste algoritmo aborda manutenção após ROSC; consciência durante RCP exige manejo específico."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ANTES DE AUMENTAR SEDAÇÃO", "body": "Confirmar tubo, ventilação e oxigenação; excluir dor, hipoglicemia, retenção urinária, abstinência e delirium.\nTratar dor primeiro (40). Registrar exame neurológico e RASS; coma não exige sedativo automaticamente.\nMonitorar ECG, PA/PAM, SpO₂ e ventilação; bomba, via confiável e equipe capaz de dar suporte imediato.\nMeta usual quando viável: RASS 0 a −2. Necessidade de sedação profunda deve ter indicação e meta explícitas."}, "main": {"x": 650, "y": 1020, "title": "ESCOLHER AGENTE • INDIVIDUALIZAR", "body": "Sedação leve: preferir propofol ou dexmedetomidina a benzodiazepínicos; dex pode favorecer sedação leve e menor delirium.\nChoque/bradicardia: estabilizar perfusão e escolher dose/agente com cautela; evitar bolus e aumentos rápidos.\nCrises, tremores refratários ou SDRA grave podem exigir meta mais profunda; seguir algoritmos específicos.\nBloqueio neuromuscular: garantir analgesia e sedação adequadas antes e durante; RASS não avalia paciente paralisado."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e suporte pós-PCR (29).\nSem ROSC: manter ressuscitação.\nCom ROSC e indicação: seguir plano de sedação à direita."}], "supports": [{"x": 40, "y": 1460, "title": "PROPOFOL • TITULAÇÃO RÁPIDA", "body": "Iniciar 5 mcg/kg/min IV; ajustar 5–10 mcg/kg/min, aguardando ≥5 min.\nFaixa usual: 5–50 mcg/kg/min.\nExemplo: 10 mg/mL; 60 kg a 10 mcg/kg/min → 3,6 mL/h.\nVigiar PA, triglicerídeos e sinais de síndrome de infusão; evitar >4 mg/kg/h salvo justificativa."}, {"x": 650, "y": 1460, "title": "DEX • SEDAÇÃO LEVE", "body": "Dexmedetomidina: referência inicial 0,2–0,7 mcg/kg/h IV; titular conforme resposta/bula local.\nSem ataque neste plano de UTI.\nExemplo: 200 mcg em SF, volume final 50 mL → 4 mcg/mL.\nVigiar bradicardia/hipotensão; evitar em choque não controlado ou BAV avançado sem marca-passo."}, {"x": 1220, "y": 1460, "title": "MIDAZOLAM • ALTERNATIVA", "body": "Se indicado: referência inicial 0,02–0,1 mg/kg/h IV; iniciar baixo e titular.\nMaior risco de acúmulo, despertar tardio e delirium; reduzir em idosos e disfunção renal/hepática.\nExemplo: 50 mg em SF, volume final 100 mL → 0,5 mg/mL.\n60 kg a 0,02 mg/kg/h → 2,4 mL/h."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • META + SEGURANÇA", "body": "Após início/cada ajuste: RASS, dor, PA/PAM, FC, SpO₂, ventilação e sincronia; vigiar continuamente.\nRever meta e redução/pausa diária se segura; adiar em crises ativas, instabilidade ou necessidade de sedação profunda.\nSe despertar tardio: considerar acúmulo e confundidores; exame sob sedação não define prognóstico."}, "outcomes": [{"x": 40, "y": 2260, "title": "META ATINGIDA", "body": "Manter menor dose eficaz; revisar indicação, desmame e avaliação neurológica diariamente."}, {"x": 630, "y": 2260, "title": "INSTABILIDADE / EXCESSO", "body": "Reduzir ou suspender agente e dar suporte; investigar causa e reavaliar imediatamente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "MANUTENÇÃO em adulto sob VM; não usar estas doses para indução/procedimentos.\nManter analgesia. Conferir mg/mcg e min/h; desmamar após uso prolongado."}, "poster": "posters/41.png", "references": "Referências: SCCM/PADIS 2018/2025 • ERC 2025 • DailyMed/SmPC", "clinical": {"exams": "Definir e registrar RASS, dor/CPOT, PA/FC/FR, SpO₂/ETCO₂ e nível de consciência. Monitorar triglicerídeos sob propofol prolongado, CK/lactato se suspeita de síndrome de infusão, rim/fígado para acúmulo. EEG se sedação para estado de mal. ECG/QTc conforme agentes/coingestão.", "review": "Rever RASS/PA/FC/ventilação em minutos após titulação. Meta usual leve RASS 0 a −1 quando clinicamente possível; individualizar em convulsões/controle térmico. Avaliar redução diária se segura; não suspender abruptamente em estado de mal."}}, {"id": 42, "name": "Reposição de K / Mg", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto pós-PCR/emergência: corrigir déficit documentado de K e/ou Mg."}, {"x": 470, "y": 215, "title": "REPOR SE INDICADO • CONFERIR EXAMES", "body": "ECG, K, Mg, creatinina, diurese, cálcio e fósforo.\nDefinir via, dose, velocidade e momento de nova coleta."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Evitar arritmia e excesso; corrigir causa e déficit de Mg associado."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e desfibrilação se indicada.\nCorreção causal em paralelo; infusão habitual não é esquema de PCR por hipocalemia.\nMagnésio não é rotina em toda PCR; considerar se torsades/QT longo."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • CLASSIFICAR + AVALIAR RISCO", "body": "K <3,5 mEq/L: hipocalemia; <2,5, sintomas importantes ou alteração de ECG exigem correção IV monitorizada.\nMg: comparar à referência local; <0,5 mmol/L (≈1,2 mg/dL) é grave. Arritmia/convulsão exige manejo urgente.\nChecar perdas, diuréticos, insulina, beta-agonistas e distúrbio ácido-base. Mg baixo pode tornar K refratário.\nLRA, oligúria, diálise, CAD ou reaquecimento: individualizar; não aplicar reposição automática."}, "main": {"x": 650, "y": 1020, "title": "ESCOLHER VIA • ESTÁVEL × URGENTE", "body": "K leve/moderado, sem sinais de gravidade e com via enteral: exemplo inicial 24 mEq VO/sonda; repetir conforme exame e tolerância.\nMg leve, enteral possível: 10–24 mmol/dia de Mg em doses divididas; conferir conteúdo elemental do produto e diarreia.\nIV se grave, sintomático, alteração de ECG ou via enteral inviável; doses abaixo são exemplos para função renal adequada.\nNão normalizar números às cegas: tratar perdas, rever fármacos e prescrever nova coleta antes de repetir blocos."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e suporte pós-PCR (29).\nSem ROSC: manter ressuscitação.\nCom ROSC: escolher reposição conforme exames e condição clínica."}], "supports": [{"x": 40, "y": 1460, "title": "KCl IV • BOMBA + DILUIÇÃO", "body": "Periférico: ≤40 mEq/L e usualmente ≤10 mEq/h.\nExemplo: 20 mEq em SF, volume final 500 mL, em 4 h → 125 mL/h (5 mEq/h).\nMaior concentração: acesso central e protocolo. Até 20 mEq/h só com ECG contínuo/UTI.\nRestrição hídrica exige preparo específico; nunca KCl em bolus."}, {"x": 650, "y": 1460, "title": "MgSO₄ IV • DÉFICIT", "body": "Sem arritmia aguda: exemplo 2 g em SF, volume final 100 mL, em 2 h → 50 mL/h.\nDéficit grave: referência inicial 5 g em 5 h, com reavaliação; adequar preparo.\nVelocidade usual: 1–2 g/h.\nLRA/DRC: reduzir/individualizar com especialista; vigiar PA, respiração e reflexos."}, {"x": 1220, "y": 1460, "title": "TORSADES • QT LONGO", "body": "TV polimórfica sustentada: choque não sincronizado; não aguardar Mg.\nCom pulso, se condição permite: MgSO₄ 2 g IV (≈8 mmol), diluído, em 10 min.\nRetirar drogas que prolongam QT; corrigir K.\nRecorrência: avaliar estimulação.\nSem pulso: desfibrilar + ACLS."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • ECG + EXAMES + RIM", "body": "ECG contínuo em casos graves/infusão rápida; vigiar acesso, PA, diurese e sinais de toxicidade.\nApós bloco IV de K: exemplo de nova coleta em 4 h; antecipar se risco/alteração. Mg: controlar após cada dose IV.\nRever K/Mg, função renal e perdas antes de repetir; colher fora da linha de infusão, sem contaminação."}, "outcomes": [{"x": 40, "y": 2260, "title": "DÉFICIT CORRIGIDO", "body": "Suspender reposição IV; manutenção se perdas persistem, com exames e via enteral quando possível."}, {"x": 630, "y": 2260, "title": "PERSISTE / EXCESSO", "body": "Rever Mg, perdas e rim. Se K/Mg altos ou toxicidade: parar reposição e tratar imediatamente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "K: 1 mmol = 1 mEq. Mg: 1 mmol = 2 mEq; 1 g de MgSO₄ heptaidratado ≈4 mmol de Mg.\nConferir concentração da ampola, dose TOTAL, volume FINAL e mL/h. MgSO₄ concentrado deve ser diluído."}, "poster": "posters/42.png", "references": "Referências: NHS SPS • VUMC 2025 • AHA/ERC 2025 (torsades)", "clinical": {"exams": "K, Mg, Ca, creatinina, diurese e ECG antes de reposição e após cada bloco. ECG contínuo em arritmia, K grave ou infusão acelerada; confirmar concentração/amostra sem hemólise. Rever diurético, perdas GI, acidose/alcalose e fármacos que prolongam QT.", "review": "Repetir K após bloco, usualmente 2–4 h em reposição urgente, Mg após reposição conforme gravidade; ECG e diurese contínuos nos graves. Oligúria/hiperK/bradicardia/hipotensão → interromper e reavaliar. Torsades recorrente → QT/fármacos e suporte especializado."}}, {"id": 43, "name": "Cuidados e recuperação", "group": "Pós-PCR", "intro": [{"x": 40, "y": 215, "title": "CONTEXTO", "body": "Adulto pós-PCR/emergência: cuidados de UTI e recuperação após estabilização."}, {"x": 470, "y": 215, "title": "PREVENIR COMPLICAÇÕES • PLANO DIÁRIO", "body": "Rever suporte, riscos, dispositivos e prescrição.\nDefinir metas do dia com equipe, paciente e família."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Tratar a causa e reduzir danos da internação; preparar recuperação."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS e tratamento causal imediato.\nPrevenção e reabilitação não atrasam ressuscitação.\nApós ROSC: retomar suporte e avaliar cuidados complementares."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • CONFERIR ESTABILIDADE + RISCOS", "body": "ABCDE; revisar oxigenação/VM (30), perfusão (31), temperatura (34), glicemia (36) e eletrólitos (42).\nChecar sangramento, plaquetas, função renal, risco de TEV, lesões por pressão, nutrição e deglutição.\nCabeceira 30–45° se tolerada; higiene oral, cuidados com olhos e pele; reposicionar conforme risco/tolerância.\nRever diariamente tubos, cateteres e sondas: retirar quando sem indicação; técnica asséptica e vigilância de infecção."}, "main": {"x": 650, "y": 1020, "title": "ABCDEF DA UTI • REVISAR DIARIAMENTE", "body": "A: avaliar/tratar dor (40). B: avaliar teste de despertar e respiração espontânea quando seguro.\nC: escolher analgesia/sedação e menor profundidade necessária (41). D: rastrear delirium com CAM-ICU/ICDSC se avaliável.\nE: mobilização progressiva após avaliação de segurança; fisioterapia. F: envolver família, orientar e pactuar metas.\nReorientar, preservar sono e usar auxílios sensoriais; investigar agitação antes de acrescentar fármacos."}, "rosc": [{"x": 40, "y": 1020, "title": "SOMENTE APÓS ROSC", "body": "Confirmar circulação e suporte pós-PCR (29).\nSem ROSC: manter ressuscitação.\nCom ROSC: aplicar cuidados conforme indicação e segurança."}], "supports": [{"x": 40, "y": 1460, "title": "TEV • SE BENEFÍCIO > RISCO", "body": "Sem sangramento/contraindicação: exemplo enoxaparina 40 mg SC a cada 24 h, se elegível.\nAjustar se ClCr <30 mL/min ou extremos de peso; conferir bula/protocolo local.\nSe anticoagulação contraindicada: considerar compressão pneumática.\nRever HIT/plaquetas e procedimentos; evitar duplicação."}, {"x": 650, "y": 1460, "title": "ÚLCERA DE ESTRESSE • RISCO", "body": "Choque, coagulopatia ou hepatopatia crônica: considerar profilaxia.\nExemplo: omeprazol 20–40 mg a cada 24 h, enteral; IV se via enteral inviável.\nIBP ou bloqueador H₂ conforme risco/interações.\nSuspender se risco cessar; revisar antes de sair da UTI. Uso conforme risco."}, {"x": 1220, "y": 1460, "title": "NUTRIÇÃO + INFECÇÃO", "body": "Perfusão estabilizada: iniciar dieta enteral trófica; progredir com equipe de nutrição.\nAdiar se choque não controlado ou suspeita de isquemia intestinal.\nAvaliar deglutição e risco de realimentação.\nAntibiótico se infecção suspeita/confirmada; sem profilaxia rotineira."}, {"title": "Prevenção selecionada • exemplo", "body": "TEV, se risco > sangramento e sem HIT: HNF 5.000 UI SC a cada 8–12 h é uma opção; não adicionar se já há anticoagulação terapêutica. Enoxaparina 40 mg SC/dia é alternativa com função renal adequada; insuficiência renal/peso extremos exigem ajuste específico. Úlcera de estresse, apenas se fatores de risco: omeprazol 20–40 mg enteral/dia, reavaliando necessidade. Não indicar antibiótico profilático a todos após PCR."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • A CADA TURNO + VISITA DIÁRIA", "body": "Após mudanças ou piora: repetir ABCDE imediatamente; monitorização e exames conforme instabilidade.\nA cada turno: dor, sedação, delirium se avaliável, pele, dispositivos, balanço e tolerância à dieta.\nDiariamente: rever TEV/IBP, fármacos, desmame, mobilização e metas; registrar pendências e comunicar família."}, "outcomes": [{"x": 40, "y": 2260, "title": "RECUPERAÇÃO / TRANSIÇÃO", "body": "Avaliar cognição, humor, função e apoio; reabilitação e seguimento em até 3 meses após alta pós-PCR."}, {"x": 630, "y": 2260, "title": "PIORA / COMPLICAÇÃO", "body": "Retomar ABCDE e algoritmo 38; investigar sangramento, infecção, TEV e falha do suporte."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatos; tratar causas reversíveis em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Dose profilática não trata TEP/SCA; anticoagulação terapêutica segue protocolo da causa.\nAlta: conciliar medicações, prevenir recorrência e orientar família/paciente sobre sinais de alarme."}, "poster": "posters/43.png", "references": "Referências: ERC 2025 • SCCM/ASHP 2024 • ABCDEF • ASH • DailyMed", "clinical": {"exams": "Revisão diária de hemograma/plaquetas, rim, sangramento, mobilidade e risco TEV; nutrição/deglutição, pele e dispositivos. Culturas apenas quando infecção suspeita, não antibiótico automático pós-PCR. Avaliar cognição, funcionalidade e sofrimento emocional antes da alta; exames conforme problemas ativos.", "review": "Revisão diária de TEV/sangramento, nutrição, mobilidade, pele, delirium e necessidade de acessos/sondas. Antes da alta: plano de causa, medicamentos, reabilitação, cognição e seguimento; nova instabilidade reabre ABCDE."}}], "references": [{"title": "AHA — Suporte avançado de vida 2025", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-advanced-life-support"}, {"title": "AHA — Pós-PCR 2025", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/post-cardiac-arrest-care"}, {"title": "ERC / RCUK — Circunstâncias especiais 2025", "url": "https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/special-circumstances-guidelines"}, {"title": "ERC / RCUK — Pós-ressuscitação 2025", "url": "https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/post-resuscitation-care-guidelines"}, {"title": "SCCM — PADIS 2025", "url": "https://www.sccm.org/clinical-resources/guidelines/guidelines/focused-update-padis-guideline"}], "names": ["Hipovolemia", "Hipóxia", "Acidose / íons H⁺", "Hipocalemia", "Hipercalemia", "Hipotermia", "Pneumotórax hipertensivo", "Tamponamento cardíaco", "Trombose pulmonar / TEP", "Trombose coronariana / SCA", "Toxinas — abordagem inicial", "Opioides", "Bloqueadores dos canais de sódio", "Anestésicos locais / LAST", "Sulfonilureias", "Isoniazida", "Ferro", "Metemoglobinemia", "Reversão de anticoagulantes", "Benzodiazepínicos", "Paracetamol", "Digoxina", "Metanol", "Etilenoglicol", "Betabloqueadores", "Bloqueadores dos canais de cálcio", "Organofosforados", "Cianeto", "ROSC — abordagem inicial", "Oxigenação e ventilação", "Hemodinâmica e choque", "Investigação da causa / coronárias", "Avaliação neurológica", "Controle de temperatura", "Convulsões e mioclonias", "Controle metabólico", "Prognóstico neurológico", "Reavaliação e deterioração", "Prescrição básica", "Analgesia", "Sedação", "Reposição de K / Mg", "Cuidados e recuperação"], "clinical_revision": "2026-10-11", "clinical_sources": [{"title": "AHA 2025 ALS", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-advanced-life-support/"}, {"title": "AHA 2025 pós-PCR", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/post-cardiac-arrest-care/"}, {"title": "AHA 2025 circunstâncias especiais", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-and-pediatric-special-circumstances-of-resuscitation/"}, {"title": "UKKA hipercalemia 2026", "url": "https://www.ukkidney.org/health-professionals/guidelines/treatment-acute-hyperkalaemia-adults-0"}, {"title": "SCA ACC/AHA 2025", "url": "https://www.jacc.org/doi/10.1016/j.jacc.2024.11.009"}, {"title": "ASRA LAST", "url": "https://asra.com/news-publications/asra-updates/blog-landing/guidelines/2020/11/01/checklist-for-treatment-of-local-anesthetic-systemic-toxicity"}, {"title": "SBD 2026 paciente crítico", "url": "https://diretriz.diabetes.org.br/hiperglicemia-hospitalar-no-paciente-critico/"}, {"title": "ACPC antídotos", "url": "https://atlanticcanadapoisoncentre.ca/poison-and-antidote-chart.html"}, {"title": "NICE reposição volêmica", "url": "https://www.nice.org.uk/guidance/cg174/chapter/recommendations"}, {"title": "Activase bula", "url": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c669f77c-fa48-478b-a14b-80b20a0139c2"}, {"title": "NHS esquema variável de insulina em adulto crítico não diabético", "url": "https://www.leedsformulary.nhs.uk/docs/files/RxVRIIIGlycaemicControlCriticalCare_Apr26.pdf"}]}, "core.json": {"source": "AHA 2025 — algoritmos oficiais; consultados em 11/10/2026", "references": [{"title": "Algoritmos AHA 2025", "url": "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/algorithms/"}, {"title": "AHA 2025 — PCR adulto", "url": "https://professional.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Algorithms/Algorithm-ACLS-CA-250527.pdf"}], "nodes": [{"id": "entry", "title": "Pulso presente?", "body": "Avaliar responsividade, respiração e pulso simultaneamente. Profissional: verificar pulso por até 10 s. Sem pulso ou incerto com respiração ausente/anormal: iniciar RCP.", "choices": [{"label": "Com pulso", "to": "pulse"}, {"label": "Sem pulso / incerto", "to": "arrest"}]}, {"id": "pulse", "title": "Com pulso • ABCDE", "body": "Manter via aérea; apoiar ventilação conforme necessidade. Monitorizar ECG, PA e SpO₂. Obter acesso IV e ECG de 12 derivações conforme quadro. Oxigênio se hipoxemia. Avaliar se frequência e ritmo explicam o comprometimento; tratar a causa em paralelo.", "choices": [{"label": "Bradicardia", "to": "brady"}, {"label": "Taquiarritmia", "to": "tachy"}, {"label": "Outras alterações / causas", "to": "causes"}]}, {"id": "arrest", "title": "Sem pulso • iniciar RCP", "body": "Acionar ajuda, iniciar compressões e conectar desfibrilador. Compressões 100–120/min, profundidade 5–6 cm, retorno completo, pausas mínimas; trocar compressor a cada 2 min. Sem via aérea avançada: 30:2. Com via aérea avançada: compressões contínuas e 1 ventilação a cada 6 s. Usar capnografia contínua quando disponível.", "choices": [{"label": "FV / TV sem pulso", "to": "shock1"}, {"label": "Assistolia / AESP", "to": "nonshock"}]}, {"id": "shock1", "title": "FV / TVSP • primeiro choque", "body": "Desfibrilar. Bifásico: energia recomendada pelo fabricante (ex.: 120–200 J); se desconhecida, máxima disponível. Monofásico: 360 J. Retomar RCP imediatamente por 2 min e obter acesso IV/IO; não verificar pulso logo após choque.", "choices": [{"label": "Após 2 min: ainda chocável", "to": "shock2"}, {"label": "Não chocável, sem ROSC", "to": "nonshock"}, {"label": "ROSC confirmado", "to": "topic:29"}]}, {"id": "shock2", "title": "Segundo choque + adrenalina", "body": "Desfibrilar e retomar RCP por 2 min. Choques subsequentes: energia equivalente; considerar aumento. Adrenalina 1 mg IV/IO a cada 3–5 min. Conferir concentração: solução 0,1 mg/mL → 10 mL para 1 mg; se apresentação for 1 mg/mL, preparar 1 mL + 9 mL de SF 0,9% para 10 mL. Não confundir bolus de PCR com infusão no paciente com pulso. Considerar via aérea avançada e capnografia sem atrasar compressões.", "choices": [{"label": "Após 2 min: ainda chocável", "to": "shock3"}, {"label": "Não chocável, sem ROSC", "to": "nonshock"}, {"label": "ROSC confirmado", "to": "topic:29"}]}, {"id": "shock3", "title": "FV/TVSP refratária • primeira dose de antiarrítmico", "body": "Se FV/TV sem pulso persistir: desfibrilar e retomar RCP imediatamente por 2 min. Amiodarona: primeira dose 300 mg IV/IO em bolus, se ainda não administrada. Alternativa: lidocaína 1–1,5 mg/kg IV/IO. Não combinar rotineiramente os esquemas. Manter adrenalina 1 mg IV/IO a cada 3–5 min pelo intervalo desde a última dose. Tratar causas reversíveis em paralelo. A seleção de um caminho não administra nem registra medicamento.", "choices": [{"label": "Após 2 min: persiste FV/TVSP", "to": "shock4"}, {"label": "Não chocável, sem ROSC", "to": "nonshock"}, {"label": "Pesquisar causas em paralelo", "to": "causes"}, {"label": "ROSC confirmado", "to": "topic:29"}]}, {"id": "nonshock", "title": "Assistolia / AESP • não chocar", "body": "RCP por ciclos de 2 min. Adrenalina 1 mg IV/IO o mais cedo possível e a cada 3–5 min; solução 0,1 mg/mL → 10 mL para 1 mg. Obter acesso IV/IO, considerar via aérea avançada e capnografia. Investigar causas reversíveis em paralelo. Reavaliar ritmo a cada ciclo; verificar pulso apenas com ritmo organizado/sinais de circulação, por até 10 s.", "choices": [{"label": "Persiste não chocável", "to": "nonshock"}, {"label": "Ritmo tornou-se chocável", "to": "shock-reentry"}, {"label": "Pesquisar causas em paralelo", "to": "causes"}, {"label": "ROSC confirmado", "to": "topic:29"}]}, {"id": "brady", "title": "Bradicardia • comprometimento?", "body": "Bradiarritmia tipicamente FC <50/min; interpretar no contexto. Identificar hipotensão, alteração aguda de consciência, choque, desconforto torácico isquêmico ou insuficiência cardíaca aguda atribuíveis à bradicardia. ECG de 12 derivações, monitorização, suporte de via aérea/ventilação e investigação causal.", "choices": [{"label": "Comprometimento persistente", "to": "atropine"}, {"label": "Sem comprometimento", "to": "bradyobserve"}]}, {"id": "atropine", "title": "Atropina • bradicardia", "body": "Atropina 1 mg IV em bolus; repetir a cada 3–5 min, máximo total 3 mg. Não retardar estimulação quando bloqueio de alto grau exige suporte imediato. Monitorizar resposta por pulso, PA, perfusão e ECG; preparar marcapasso e suporte especializado.", "choices": [{"label": "Ineficaz / instabilidade persiste", "to": "pacing"}, {"label": "Resposta adequada", "to": "bradyobserve"}, {"label": "Perda do pulso", "to": "arrest"}]}, {"id": "pacing", "title": "Marcapasso e/ou infusão", "body": "Marcapasso transcutâneo e/ou dopamina 5–20 microgramas/kg/min IV, titulada à resposta; alternativa adrenalina 2–10 microgramas/min IV em infusão titulada. Conferir diluição da bomba e peso; não usar a dose em bolus de PCR. Confirmar captura elétrica e mecânica, não apenas espículas no monitor. Considerar analgesia/sedação conforme tolerância hemodinâmica, ajuda especializada e marcapasso transvenoso.", "choices": [{"label": "Reavaliar resposta", "to": "bradyobserve"}, {"label": "Analgesia", "to": "topic:40"}, {"label": "Sedação", "to": "topic:41"}, {"label": "Perda do pulso", "to": "arrest"}]}, {"id": "bradyobserve", "title": "Bradicardia • reavaliar e investigar", "body": "Reavaliar PA, pulso, consciência, perfusão, respiração e ECG. Tratar hipóxia, isquemia, efeitos de medicamentos e alterações eletrolíticas conforme achados. ECG de 12 derivações; eletrólitos e outros exames dirigidos pela hipótese. Manter vigilância; melhora isolada não dispensa investigação.", "choices": [{"label": "Instabilidade reapareceu", "to": "brady"}, {"label": "Pesquisar causas", "to": "causes"}, {"label": "Perda do pulso", "to": "arrest"}]}, {"id": "tachy", "title": "Taquiarritmia • instabilidade?", "body": "Taquiarritmia tipicamente FC ≥150/min; confirmar adequação ao contexto. Via aérea, oxigênio se hipoxemia, ECG contínuo, PA, SpO₂, acesso IV e ECG de 12 derivações. Instabilidade atribuível ao ritmo: hipotensão, alteração aguda de consciência, choque, dor isquêmica ou insuficiência cardíaca aguda. Taquicardia sinusal exige tratar causa; não cardioversão automática.", "choices": [{"label": "Instabilidade pelo ritmo", "to": "cardioversion"}, {"label": "Estável: avaliar QRS", "to": "qrs"}, {"label": "TV polimórfica sustentada", "to": "polymorphic"}]}, {"id": "cardioversion", "title": "Cardioversão sincronizada", "body": "Sedação quando viável, sem atrasar tratamento da instabilidade. Confirmar marcadores SYNC nas ondas R e necessidade de ressíncronizar após cada choque. AHA 2025: FA 200 J; flutter 200 J; taquicardia de QRS estreito 100 J; TV monomórfica 100 J. Conferir aparelho e protocolo. Se sincronização demora e condição é crítica, choque não sincronizado. Ter monitor de SpO₂, aspiração, acesso IV e equipamento de via aérea disponíveis.", "choices": [{"label": "Reavaliar após choque", "to": "tachyreview"}, {"label": "Sedação", "to": "topic:41"}, {"label": "Perda do pulso", "to": "arrest"}]}, {"id": "qrs", "title": "QRS ≥120 ms?", "body": "Medir QRS e avaliar regularidade e morfologia no ECG. QRS largo ≥0,12 s; estreito <0,12 s. Não tratar taquicardia irregular de QRS largo como TSV regular.", "choices": [{"label": "Estreito e regular", "to": "adenosine"}, {"label": "Largo, regular e monomórfico", "to": "wide"}, {"label": "Irregular / diagnóstico incerto", "to": "irregular"}]}, {"id": "adenosine", "title": "Estreito regular • manobras / adenosina", "body": "Se estável e regular: manobras vagais; adenosina 6 mg IV em injeção rápida seguida de flush de SF 0,9%; segunda dose 12 mg se necessário. ECG  d.innerHTML=`<div class="dialogbar"><h2>Casos salvos</h2><button id="cases-close">Fechar</button></div><p class="muted">Salvos neste navegador. A limpeza dos dados do site remove esses registros. Exporte uma cópia para guardar.</p><div class="tools"><button id="export-cases">Exportar cópia</button><button id="import-cases">Importar cópia</button><input id="cases-file" type="file" accept=".json,application/json" hidden></div>${list.length?list.map(c=>`<section class="saved-record"><h3>${esc(c.name)}</h3><p class="muted">${esc(new Date(c.savedAt).toLocaleString('pt-BR'))} • ${Object.keys(c.state.paths||{}).length} percursos</p><p>${esc(c.state.note||'Sem anotações')}</p><div class="choices"><button data-load="${esc(c.id)}">Abrir caso</button><button data-delete="${esc(c.id)}">Excluir</button></div></section>`).join(''):'<p>Nenhum caso salvo ainda.</p>'}`;
 d.querySelector('#cases-close').onclick=()=>d.close();d.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const c=list.find(c=>c.id===b.dataset.load);if(!c)return;if(!confirm('Abrir este caso? O caso ativo será substituído. Finalize e salve antes, se desejar guardá-lo.'))return;state=JSON.parse(JSON.stringify(c.state));previous='core';consult=null;save();render();d.close()});
 d.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir definitivamente este caso salvo?'))return;try{writeCases(readCases().filter(c=>c.id!==b.dataset.delete));showCases()}catch(e){alert('Não foi possível excluir.')}});
 d.querySelector('#export-cases').onclick=()=>{const blob=new Blob([JSON.stringify([{id:caseId(),name:'Caso ativo — cópia',savedAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(state))},...list],null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='arritmix-casos-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 d.querySelector('#import-cases').onclick=()=>d.querySelector('#cases-file').click();d.querySelector('#cases-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const imported=JSON.parse(await f.text());importCases(imported);showCases()}catch(err){alert('Importação não realizada: '+err.message)}e.target.value=''};if(!d.open)d.showModal();
}
function caseControls(){
 let bar=document.getElementById('case-controls');if(!bar){bar=document.createElement('div');bar.id='case-controls';bar.innerHTML='<button id="saved-list">▤ Casos salvos</button><button id="finish-case">✓ Finalizar e salvar caso</button>';document.body.append(bar);bar.querySelector('#saved-list').onclick=showCases;bar.querySelector('#finish-case').onclick=finishCase}
 const flow=document.getElementById('flow');if(flow&&!flow.querySelector('.finish-end')){const b=document.createElement('button');b.className='primary finish-end';b.textContent='✓ Finalizar e salvar caso';b.onclick=finishCase;flow.append(b)}
}
const casesRender=render;render=function(){casesRender();caseControls()};caseControls();


function validCaseState(v){if(!v||typeof v!=='object'||!v.paths||typeof v.paths!=='object'||Array.isArray(v.paths)||!entries.some(e=>e.key===v.active)||typeof v.note!=='string'||!v.done||typeof v.done!=='object')return false;for(const [key,p]of Object.entries(v.paths)){if(!graphs[key]||!Array.isArray(p)||!p.length||p.some(id=>!graphs[key][id]))return false}if(v.pcrDrugs!==undefined&&(!Array.isArray(v.pcrDrugs)||v.pcrDrugs.some(d=>!d||!['adrenalina','amiodarona','lidocaína'].includes(d.drug)||!Number.isFinite(d.dose)||d.dose<=0||!['mg','mg/kg'].includes(d.unit))))return false;return true}
function importCases(list){if(!Array.isArray(list)||list.length>1000||list.some(c=>!c||typeof c.name!=='string'||!Number.isFinite(Date.parse(c.savedAt))||!validCaseState(c.state)))throw Error('Arquivo de casos inválido ou incompatível.');const existing=readCases(),ids=new Set(existing.map(c=>c.id));const additions=[];for(const c of list){if(typeof c.id==='string'&&ids.has(c.id))continue;const id=typeof c.id==='string'&&c.id?c.id:caseId();ids.add(id);additions.push({...c,id,state:JSON.parse(JSON.stringify(c.state))})}writeCases([...additions,...existing]);return additions.length}
</script><script>function imageSource(path){return typeof EMBEDDED_ASSETS!=='undefined'?(EMBEDDED_ASSETS[path]||path):path}
function bindImageButtons(){document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>showImage(b.dataset.image))}
function showImage(path){let d=document.getElementById('image-viewer');if(!d){d=document.createElement('dialog');d.id='image-viewer';document.body.append(d)}d.innerHTML='<div class="dialogbar"><button id="image-close">← Retornar ao algoritmo</button><button id="image-less">−</button><button id="image-more">+</button><button id="image-fit">Ajustar</button></div><div class="image-scroll"><img alt="Algoritmo ampliado"></div>';const im=d.querySelector('img');im.src=imageSource(path);let width=100;const fit=()=>{im.style.width=width+'%'};d.querySelector('#image-close').onclick=()=>d.close();d.querySelector('#image-more').onclick=()=>{width=Math.min(400,width+25);fit()};d.querySelector('#image-less').onclick=()=>{width=Math.max(50,width-25);fit()};d.querySelector('#image-fit').onclick=()=>{width=100;fit()};d.showModal()}
function drugHistory(){if(!state.pcrDrugs)state.pcrDrugs=[];return state.pcrDrugs}
function nextAmioDose(){const h=drugHistory().filter(e=>e.drug==='amiodarona');return h.length===0?300:h.length===1?150:0}
function recordAmio(){if(drugHistory().some(e=>e.drug==='lidocaína')){alert('Lidocaína já registrada. Não combinar os esquemas rotineiramente.');return}const dose=nextAmioDose();if(!dose){alert('As duas doses do esquema-padrão já estão registradas.');return}if(!confirm('Registrar amiodarona '+dose+' mg IV/IO como administrada? Confirme indicação e dose realizada.'))return;drugHistory().push({drug:'amiodarona',dose,unit:'mg',recordedAt:new Date().toISOString()});save();render()}
function recordEpi(){const prior=drugHistory().filter(e=>e.drug==='adrenalina');if(prior.length){const raw=prompt('Quantos minutos transcorreram desde a última adrenalina? Use o tempo informado na simulação.');if(raw===null)return;const mins=Number(raw.replace(',','.'));if(!Number.isFinite(mins)||mins<3){alert('Não registrar repetição antes de 3 minutos. O intervalo do algoritmo é 3–5 minutos.');return}}if(!confirm('Registrar adrenalina 1 mg IV/IO como administrada?'))return;drugHistory().push({drug:'adrenalina',dose:1,unit:'mg',recordedAt:new Date().toISOString()});save();render()}
function recordLido(){if(drugHistory().some(e=>e.drug==='amiodarona')){alert('Amiodarona já registrada. Não combinar rotineiramente os esquemas.');return}const h=drugHistory().filter(e=>e.drug==='lidocaína');if(h.length>=2){alert('As doses descritas no esquema-padrão já estão registradas; discutir doses adicionais com a equipe e protocolo.');return}const val=prompt(h.length?'Segunda dose de lidocaína realizada em mg/kg (0,5–0,75):':'Primeira dose de lidocaína realizada em mg/kg (1–1,5):');if(val===null)return;const dose=Number(val.replace(',','.'));if(!Number.isFinite(dose)||dose<(h.length?.5:1)||dose>(h.length?.75:1.5)){alert('Dose fora da faixa descrita no algoritmo.');return}drugHistory().push({drug:'lidocaína',dose,unit:'mg/kg',recordedAt:new Date().toISOString()});save();render()}
function addDrugControls(n,key){if(!['shock2','shock3','shock4','shock5','shock-ongoing','shock-reentry','nonshock'].includes(n.id)||!state.active.startsWith('core'))return;const h=drugHistory(),section=document.createElement('section');section.className='drug-history';section.innerHTML='<h3>Medicamentos neste episódio</h3><p class="muted">Somente registro explícito. Consultar ou avançar não registra uma administração.</p>'+h.map(e=>'<p>✓ '+esc(e.drug)+' '+e.dose+' '+e.unit+'</p>').join('');if(nodes()[path().at(-1)]?.id===n.id){const epi=document.createElement('button');epi.textContent='Registrar adrenalina 1 mg';epi.onclick=recordEpi;section.append(epi);if(!['nonshock','shock2','shock4'].includes(n.id)){const dose=nextAmioDose(),amio=document.createElement('button');amio.textContent=dose?'Registrar amiodarona '+dose+' mg':'Amiodarona 300 + 150 mg já registrada';amio.disabled=!dose||h.some(e=>e.drug==='lidocaína');amio.onclick=recordAmio;section.append(amio);const lido=document.createElement('button');lido.textContent='Registrar lidocaína (alternativa)';lido.disabled=h.some(e=>e.drug==='amiodarona');lido.onclick=recordLido;section.append(lido)}}const episode=document.createElement('button');episode.textContent='Novo episódio de PCR (após ROSC e nova parada)';episode.onclick=newPcrEpisode;section.append(episode);$('#panel').append(section)}

function newPcrEpisode(){if(!confirm("Iniciar registro de um NOVO episódio de PCR? Confirme que houve ROSC e nova parada; não use para reiniciar doses na mesma PCR."))return;if(!state.previousPcrEpisodes)state.previousPcrEpisodes=[];state.previousPcrEpisodes.push(JSON.parse(JSON.stringify(drugHistory())));state.pcrDrugs=[];save();render()}

function largestFit(measure,available,max=4){let low=.03,high=max;for(let i=0;i<15;i++){const candidate=(low+high)/2;if(measure(candidate)<=available)low=candidate;else high=candidate}return low}
function fitContent(){for(const id of ['flow','panel','rail']){const content=document.getElementById(id);if(!content)continue;if(content.dataset.loadError){content.style.zoom=1;continue}const shell=content.parentElement;if(!shell||!shell.clientHeight||!shell.clientWidth)continue;const css=getComputedStyle(shell),height=shell.clientHeight-parseFloat(css.paddingTop||0)-parseFloat(css.paddingBottom||0)-2;const width=shell.clientWidth-parseFloat(css.paddingLeft||0)-parseFloat(css.paddingRight||0);if(height<=0||width<=0)continue;const scale=largestFit(s=>{content.style.zoom=s;return Math.max(content.getBoundingClientRect().height,content.scrollHeight*s)},height,id==='rail'?1.2:1.65);content.style.zoom=scale;shell.scrollTop=0;shell.scrollLeft=0}}
let fitQueued=false;function scheduleFit(){if(fitQueued)return;fitQueued=true;requestAnimationFrame(()=>{fitQueued=false;fitContent()})}
if(typeof window!=='undefined'&&typeof ResizeObserver!=='undefined'){
 const resize=new ResizeObserver(scheduleFit),mutation=new MutationObserver(scheduleFit);
 for(const id of ['flow','panel','rail']){const el=document.getElementById(id);if(el){resize.observe(el.parentElement);mutation.observe(el,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['open','class']})}}
 window.addEventListener('resize',scheduleFit);window.visualViewport?.addEventListener('resize',scheduleFit);document.addEventListener('toggle',scheduleFit,true);document.addEventListener('load',scheduleFit,true);document.fonts?.ready.then(scheduleFit);scheduleFit();
}
