</style><header><b>CF <span>ArritmiX</span></b><strong id="heading">Avaliação inicial</strong><button id="library">▦ Biblioteca</button><button id="details">Detalhes</button><button id="reset">Novo caso</button></header><div class="layout"><nav class="rail-viewport"><div id="rail"></div></nav><main class="flow-viewport"><div id="flow"></div></main><aside class="panel-viewport"><div id="panel"></div></aside></div><dialog id="catalog"><div class="dialogbar"><input id="search" placeholder="Buscar algoritmo" aria-label="Buscar algoritmo"><button id="close">Fechar</button></div><div id="tiles"></div></dialog><script>const EMBEDDED_DATA={"data.json": {"topics": [{"id": 1, "name": "Hipovolemia", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Pesquisar perdas: hemorragia, vômitos, diarreia, perdas renais e baixa ingestão."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP e algoritmo do ritmo; repor volume e controlar hemorragia em paralelo. Acesso IV/IO."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, SpO₂, PA, consciência, perfusão e acesso venoso. Identificar hipoperfusão ou choque; classificar perda hemorrágica ou não hemorrágica."}, "main": {"title": "Hipoperfusão ou choque?", "body": "Se hemorragia: controlar fonte, compressão externa quando indicada e equipe para controle definitivo; ativar protocolo de hemorragia e hemocomponentes conforme quadro.\nSe perda não hemorrágica com indicação de ressuscitação: cristaloide isotônico; referência geral de 500 mL em menos de 15 min. Individualizar conforme tolerância; não repetir automaticamente."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Sem choque • reposição planejada", "body": "Via oral se viável ou IV individualizada; tratar causa e acompanhar perdas."}, {"title": "Hemorragia • cuidados", "body": "No trauma: tranexâmico precoce quando indicado. Prevenir hipotermia e buscar hemorragia oculta."}, {"title": "Congestão / piora respiratória", "body": "Interromper bolus de cristaloide; reavaliar coração e pulmões e ajustar suporte."}, {"title": "Hemorragia traumática • TXA se indicada", "body": "No trauma com sangramento importante/risco: ácido tranexâmico 1 g IV em 10 min, depois 1 g em 8 h; iniciar o mais cedo possível e até 3 h da lesão. Não atrasar hemostasia/hemocomponentes. Este esquema não é indicação automática para toda hemorragia ou toda hipovolemia."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Após cada intervenção: PA, pulso, perfusão, consciência, respiração, SpO₂, ausculta e perdas. Melhora transitória exige busca de perda contínua; sem melhora, rever outras causas de choque."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "PA normal isolada não confirma perfusão. Vasopressor não substitui controle da hemorragia."}, "poster": "posters/01.png", "references": "NICE CG174 • NICE NG39 • AHA 2025", "clinical": {"exams": "ECG e monitorização contínua se choque; hemograma, gasometria com lactato, Na/K/Mg, ureia/creatinina, glicemia. Se sangramento: tipagem/prova cruzada, plaquetas, TP/INR, TTPa, fibrinogênio e cálcio ionizado. Quantificar perdas e diurese; ultrassom à beira-leito/FAST se trauma. Hb inicialmente normal não exclui hemorragia. TC somente se estável e sem atrasar hemostasia.", "review": "Reavaliar imediatamente após CADA bolus/hemostasia: PA/PAM, enchimento capilar, pulso, consciência, crepitações e SpO₂; diurese horária (meta usual ≥0,5 mL/kg/h). Lactato seriado conforme choque. Se congestão, interromper expansão e rever perfil; resposta transitória sugere perda contínua."}}, {"id": 2, "name": "Hipóxia", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Avaliar consciência, respiração, esforço respiratório, SpO₂ e perfusão. Não aguardar exames para tratar deterioração grave."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP e algoritmo do ritmo. Bolsa-máscara com O₂ na maior concentração disponível. Sem via avançada: 30:2; com via avançada: compressões contínuas e 1 ventilação a cada 6 s. Evitar hiperventilação."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, SpO₂ e PA. Abrir via aérea; aspirar secreções quando necessário. Avaliar eficácia da ventilação."}, "main": {"title": "Apneia ou ventilação inadequada?", "body": "Com pulso e apneia: bolsa-máscara e O₂; 1 ventilação a cada 6 s com elevação visível do tórax. Reavaliar pulso a cada 2 min.\nSe difícil: corrigir posição, vedação e obstrução; técnica a duas pessoas e preparar via aérea avançada se necessário.\nRespiração espontânea e hipoxemia grave: máscara com reservatório a 15 L/min inicialmente; titular e avaliar maior suporte."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Alvos conforme contexto", "body": "Em geral: SpO₂ 94–98%. Risco de insuficiência hipercápnica: 88–92% enquanto aguarda gasometria, fora da ressuscitação crítica inicial.\nPós-ROSC: O₂ 100% até medida confiável; depois SpO₂ 90–98% ou PaO₂ 60–105 mmHg. PaCO₂ 35–45 mmHg; individualizar na acidemia grave."}, {"title": "Persistência / piora", "body": "Investigar obstrução, broncoespasmo, edema, pneumonia, pneumotórax, TEP ou depressão respiratória. Considerar alto fluxo/VNI em selecionados; não atrasar intubação se falha, exaustão ou proteção de via aérea insuficiente."}, {"title": "Se já intubado", "body": "Verificar deslocamento do tubo, obstrução, pneumotórax e equipamento; capnografia com onda para confirmar e acompanhar via aérea."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Após intervenção: SpO₂ com sinal confiável, FR/esforço, expansão, consciência e hemodinâmica. Gasometria conforme gravidade, sem atrasar suporte."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "SpO₂ normal não exclui hipoventilação. Oximetria pode enganar em CO/metemoglobinemia."}, "poster": "posters/02.png", "references": "AHA 2025 • BTS oxigenoterapia", "clinical": {"exams": "SpO₂ com curva confiável, FR, ausculta, expansão e nível de consciência; capnografia se ventilação assistida. Gasometria arterial com pH/PaCO₂/PaO₂ nos graves; ECG, glicemia, eletrólitos e lactato. RX de tórax/ultrassom pulmonar conforme hipótese; co-oximetria se CO/MetHb. Não esperar imagem para corrigir apneia ou obstrução.", "review": "Reavaliar em minutos e após cada ajuste: expansão/FR, esforço, consciência, SpO₂ e ETCO₂. Apneia com pulso: verificar pulso a cada 2 min. SpO₂ usual 94–98%; risco de retenção de CO₂ 88–92% enquanto se avalia gasometria; pós-ROSC 90–98%. Falha ventilatória → escalar suporte."}}, {"id": 3, "name": "Acidose / íons H⁺", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Acidemia: pH <7,35. Acidose é um processo que pode coexistir com pH normal em distúrbio misto."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP e algoritmo do ritmo. Otimizar ventilação/perfusão; tratar causas. Não dar bicarbonato rotineiramente por pH baixo ou tempo prolongado de PCR."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "Avaliar ventilação, perfusão, consciência e ECG. Gasometria, Na, K, Cl, glicose, lactato e rim; cetonemia se indicada. Não atrasar estabilização."}, "main": {"title": "Qual componente precisa de correção?", "body": "Respiratório: PaCO₂ elevada contribuindo para acidemia; corrigir hipoventilação, avaliar obstrução, sedativos, doença pulmonar e fadiga.\nMetabólico: HCO₃ reduzido; investigar lactato, cetonas, perda de bicarbonato, disfunção renal e toxinas; tratar causa e perfusão.\nMisto: avaliar compensação e tratar ambos; não interpretar apenas pH."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Interpretação", "body": "Ânion gap = Na − (Cl + HCO₃); considerar albumina e referência local. Na acidose metabólica, PaCO₂ esperada ≈1,5 × HCO₃ + 8 ±2 mmHg; desvio sugere componente respiratório associado."}, {"title": "Bicarbonato • indicação específica", "body": "Não é rotina. Seguir protocolo em intoxicação por bloqueador de sódio e outras indicações. Na CAD, considerar se pH <7,0; não extrapolar dose para outras causas. Acidemia refratária: avaliar suporte renal."}, {"title": "Segurança", "body": "Garantir ventilação e monitorização; bicarbonato pode gerar CO₂, sobrecarga de sódio/volume, alcalose e hipocalemia. Não perder ventilação compensatória durante intubação de acidose metabólica grave."}, {"title": "Bicarbonato • exceção na cetoacidose", "body": "Não usar rotineiramente na PCR ou acidose láctica. Na cetoacidose diabética com pH <7,0, pode ser considerado: 100 mmol de bicarbonato 8,4% diluídos em 400 mL de água estéril, administrados em 2 h; repetir a cada 2 h até pH >7,0, sob controle de K/gasometria. Tratar cetose, volume e eletrólitos em paralelo. Outras indicações, como cardiotoxicidade por canal de sódio, têm esquema próprio."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Reavaliar clínica, ventilação e perfusão; repetir gasometria e exames conforme gravidade. Sem resposta: revisar mecanismo e escalar UTI/nefrologia."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "Não existe dose universal de bicarbonato. Corrigir a causa, não apenas o pH."}, "poster": "posters/03.png", "references": "AHA 2025 • consenso de crises hiperglicêmicas 2024", "clinical": {"exams": "Gasometria (pH, PaCO₂, HCO₃), lactato, Na/K/Cl/Mg, glicemia, cetonas preferencialmente beta-hidroxibutirato, ureia/creatinina e diurese. Calcular ânion gap: Na − (Cl + HCO₃); considerar albumina. Na acidose metabólica, PaCO₂ esperada ≈1,5 × HCO₃ + 8 ±2. Gap osmolar e dosagem de tóxicos se suspeita; ECG se distúrbio de K.", "review": "Após corrigir ventilação/perfusão, repetir gasometria em cerca de 30–60 min nos graves ou antes se piora; acompanhar K/glicemia/lactato. Comparar pH, CO₂ e bicarbonato com mecanismo e compensação; persistência exige rever choque, cetose, rim e toxina."}}, {"id": 4, "name": "Hipocalemia", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "K <3,5 mmol/L; sintomas, ECG e gravidade dirigem urgência."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "PCR atribuída à hipocalemia: RCP/ACLS e correção causal com equipe experiente. RCUK/ERC 2025: KCl 20 mmol IV/IO em 2–3 min, depois 10 mmol em 2 min, em preparação diluída e protocolo de ressuscitação. Controlar K; não aplicar este esquema no paciente com pulso."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "Dosar K, Mg e rim; avaliar diurese, perdas, medicamentos e equilíbrio ácido-base. K <2,5, sintomas importantes ou alteração de ECG exige IV monitorizada."}, "main": {"title": "Grave / sintomas / ECG alterado?", "body": "KCl diluído e bomba; dose conforme déficit, rim e resposta. Corrigir Mg associado.\nCom pulso: referência usual 10 mmol/h; periférico até 40 mmol/L. Mais concentrado/rápido: protocolo UTI, acesso adequado e ECG contínuo. Nunca KCl IV direto com pulso."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Estável e via enteral viável", "body": "Preferir oral. Exemplo inicial leve: 24 mmol; próximas doses conforme K e protocolo. Se enteral inviável: IV controlada."}, {"title": "Exemplo IV com pulso", "body": "20 mmol em SF 0,9%, volume final 500 mL, em 2 h = 40 mmol/L, 10 mmol/h e 250 mL/h. Avaliar tolerância ao volume; não usar automaticamente com restrição hídrica."}, {"title": "Revisar causa", "body": "Perdas digestivas, diuréticos, baixa ingestão, Mg baixo, insulina e beta-agonistas. Distinguir perda corporal de redistribuição."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Repetir K após bloco e antes de repetir; antecipar se arritmia/piora/rim. Rever Mg e ECG. Se K alto/oligúria: interromper e seguir manejo específico."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "K: 1 mmol = 1 mEq. Conferir apresentação; não converter por número de ampolas sem checar concentração."}, "poster": "posters/04.png", "references": "NHS SPS • RCUK/ERC 2025", "clinical": {"exams": "ECG de 12 derivações, K, Mg, Na, creatinina, gasometria/bicarbonato e diurese antes de nova reposição. Buscar perdas digestivas, diuréticos, insulina, alcalose e baixa ingestão. ECG contínuo se K <2,5 mmol/L, sintomas, arritmia ou reposição IV acelerada. Dosagem urinária de K se perda renal não esclarecida, após estabilização.", "review": "Conferir K após bloco inicial, em geral 2–4 h em reposição urgente, antecipando se arritmia/rim; não repetir sem controle. Vigiar ECG, diurese e Mg. Suspender/reduzir se K sobe excessivamente ou oligúria."}}, {"id": 5, "name": "Hipercalemia", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "K 5,5–5,9 leve; 6,0–6,4 moderado; ≥6,5 mmol/L grave. ECG normal não exclui risco; avaliar hemólise sem atrasar emergência."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP/ACLS. RCUK/ERC 2025 na PCR hipercalêmica: cloreto de cálcio 10% 10 mL IV e bicarbonato 50 mmol IV, por vias separadas ou flush. Insulina-glicose conforme protocolo; considerar diálise se refratária. Não é esquema de toda PCR."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, acesso IV. Monitorização contínua se grave/ECG alterado. Dosar K, glicose, rim e gasometria."}, "main": {"title": "Há ECG alterado pela hipercalemia?", "body": "Se ECG alterado: gluconato de cálcio 10% 30 mL IV em 10 min OU cloreto 10% 10 mL em 5 min; escolher contexto/acesso e vigiar extravasamento. Reavaliar ECG em 5–10 min e repetir se necessário.\nCálcio não reduz K. Sem ECG alterado: decidir conforme gravidade, sem cálcio automático."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Redistribuir K • moderada/grave", "body": "Insulina regular 10 unidades + glicose 25 g IV conforme protocolo. Salbutamol 10–20 mg nebulizado como adjuvante; não isolado no grave. Se glicemia inicial <126 mg/dL, considerar glicose 10% 50 mL/h por 5 h conforme protocolo."}, {"title": "Eliminar K / causa", "body": "Suspender fontes e rever fármacos. Planejar remoção efetiva; quelante conforme protocolo se enteral viável. Nefrologia/diálise se grave refratária, rim muito comprometido ou paciente dialítico."}, {"title": "Vigiar hipoglicemia", "body": "Glicose antes e aos 30, 60, 90, 120, 180, 240, 300 e 360 min após insulina-glicose; tratar hipoglicemia e prolongar se repetir insulina."}, {"title": "Remover K • não apenas redistribuir", "body": "Suspender fontes de K e fármacos precipitantes. Grave/refratária, oligoanúria ou paciente dialítico: discutir diálise urgente. Se via enteral segura, ciclosilicato de zircônio sódico 10 g VO 3 vezes/dia na fase de correção, por até 72 h, como adjuvante; não substitui cálcio/insulina ou diálise. Diurético só se há diurese e perfil de volume compatível."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "ECG/sinais vitais nos graves. K em 1, 2, 4, 6 e 24 h após identificar/tratar moderada/grave; antecipar se necessário. Vigiar rebote e glicemia."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "Não misturar cálcio/bicarbonato. Insulina em UNIDADES. Bicarbonato não é rotina com pulso; avaliar indicação."}, "poster": "posters/05.png", "references": "UKKA 2023 • RCUK/ERC 2025 • MHRA", "clinical": {"exams": "ECG imediato e monitorização contínua se K ≥6,5, ECG alterado ou deterioração. K em amostra sem hemólise, glicemia, gasometria, Na, ureia/creatinina, Ca/Mg; revisar diurese, medicamentos e suplementos. Repetir amostra suspeita de pseudohipercalemia sem atrasar tratamento do quadro grave. ECG normal não exclui risco.", "review": "ECG em 5–10 min após cálcio; K em 1, 2, 4, 6 e 24 h. Glicemia antes e em 30, 60, 90, 120, 180, 240, 300 e 360 min após insulina; ampliar se hipoglicemia/risco. Persistência grave, rebote ou oligoanúria → nefrologia/diálise."}}, {"id": 6, "name": "Hipotermia", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Temperatura central <35 °C. Em inconsciente hipotérmico, pesquisar sinais vitais por até 1 min."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP, O₂ e algoritmo com adaptações RCUK/ERC 2025. FV após 3 choques: adiar novos até >30 °C. Adrenalina: iniciar 1 mg ao atingir 30 °C salvo ECPR iminente; de 30–35 °C, intervalo 6–10 min. Amiodarona 300 mg se indicada; adiar doses adicionais até >30 °C. Reaquecer e acionar centro ECLS."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, PA e temperatura central. Glicose, eletrólitos e gasometria; corrigir hipóxia/hipoglicemia e buscar causa."}, "main": {"title": "Há critério de gravidade / instabilidade?", "body": "T <30 °C, FC <45/min, PAS <90 mmHg ou arritmia ventricular: transferir diretamente a centro ECPR/ECLS, com equipe precocemente. Suporte e aquecimento no transporte.\nNa PCR elegível, priorizar VA-ECMO e usar HOPE para apoiar decisão hospitalar."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Estável • reaquecimento", "body": "Proteger do frio, retirar roupa molhada com cuidado, isolar e usar calor externo controlado conforme gravidade. Bebida morna apenas se alerta e deglutição segura."}, {"title": "Suporte", "body": "Ambiente aquecido, proteção da pele e solução aquecida se volume indicado. Escalar método se grave, instável ou sem resposta."}, {"title": "Causas associadas", "body": "Exposição, imersão, trauma, álcool/sedativos, hipoglicemia, sepse e causas endócrinas. Bradicardia pode ser efeito térmico; avaliar perfusão e reaquecer."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Temperatura central seriada/contínua, ECG, PA, respiração, consciência e perfusão. Repetir exames conforme gravidade; reavaliar após intervenções."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "Manipular com cuidado. Não aplicar limites de reaquecimento pós-PCR à hipotermia acidental."}, "poster": "posters/06.png", "references": "RCUK/ERC 2025 • AHA/Red Cross 2024", "clinical": {"exams": "Temperatura CENTRAL com termômetro adequado para baixa temperatura, ECG, glicemia, gasometria/lactato, K/Mg/Na, hemograma, função renal, CK e coagulação. Investigar exposição, trauma, sepse, fármacos e causas endócrinas conforme história. Na PCR por hipotermia, registrar duração/exposição e obter K para avaliação de ECLS; não decidir prognóstico por um dado isolado.", "review": "Acompanhar temperatura central/ECG/PA continuamente nos graves; após cada aquecimento rever perfusão, respiração e arritmia. Movimentar suavemente. Não declarar falha de ressuscitação somente por temperatura baixa ou aparência clínica."}}, {"id": 7, "name": "Pneumotórax hipertensivo", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Dispneia súbita, hipóxia, assimetria/ausculta reduzida e choque. Considerar trauma, acesso central e pressão positiva; desvio traqueal pode estar ausente."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP/ACLS; corrigir obstrução imediatamente. Suspeita consistente: descompressão por equipe habilitada, sem aguardar RX. PCR traumática: toracostomias bilaterais conforme protocolo; não generalizar a toda PCR clínica."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, O₂, ECG, SpO₂, PA e acesso. Acionar equipe habilitada e preparar drenagem."}, "main": {"title": "Instabilidade / comprometimento respiratório grave?", "body": "Descompressão imediata na suspeita clínica consistente; não esperar imagem. Toracostomia aberta/digital seguida de dreno se equipe/contexto permitem. Se não viável, cateter como ponte conforme protocolo."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Estável • diagnóstico", "body": "Avaliação e imagem urgente. US pode apoiar; ausência de deslizamento isolada não confirma. Se deteriorar, não esperar imagem."}, {"title": "Técnica / referências", "body": "Cateter: 4º/5º EIC em linha axilar anterior OU 2º EIC medioclavicular conforme protocolo/dispositivo. Dreno no triângulo de segurança; abordar acima da borda superior da costela. Profissional habilitado."}, {"title": "Drenagem definitiva", "body": "Conferir sistema, fixação, conexões e permeabilidade. Analgesia/anestesia se viável, sem atrasar intervenção salvadora. Não clampear dreno borbulhante salvo situação específica supervisionada."}, {"title": "Analgesia • se viável sem atraso", "body": "Anestesia local para drenagem, por profissional habilitado: lidocaína sem vasoconstritor, limite usual 4,5 mg/kg e máximo 300 mg; solução 1% =10 mg/mL. Não atrasar descompressão no colapso. Analgesia sistêmica titulada pode ser consultada no tema Analgesia; observar PA/ventilação."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Imediatamente após descompressão: PA, perfusão, pulso, SpO₂, esforço, ausculta/expansão. Em VM: pressões/volumes, tubo/equipamento. Sem resposta: falha do cateter/dreno, lado oposto e outras causas."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "Saída de ar não prova resolução sustentada. Pressão positiva pode agravar pneumotórax não drenado."}, "poster": "posters/07.png", "references": "NICE NG39 • BTS 2023 • RCUK 2025", "clinical": {"exams": "Instabilidade + suspeita clínica: não esperar RX/TC. Avaliar assimetria/ausculta, SpO₂, PA e pressões ventilatórias; ultrassom se imediatamente disponível sem atraso. Após descompressão: confirmar funcionamento do dreno, RX/US e avaliar lesões associadas. Gasometria e lactato nos graves.", "review": "Reavaliar IMEDIATAMENTE após descompressão e continuamente: PA/pulso, ausculta, expansão, SpO₂ e pressões da VM. Sem melhora: verificar falha/obstrução, lado oposto, tubo e outra causa; cateter é ponte para drenagem definitiva."}}, {"id": 8, "name": "Tamponamento cardíaco", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Choque obstrutivo: hipotensão, taquicardia, dispneia, turgência jugular/pulso paradoxal. Tríade de Beck pode estar incompleta."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP/ACLS; buscar/aliviar tamponamento urgentemente. Eco sem prolongar pausas. Trauma/hemopericárdio: cirurgia imediata; toracotomia ressuscitativa em selecionados conforme tempo/protocolo. Sangue coagulado pode não ser aspirável."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, SpO₂ e PA; acesso e cardiologia/cirurgia. Eco urgente; correlacionar derrame, colapso e enchimento com clínica. Derrame isolado não confirma tamponamento."}, "main": {"title": "Tamponamento com instabilidade?", "body": "Drenagem urgente. Pericardiocentese guiada quando apropriada/viável; não atrasar no instável. Cirurgia se causa/anatomia exigirem. Suporte circulatório é ponte, não substitui drenagem."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Estável • avaliação", "body": "Monitorização próxima e especialista urgente; definir momento da drenagem. Se não há tamponamento clínico, investigar derrame. Piora: retomar urgência."}, {"title": "Situações cirúrgicas", "body": "Trauma com coágulos/sangramento, dissecção aórtica/ruptura, pus ou acesso percutâneo inviável exigem decisão cirúrgica."}, {"title": "Via aérea / ponte", "body": "Pressão positiva e indução podem precipitar colapso. Evitar intubação desnecessária antes de descompressão; se indispensável, coordenar drenagem/suporte. Volume cauteloso e vasoativo se indicados."}, {"title": "Ponte hemodinâmica • selecionar", "body": "Se hipotensão e sem congestão importante, considerar pequeno bolus de cristaloide 250 mL IV e reavaliar; evitar expansão repetida automática. Vasopressor pode ser ponte enquanto se organiza drenagem, com noradrenalina em bomba titulada pela perfusão. Evitar indução/pressão positiva sem planejamento hemodinâmico; drenagem é a terapia definitiva."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "PA, pulso, perfusão, consciência, respiração e SpO₂; repetir eco. Rever líquido residual, recorrência, posição/obstrução do cateter e complicações."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "Não substituir drenagem por fluidos/fármacos. Vigiar sangramento, arritmia e síndrome de descompressão pericárdica."}, "poster": "posters/08.png", "references": "ESC 2025 • RCUK 2025", "clinical": {"exams": "Ecocardiograma urgente à beira-leito: derrame, colapso de câmaras, variação respiratória e veia cava; integrar à clínica. ECG, hemograma, coagulação, creatinina, gasometria/lactato e tipagem se sangramento. TC se estável e hipótese de dissecção/lesão traumática; imagem não deve atrasar drenagem no choque.", "review": "Reavaliar imediatamente após drenagem: PA/perfusão e eco; registrar volume drenado e vigiar recorrência, sangramento, arritmia e lesão. Persistência de choque exige confirmar drenagem e buscar outra causa."}}, {"id": 9, "name": "Trombose pulmonar / TEP", "group": "5H / 5T", "intro": [{"title": "CONTEXTO", "body": "Dispneia súbita, dor pleurítica, síncope, hipóxia ou choque; fatores de risco/TVP."}], "pcr": {"title": "SEM PULSO • RESSUSCITAÇÃO", "body": "RCP/ACLS. TEP suspeito: considerar fibrinólise; confirmado: fibrinólise, embolectomia/trombectomia conforme recursos. ECPR selecionada. Dose no protocolo de PCR. RCUK considera 60–90 min de RCP após fibrinólise em selecionados; AHA: duração ótima incerta."}, "assessment": {"title": "COM PULSO • AVALIAR", "body": "ABCDE, ECG, SpO₂, PA e acesso; suporte, perfusão, sangramento e rim. Instável: equipe/UTI, eco e angio-TC somente se transporte seguro; não atrasar intervenção salvadora."}, "main": {"title": "TEP com instabilidade?", "body": "Avaliar reperfusão urgente: trombólise sistêmica se indicada e risco aceitável. Se contraindicação/falha/alternativa: trombectomia por cateter ou cirurgia. ECMO como ponte selecionada. Evitar expansão volêmica indiscriminada."}, "rosc": [{"title": "APÓS ROSC", "body": "Confirmar circulação; retomar suporte pós-PCR e tratamento causal. Sem ROSC: manter ressuscitação."}], "supports": [{"title": "Estável • investigação", "body": "Estimar probabilidade. Baixa/intermediária: dímero-D quando apropriado. Alta/positivo: angio-TC ou alternativa se contraindicada. ECG/RX não excluem TEP."}, {"title": "Anticoagulação", "body": "Confirmado: anticoagular se elegível. Escolha por gravidade, rim, sangramento e intervenção. HNF se titulação/reversão rápida necessária: exemplo 80 unidades/kg IV e 18 unidades/kg/h, ajustar TTPa/anti-Xa. Não dar bolus automático após trombólise."}, {"title": "Risco / resgate", "body": "Trombólise não é automática no estável. Estratificar VD, biomarcadores e clínica; resgate se deteriora. Rever sangramento, hemorragia intracraniana, AVC recente, trauma/cirurgia e contraindicações específicas."}, {"title": "Anticoagulação • esquema com HNF", "body": "Se anticoagulação indicada e sem sangramento/contraindicação: heparina não fracionada 80 UI/kg IV, depois 18 UI/kg/h em bomba, ajustada por TTPa ou anti-Xa. Não aplicar este bolus automaticamente durante trombólise; coordenar suspensão/reinício pela coagulação e risco. Conferir peso, plaquetas, história de HIT e concentração."}, {"title": "Reperfusão • TEP de alto risco", "body": "No TEP com choque/instabilidade e decisão de trombólise sistêmica: alteplase 100 mg IV em 2 h é um esquema adulto. Avaliar sangramento ativo, hemorragia intracraniana prévia, lesão intracraniana, trauma/cirurgia recente e suspeita de dissecção. Na PCR por TEP, dose/estratégia de resgate não é universal: decidir com equipe em paralelo à RCP; não confundir o esquema de 2 h com um bolus de PCR. Contraindicação/falha → embolectomia por cateter/cirurgia; ECMO em casos selecionados."}], "review": {"title": "REAVALIAR APÓS INTERVENÇÃO", "body": "Nos graves: ECG/sinais vitais; após intervenção, PA, perfusão, consciência, respiração/SpO₂. Vigiar sangramento, Hb, plaquetas, rim e TTPa/anti-Xa se HNF."}, "outcomes": [{"title": "Melhora / metas atingidas", "body": "Continuar tratamento causal, vigilância e plano de continuidade. Não significa alta automática."}, {"title": "Persiste / piora", "body": "Rever resposta, diagnóstico, efeitos adversos e necessidade de equipe/UTI. Ajustar conduta e reavaliar."}], "alert": {"title": "SEGURANÇA", "body": "VD dilatado/ETCO₂ baixo não confirmam TEP. Anticoagulação não substitui reperfusão indicada; ROSC não prova resolução do trombo."}, "poster": "posters/09.png", "references": "AHA 2025 • AHA/ACC 2026 • RCUK 2025", "clinical": {"exams": "ECG, SpO₂, gasometria/lactato, hemograma/plaquetas, creatinina, TP/INR/TTPa; troponina e BNP para repercussão, sem diagnosticar isoladamente. Estável: probabilidade clínica; D-dímero apenas se probabilidade baixa/intermediária e estratégia validada, angio-TC quando indicada. Instável: eco e US venoso à beira-leito se TC inviável; não transportar paciente em colapso para confirmar diagnóstico.", "review": "Grave: monitorização contínua e avaliação após cada intervenção; PA/PAM, lactato, perfusão, diurese e oxigenação. Sob HNF, TTPa cerca de 6 h após início/ajuste e conforme alvo laboratorial; hemograma/rim seriados. Após trombólise, vigilância neurológica e sangramento frequentes."}}, {"id": 10, "name": "Trombose coronariana / SCA", "group": "5H / 5T", "intro": [{"x": 60, "y": 235, "title": "1 • Suspeita de SCA: dor, dispneia, choque ou PCR de provável origem cardíaca", "body": "Avaliar responsividade, respiração e pulso. Acionar equipe; monitor e desfibrilador.\nCom pulso: ECG em até 10 min; troponina seriada. Não atrasar reperfusão por exames."}], "pcr": {"x": 60, "y": 520, "title": "2A • PCR: ressuscitação imediata", "body": "RCP de alta qualidade; desfibrilar FV/TV sem pulso; seguir ACLS e investigar 5H/5T.\nNão fibrinolisar rotineiramente PCR por suspeita coronariana. Continuar RCP até ROSC ou decisão clínica."}, "assessment": {"x": 930, "y": 520, "title": "2B • SCA com circulação", "body": "AAS 162–325 mg VO, mastigado, salvo contraindicação.\nP2Y12 e anticoagulante conforme estratégia, sangramento e função renal; estatina de alta intensidade."}, "main": {"x": 930, "y": 840, "title": "3B • ECG e quadro clínico", "body": "Supra de ST compatível com IAM: ativar reperfusão imediatamente.\nSem supra: estratificar risco; se instabilidade ou isquemia refratária, avaliação invasiva urgente.\nEstável: ECG/troponina seriados e decisão invasiva por risco. Sem fibrinólise no NSTEMI."}, "rosc": [{"x": 60, "y": 840, "title": "3A • ROSC: avaliar indicação de cateterismo", "body": "ECG de 12 derivações e estabilização pós-PCR.\nSupra persistente: coronariografia emergencial.\nSem supra + choque, arritmia ventricular recorrente ou isquemia importante: considerar emergência.\nSem esses sinais: estratégia tardia/seletiva; coma isolado não indica cateterismo imediato."}], "supports": [{"x": 930, "y": 1220, "title": "4 • Escolher reperfusão", "body": "ICP primária preferencial.\nAtraso previsto até ICP >120 min desde primeiro contato + sintomas <12 h: fibrinólise se elegível, seguida de transferência.\nContraindicação à lise: transferir para ICP.\nApós lise: falha de reperfusão → ICP de resgate; sucesso → estratégia farmacoinvasiva."}, {"x": 60, "y": 1220, "title": "Atenção • Segurança e suporte", "body": "Oxigênio conforme hipoxemia; após ROSC, titular para SpO₂ 90–98%.\nPós-PCR: PAM ≥65 mmHg; tratar choque e arritmias enquanto organiza intervenção.\nAntes de fibrinólise, conferir contraindicações e risco hemorrágico no protocolo completo.\nReperfusão não substitui cuidados pós-PCR."}, {"title": "Antiagregação • conforme estratégia", "body": "Sem alergia/sangramento ativo: AAS 162–325 mg VO mastigável, depois 75–100 mg/dia. Em SCA sem fibrinólise, se P2Y12 indicado após definir estratégia: ticagrelor 180 mg VO, depois 90 mg a cada 12 h; alternativa clopidogrel 600 mg, depois 75 mg/dia. Não fazer pré-tratamento P2Y12 automaticamente em NSTEMI com anatomia desconhecida e angiografia precoce. Se fibrinólise: clopidogrel até 75 anos 300 mg de ataque, depois 75 mg/dia; >75 anos 75 mg/dia sem ataque."}, {"title": "Anticoagulação • distinguir cenários", "body": "HNF para tratamento clínico/fibrinólise: 60 UI/kg IV (máximo 4.000 UI), depois 12 UI/kg/h (máximo inicial 1.000 UI/h), ajustada por TTPa. Na ICP sem inibidor GP IIb/IIIa: bolus 70–100 UI/kg IV, conduzido pela equipe/ACT; não somar novo bolus sem conferir HNF já recebida. Contraindicações: sangramento ativo, HIT e diagnósticos hemorrágicos/dissecção. Função renal/estratégia orientam alternativa, não anticoagulação automática em qualquer dor torácica."}, {"title": "Dor isquêmica e prevenção", "body": "Nitroglicerina 0,4 mg sublingual a cada 5 min, até 3 doses se PA permite; evitar PAS <90 mmHg, queda >30 mmHg do basal, infarto de VD/dependência de pré-carga e PDE5 recente (sildenafil/vardenafil 24 h; tadalafil 48 h). Atorvastatina 80 mg VO/dia se indicada e sem contraindicação hepática. Oxigênio apenas se hipoxemia/insuficiência respiratória. Opioide só se dor refratária com monitorização, sem substituir reperfusão."}, {"title": "Fibrinólise • IAM com supra selecionado", "body": "Somente IAM com supra de início geralmente <12 h, quando ICP não estará disponível em tempo adequado (até 120 min da decisão/diagnóstico) e sem contraindicação. Exemplo com alteplase acelerada: 15 mg IV em bolus; 0,75 mg/kg em 30 min (máx. 50 mg); 0,5 mg/kg em 60 min (máx. 35 mg); total máximo 100 mg. Nunca usar para NSTEMI. Excluir hemorragia intracraniana prévia, AVC isquêmico recente, sangramento ativo, lesão intracraniana, trauma craniano importante recente ou suspeita de dissecção; PA muito elevada deve ser corrigida/avaliada antes. Transferir a centro com ICP; falha de reperfusão → resgate."}], "review": {"x": 60, "y": 1670, "title": "5 • Reavaliar após intervenção — ou durante investigação com pulso", "body": "Monitorização contínua: ritmo, pressão, perfusão, consciência e oxigenação; repetir ECG conforme evolução.\nMelhora → cuidados coronarianos/UTI e prevenção secundária individualizada.\nPersistência ou deterioração → buscar isquemia, choque, sangramento e complicações mecânicas; reintervir conforme causa. Nova PCR → retornar imediatamente ao ACLS."}, "outcomes": [{"title": "Resposta favorável", "body": "Continuar monitorização e manejo da SCA; planejar cuidados pós-PCR quando aplicável."}, {"title": "Persistência / piora", "body": "Reavaliar reperfusão, perfusão e causas; escalar equipe especializada."}], "alert": {"x": 60, "y": 1980, "title": "Integração com a sequência", "body": "Confirmar diagnóstico, estratégia de reperfusão, contraindicações e tratamentos já administrados. As opções de dose estão nos blocos de antiagregação, anticoagulação e fibrinólise; não somar alternativas. A melhora da dor não comprova reperfusão."}, "poster": "posters/10.png", "references": "", "clinical": {"exams": "ECG de 12 derivações em até 10 min; repetir se dor persistir/recorrer e acrescentar V3R/V4R ou V7–V9 conforme suspeita. Troponina de alta sensibilidade na chegada e seriada pelo método (0/1 h ou 0/2 h); não esperar troponina para reperfundir IAM com supra claro. Hemograma, plaquetas, Na/K/Mg, creatinina, glicemia e coagulação; eco se choque/complicação mecânica. RX se diagnóstico diferencial, sem atrasar reperfusão.", "review": "Após cada fármaco/choque, rever dor, PA, pulso e ECG. Dor recorrente → novo ECG imediato. Após fibrinólise, ECG em 60–90 min: resolução de ST <50%, dor/instabilidade persistentes → ICP de resgate. Mesmo reperfusão aparente exige transferência para estratégia farmacoinvasiva."}}, {"id": 11, "name": "Toxinas — abordagem inicial", "group": "Toxinas", "intro": [{"x": 270, "y": 215, "title": "SUSPEITA DE INTOXICAÇÃO • ADULTO", "body": "Garantir segurança e EPI; interromper exposição sem colocar a equipe em risco.\nAcionar emergência e CIATox precocemente. Identificar agente, dose, via, horário e coingestões; preservar embalagens."}], "pcr": {"x": 40, "y": 615, "title": "PCR • RCP + ACLS", "body": "RCP com ventilação; desfibrilar FV/TV sem pulso; acesso IV/IO e tratar 5H/5T.\nAntídoto específico em paralelo, conforme agente. Naloxona não deve atrasar RCP ou desfibrilação."}, "assessment": {"x": 650, "y": 615, "title": "ABCDE • ESTABILIZAR ANTES DOS EXAMES", "body": "A/B: proteger via aérea; ventilar se hipoventilação/apneia; O₂ conforme necessidade.\nC: ECG contínuo, pressão e perfusão; acesso IV, tratar choque e arritmias.\nD/E: glicemia imediata, consciência, pupilas e temperatura; tratar hipoglicemia, convulsões e hipertermia."}, "main": {"x": 650, "y": 1010, "title": "AVALIAÇÃO DIRECIONADA • EM PARALELO", "body": "ECG de 12 derivações: QRS, QTc, bloqueios e arritmias.\nConforme quadro: gasometria, eletrólitos, função renal/hepática, lactato e dosagens específicas.\nReconhecer toxíndrome: opioide, colinérgica, simpaticomimética, anticolinérgica ou sedativa. Coingestões podem mascarar sinais.\nNão esperar teste toxicológico para estabilizar ou tratar forte suspeita."}, "rosc": [{"x": 40, "y": 1010, "title": "PCR • PERSISTÊNCIA / ROSC", "body": "Buscar toxina reversível; discutir ressuscitação prolongada, antídoto e eliminação específica com toxicologista.\nConsiderar ECPR/VA-ECMO em casos selecionados e com recursos.\nSem ROSC: continuar algoritmo de PCR e reavaliar causas."}, {"x": 40, "y": 1450, "title": "APÓS ROSC", "body": "Iniciar cuidados pós-PCR e continuar tratamento da toxina.\nMonitorar recorrência da toxicidade e complicações.\nReavaliar necessidade de antídoto contínuo, depuração extracorpórea e suporte intensivo."}], "supports": [{"x": 100, "y": 1930, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "ECG e sinais vitais contínuos nos graves; após cada intervenção, rever ventilação, perfusão, consciência, glicemia e temperatura.\nRepetir exames conforme agente e evolução. Vigiar absorção tardia e recorrência após antídoto.\nResposta inicial não garante resolução: definir observação e destino com CIATox."}, {"title": "Resgates dirigidos • não um coquetel", "body": "Hipoglicemia: glicose 25 g IV, repetir glicemia em 10–15 min. Convulsão: lorazepam 0,1 mg/kg IV (máx. 4 mg), podendo repetir uma vez se persiste, com suporte de via aérea. Depressão respiratória por opioide: ventilar e naloxona titulada. Não usar flumazenil empírico no coma desconhecido. Carvão ativado 1 g/kg VO/sonda (máx. usual 50 g) somente em exposição adsorvível selecionada e via aérea protegida; evitar em corrosivos, hidrocarbonetos com risco de aspiração, metais e álcoois tóxicos."}], "review": {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente ao algoritmo de PCR e tratamento da toxina."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter observação pelo tempo específico da toxina; avaliar segurança antes da alta."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever agente e coingestões; escalar tratamento, toxicologia e UTI."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente ao algoritmo de PCR e tratamento da toxina."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não usar flumazenil empiricamente em coma de causa desconhecida ou intoxicação mista.\nSuporte respiratório e circulatório continua essencial durante o tratamento específico."}, "poster": "posters/11.png", "references": "Referências: AHA 2025 • RCUK 2025 • RCEM/NPIS 2026 • Carvão ativado: CTRC 2026", "clinical": {"exams": "Glicemia imediata, ECG de 12 derivações (QRS/QTc), gasometria/lactato, Na/K/Mg/Ca, ureia/creatinina, AST/ALT e hemograma; temperatura e diurese. Paracetamol em ingestão intencional/mista; salicilato, etanol, osmolalidade, co-oximetria e dosagens específicas conforme exposição. Teste toxicológico de triagem não exclui intoxicação e não deve atrasar antídoto.", "review": "Repetir ABCDE após cada intervenção; nos graves ECG/PA/SpO₂/ETCO₂ contínuos, glicemia/temperatura seriadas. Ajustar ritmo de exames pela toxina; melhora inicial não exclui absorção tardia. Reabrir o tema específico se nova toxíndrome."}}, {"id": 12, "name": "Opioides", "group": "Toxinas", "intro": [{"x": 270, "y": 215, "title": "SUSPEITA: DEPRESSÃO RESPIRATÓRIA + REBAIXAMENTO", "body": "Miose pode apoiar a suspeita; sua ausência não exclui intoxicação.\nAcionar equipe e CIATox; avaliar respiração e pulso, iniciar suporte sem aguardar naloxona."}], "pcr": {"x": 40, "y": 615, "title": "PCR • RCP + ACLS", "body": "RCP com ventilação; desfibrilação conforme ritmo; tratar causas reversíveis.\nNaloxona pode ser considerada se não interferir com RCP ou desfibrilação. Não aguardar sua resposta para ressuscitar."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • AVALIAR VENTILAÇÃO", "body": "Apneia/hipoventilação: abrir via aérea, ventilar com bolsa-máscara e O₂; capnografia se disponível.\nNa parada respiratória: 1 ventilação a cada 6 s; verificar pulso a cada 2 min.\nECG, SpO₂, pressão e glicemia; acesso IV. Se ventilação normal, suporte/observação; naloxona não é automática por sonolência isolada."}, "main": {"x": 650, "y": 1020, "title": "NALOXONA • TITULAR PARA VENTILAÇÃO EFICAZ", "body": "Com ventilação assistida e sem peri-PCR: 0,1–0,2 mg IV a cada 60 s, titulando à resposta (RCEM/NPIS).\nApneia grave/peri-PCR: não retardar reversão; esquema AHA: 0,2–2 mg IV/IO/IM, repetir a cada 2–3 min conforme resposta.\nSem acesso: 2–4 mg intranasal com dispositivo apropriado; repetir a cada 2–3 min.\nMeta: ventilação e proteção da via aérea; evitar reversão excessiva e abstinência."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento da causa.\nVigiar depressão respiratória recorrente, aspiração e complicações pulmonares.\nSem ROSC: permanecer no algoritmo de PCR; antídoto não substitui suporte."}], "supports": [{"x": 650, "y": 1460, "title": "RESPOSTA E RECORRÊNCIA", "body": "Melhora respiratória: observar continuamente; naloxona pode durar menos que o opioide.\nRecorrência: ventilar, repetir bolus e considerar infusão IV.\nSem resposta adequada: manter ventilação; investigar coingestões e outras causas. IOT se suporte insuficiente."}, {"x": 1220, "y": 1460, "title": "INFUSÃO • SE RECORRÊNCIA", "body": "Dose inicial por hora: 2/3 da dose cumulativa que produziu resposta. Titular à ventilação.\nExemplo: resposta com 0,6 mg → 0,4 mg/h.\nPreparo: 4 mg em volume FINAL de 40 mL = 0,1 mg/mL; exemplo → 4 mL/h.\nConferir apresentação; bomba e monitorização contínua."}, {"x": 40, "y": 1460, "title": "AVALIAÇÃO EM PARALELO", "body": "Identificar opioide, formulação, dose e horário; avaliar álcool e sedativos associados.\nGlicemia; exames e ECG conforme quadro.\nNão esperar triagem toxicológica para tratar. Resultado negativo não exclui opioides não detectados pelo teste."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "Após cada dose: frequência e profundidade respiratória, SpO₂, consciência, via aérea e perfusão; capnografia quando disponível.\nO₂ pode mascarar hipoventilação: não usar SpO₂ isolada como prova de ventilação eficaz.\nRever resposta, necessidade de novos bolus/infusão e complicações."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA SUSTENTADA", "body": "Observação individualizada: consciência e sinais vitais normais, baixo risco de recorrência antes da alta."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Suporte ventilatório; rever diagnóstico e coingestões; CIATox/UTI e ajuste do antídoto."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP com ventilação e algoritmo de PCR."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Opioides de longa ação exigem observação prolongada; melhora inicial não autoriza alta automática.\nNa alta: orientar prevenção de overdose, acesso à naloxona conforme disponibilidade e encaminhamento."}, "poster": "posters/12.png", "references": "Referências: AHA 2023–2025 • RCEM/NPIS 2024 (titulação e preparo)", "clinical": {"exams": "FR/profundidade, SpO₂, ETCO₂ se disponível, glicemia e ECG se coingestão; gasometria se hipoventilação persistente. RX se aspiração/edema pulmonar e função renal se exposição prolongada. Investigar outros depressores do SNC; triagem urinária negativa não exclui opioide sintético.", "review": "Após cada bolus, rever ventilação em 1–3 min, consciência, ETCO₂ e proteção da via aérea. Se depressão retorna, bolus eficaz e infusão titulada; não encerrar observação só por despertar."}}, {"id": 13, "name": "Bloqueadores dos canais de sódio", "group": "Toxinas", "intro": [{"x": 270, "y": 215, "title": "SUSPEITA DE CARDIOTOXICIDADE POR BLOQUEIO DE SÓDIO", "body": "Exemplos: tricíclicos, flecainida, propafenona, difenidramina em overdose e cocaína.\nQRS alargado, arritmias, hipotensão, coma ou convulsões. Acionar CIATox."}], "pcr": {"x": 40, "y": 615, "title": "PCR • ACLS + CAUSA", "body": "RCP, ventilação e desfibrilação conforme ritmo.\nBicarbonato IV/IO quando suspeita de cardiotoxicidade por bloqueio de sódio; não é rotina em toda PCR.\nDiscutir ECPR/VA-ECMO em casos refratários selecionados."}, "assessment": {"x": 650, "y": 615, "title": "ABCDE + ECG + GASOMETRIA", "body": "Garantir ventilação; evitar hipóxia e acidemia, que podem agravar a cardiotoxicidade.\nECG contínuo e de 12 derivações; acesso IV, glicemia, Na⁺, K⁺, Mg²⁺ e cálcio conforme quadro.\nHipotensão: cristalóide com reavaliação; vasopressor se necessário. Convulsões: benzodiazepínico conforme protocolo.\nIntubação se indicada: evitar acidemia por ventilação insuficiente."}, "main": {"x": 650, "y": 1020, "title": "QUANDO TRATAR COM BICARBONATO?", "body": "Agente compatível + QRS >100 ms, arritmia ventricular ou hipotensão por cardiotoxicidade: bicarbonato hipertônico IV.\nQRS normal e estabilidade: observação e ECG seriado; não alcalinizar automaticamente.\nQT prolongado isolado não indica bicarbonato.\nDose inicial: 1–2 mEq/kg IV em bolus. Solução 8,4% = 1 mEq/mL → 1–2 mL/kg. Conferir concentração."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; continuar tratamento toxicológico e suporte intensivo.\nVigiar retorno do QRS largo e choque.\nSem ROSC: manter ressuscitação e tratamento da causa."}], "supports": [{"x": 650, "y": 1460, "title": "SE INDICADO • BOLUS", "body": "Rever QRS e hemodinâmica em cerca de 5 min.\nSe não estreitar, pode repetir 1 bolus, respeitando pH e Na⁺.\nApós dose cumulativa de 4 mEq/kg, medir gasometria e eletrólitos antes de novos bolus.\nRecorrência/infusão: individualizar com CIATox; não repetir indefinidamente."}, {"x": 1220, "y": 1460, "title": "LIMITES DE SEGURANÇA", "body": "Meta clínica: estreitar QRS e restaurar perfusão; pH em torno de 7,50, sem exceder 7,55.\nInterromper novos bolus se pH >7,55 ou Na⁺ >155 mmol/L.\nVigiar hipocalemia, hipocalcemia e sobrecarga volêmica.\nAlcalinização e carga de sódio exigem monitorização."}, {"x": 40, "y": 1460, "title": "SE REFRATÁRIO", "body": "CIATox/UTI: confirmar agente e mecanismo.\nArritmia ventricular persistente: considerar lidocaína especializada.\nSalina hipertônica, emulsão lipídica ou VA-ECMO apenas em situações selecionadas.\nAnestésicos locais: seguir módulo LAST específico."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "ECG e sinais vitais contínuos nos graves; após cada intervenção, rever QRS, ritmo, pressão, perfusão e ventilação.\nGasometria e eletrólitos seriados; corrigir distúrbios e avaliar resposta antes de novas doses.\nNormalização inicial do ECG não elimina risco de recorrência."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter vigilância e ECG seriado; definir observação e destino conforme agente e gravidade."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever pH, Na⁺, K⁺ e causa; escalar suporte com CIATox/UTI. Não exceder limites por QRS persistente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP/ACLS e tratar cardiotoxicidade."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Bupropiona pode alargar QRS por outro mecanismo e responder pouco ao bicarbonato.\nBicarbonato não trata diretamente a convulsão; tratar com anticonvulsivante apropriado."}, "poster": "posters/13.png", "references": "Referências: AHA 2025 • Ontario Poison Centre • Utah Poison Control 2025", "clinical": {"exams": "ECG inicial e seriado com medida de QRS; PA/ritmo contínuos. Gasometria, Na/K/Mg/Ca, glicemia, creatinina e lactato; colher antes e após bolus repetidos de bicarbonato. Considerar paracetamol e coingestões. Nível sérico de tricíclico não orienta sozinho a gravidade.", "review": "ECG/PA após cada bolus, em minutos; acompanhar QRS, pH, Na/K. Evitar pH >7,55 e Na >155 mmol/L. Se refratário apesar de alcalinização segura, resgate especializado/ECLS; não repetir bicarbonato sem controle."}}, {"id": 14, "name": "Anestésicos locais / LAST", "group": "Toxinas", "intro": [{"x": 270, "y": 215, "title": "SUSPEITA DE LAST DURANTE OU APÓS ANESTÉSICO LOCAL", "body": "Alteração neurológica/convulsão, hipotensão, bloqueio de condução, arritmia ou colapso.\nInterromper anestésico; chamar ajuda e obter kit LAST/emulsão lipídica. Pode ser tardia ou apenas cardiovascular."}], "pcr": {"x": 40, "y": 615, "title": "PCR • RCP + AJUSTES LAST", "body": "RCP, ventilação e desfibrilação conforme ritmo.\nIniciar emulsão lipídica 20% em paralelo.\nASRA: epinefrina em dose inicial <1 mcg/kg.\nRefratário: suporte extracorpóreo."}, "assessment": {"x": 650, "y": 615, "title": "ABCDE • RESPIRAÇÃO, CONVULSÃO E CIRCULAÇÃO", "body": "Proteger via aérea; administrar O₂ e ventilar se necessário. Evitar hipóxia e acidemia.\nConvulsões: benzodiazepínico preferencial, conforme protocolo.\nECG contínuo, pressão, SpO₂, acesso IV e glicemia; gasometria/eletrólitos conforme quadro.\nToxicidade ameaçadora à vida: emulsão lipídica 20% precoce, sem esperar PCR."}, "main": {"x": 650, "y": 1020, "title": "EMULSÃO LIPÍDICA 20% • ESQUEMA ASRA", "body": "<70 kg: bolus 1,5 mL/kg IV em 2–3 min; infusão 0,25 mL/kg/min.\n≥70 kg: bolus aproximado de 100 mL em 2–3 min; infundir cerca de 250 mL em 15–20 min.\nPersistência de instabilidade: repetir bolus e dobrar infusão.\nDose cumulativa máxima: 12 mL/kg, contando bolus e infusão.\nNão substituir a emulsão lipídica por propofol."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e manutenção do tratamento da LAST.\nSem ROSC: manter ressuscitação; discutir VA-ECMO/ECPR com equipe especializada.\nRessuscitação pode precisar ser prolongada em causa reversível."}], "supports": [{"x": 650, "y": 1460, "title": "RESPOSTA AO LIPÍDIO", "body": "Estabilidade hemodinâmica: continuar emulsão por >15 min, respeitando máximo cumulativo.\nInstabilidade persistente: rever ventilação, acidemia e dose total; repetir/escalar conforme esquema.\nAcionar toxicologia, anestesia e UTI; considerar VA-ECMO em choque refratário."}, {"x": 1220, "y": 1460, "title": "EVITAR / CONFERIR", "body": "Evitar vasopressina, betabloqueadores, bloqueadores de cálcio e anestésicos locais adicionais.\nLidocaína não é opção automática para arritmia da LAST.\nPropofol não é antídoto lipídico; doses elevadas podem agravar depressão cardiovascular."}, {"x": 40, "y": 1460, "title": "TRATAMENTO ADICIONAL", "body": "Taquicardia de QRS largo ameaçadora à vida: bicarbonato pode ser considerado.\nUsar módulo específico de bloqueio de sódio e monitorar QRS, pH e Na⁺.\nNão deixar esse tratamento atrasar emulsão ou suporte.\nRever diagnóstico se evolução incompatível."}, {"title": "PCR por LAST • doses próprias", "body": "Parar anestésico, chamar ajuda, oxigenar/ventilar e iniciar resgate lipídico. Se adrenalina necessária, usar doses pequenas, iniciando <1 micrograma/kg; não aplicar automaticamente o bolus de 1 mg da PCR convencional. Evitar vasopressina, betabloqueadores, bloqueadores de cálcio e novos anestésicos locais. Convulsão: preferir benzodiazepínico; propofol não substitui lipídio e doses altas podem agravar choque."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "ECG e sinais vitais contínuos; após cada intervenção, rever ritmo, pressão, perfusão, consciência e ventilação.\nRegistrar volume total de emulsão; conferir mL/kg/min e limite cumulativo.\nApós estabilidade: observar ≥2 h após convulsão e 4–6 h após instabilidade cardiovascular; pós-PCR conforme quadro."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Completar observação; vigiar recorrência. Registrar agente, dose e evento para prevenção."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever suporte e limite lipídico; escalar para UTI e suporte extracorpóreo selecionado."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP, com ajustes específicos da LAST."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "A ressuscitação na LAST exige ajustes em relação ao ACLS habitual. Emulsão: concentração 20%.\nInfusão é expressa por MINUTO; verificar conversão para mL/h e capacidade da bomba."}, "poster": "posters/14.png", "references": "Referências: ASRA Checklist LAST 2020 • AHA Circunstâncias Especiais 2025", "clinical": {"exams": "Monitorização ECG/PA/SpO₂/ETCO₂, glicemia, gasometria/lactato, K/Mg/Ca e função renal. Registrar anestésico, concentração, dose total, horário, peso e volume cumulativo de lipídio. Não aguardar exames para iniciar resgate em LAST grave.", "review": "Após bolus de lipídio, reavaliar em minutos; se instável, repetir bolus/dobrar infusão, respeitando total 12 mL/kg. Registrar volume acumulado. Observação ≥2 h após convulsão, 4–6 h após evento cardiovascular; PCR exige cuidados intensivos."}}, {"id": 15, "name": "Sulfonilureias", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "RISCO DE GRAVIDADE", "body": "Coma, convulsões, alteração de consciência ou hipoglicemia recorrente."}, {"x": 470, "y": 215, "title": "SUSPEITA DE TOXICIDADE", "body": "Ex.: glibenclamida, gliclazida, glimepirida.\nGlicemia imediata; suspender agente, acionar equipe e CIATox."}, {"x": 1360, "y": 215, "title": "OBJETIVO", "body": "Corrigir hipoglicemia e impedir novas quedas por liberação de insulina."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP com ventilação e desfibrilação conforme ritmo; ACLS.\nMedir glicemia e corrigir hipoglicemia documentada em paralelo, sem atrasar RCP.\nInvestigar outras causas reversíveis."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + GLICEMIA", "body": "Via aérea, ventilação, perfusão e consciência; ECG, SpO₂, pressão e acesso IV.\nGlicemia <70 mg/dL: tratar prontamente. Se quadro grave e glicemia indisponível, não retardar resgate de forte suspeita.\nAlerta e deglutição segura: 15–20 g de carboidrato rápido; reavaliar em 15 min.\nComa/convulsão ou via oral insegura: glicose IV; não dar alimentos pela boca."}, "main": {"x": 650, "y": 1020, "title": "CORREÇÃO INICIAL • GLICOSE IV", "body": "Exemplo adulto: 25 g IV; titular/repetir conforme glicemia e resposta.\n25 g = 250 mL de glicose 10% OU 125 mL de 20% OU 50 mL de 50%.\nConferir acesso: solução concentrada tem risco de extravasamento.\nRever glicemia em 10–15 min; repetir correção se ainda baixa.\nSem acesso: glucagon 1 mg IM como ponte; providenciar glicose IV. Não é solução definitiva."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e controle da hipoglicemia.\nSem ROSC: continuar ressuscitação e tratamento das causas.\nNormalização da glicemia não significa eliminação da sulfonilureia."}], "supports": [{"x": 650, "y": 1460, "title": "OCTREOTIDA • ANTÍDOTO", "body": "Após corrigir hipoglicemia por sulfonilureia, iniciar precocemente; não esperar recaídas.\nAdulto: 50–100 mcg SC; repetir a cada 6 h, conforme glicemia e CIATox.\nRefratário: discutir infusão IV em ambiente monitorado.\nReduz insulina; glicose corrige a crise."}, {"x": 1220, "y": 1460, "title": "GLICOSE + ALIMENTAÇÃO", "body": "Persistência/recorrência: novo bolus; infusão de glicose 10% titulada enquanto antídoto atua.\nEvitar excesso de glicose e hiperglicemia, que estimulam insulina.\nConsciente e deglutição segura: refeições/carboidratos complexos.\nSem hipoglicemia: não dar glicose IV profilática."}, {"x": 40, "y": 1460, "title": "CAUSA E DESCONTAMINAÇÃO", "body": "Identificar dose, horário, liberação prolongada e coingestões.\nAvaliar função renal/hepática e interações.\nCarvão ativado apenas se indicado por CIATox e via aérea segura.\nDistinguir insulina exógena: octreotida não é antídoto universal da hipoglicemia."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • GLICEMIA E ESTADO CLÍNICO", "body": "Após resgate: glicemia em 10–15 min; durante tratamento, a cada 30–60 min até estabilidade, com ajuste à gravidade.\nRever consciência, sinais vitais e necessidade de glicose/octreotida; monitorar K⁺ e repor se indicado.\nRecorrência → corrigir novamente, rever suporte e ajustar antídoto com CIATox."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Observação hospitalar; não dar alta apenas por glicemia normal após um bolus."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever doses, infusão, coingestões e disfunção orgânica; CIATox/UTI."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP/ACLS; corrigir hipoglicemia em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "OBSERVAÇÃO / ALTA", "body": "Após retirar glicose IV/octreotida: observar ≥12 h; alguns protocolos pedem 24 h após octreotida.\nAlta: assintomático e alimentando-se; CIATox define tempo conforme agente, rim e recorrência."}, "poster": "posters/15.png", "references": "Referências: DoH Antidiabetic Toxicity 2025 • Atlantic Canada Poison Centre • Austin Health", "clinical": {"exams": "Glicemia imediatamente e após cada resgate; K, creatinina, função hepática e ECG se distúrbio eletrolítico. Identificar fármaco, formulação, quantidade, tempo e coingestões. Hipoglicemia recorrente após glicose é sinal para octreotida, não para apenas repetir grandes bolus indefinidamente.", "review": "Glicemia em 10–15 min após glicose, depois a cada 30–60 min até estável. Observar ao menos 12 h após suspender glicose/octreotida, prolongando conforme agente e recorrência. Rebaixamento ou hipoglicemia → novo resgate e ajuste de antídoto."}}, {"id": 16, "name": "Isoniazida", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SINAIS DE ALERTA", "body": "Convulsão refratária, coma e acidose metabólica após exposição."}, {"x": 470, "y": 215, "title": "SUSPEITA DE INTOXICAÇÃO POR INH", "body": "Identificar isoniazida, dose e horário; acionar emergência e CIATox.\nObter piridoxina IV imediatamente."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Suporte vital + benzodiazepínico + piridoxina precoces."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP, ventilação e desfibrilação conforme ritmo; seguir ACLS.\nTratar causa reversível: piridoxina em paralelo e correção dos distúrbios graves.\nNão atrasar RCP para exames ou obtenção do antídoto."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + CONTROLE DA CONVULSÃO", "body": "Proteger via aérea; O₂ e ventilação conforme necessidade. IOT se coma, ventilação insuficiente ou estado de mal.\nBenzodiazepínico IV conforme protocolo de estado de mal; não esperar sua falha para preparar piridoxina.\nECG, SpO₂, pressão, acesso IV e glicemia. Corrigir hipoglicemia, se presente.\nGasometria, lactato, eletrólitos, função renal/hepática e CK conforme quadro."}, "main": {"x": 650, "y": 1020, "title": "PIRIDOXINA • VITAMINA B6 • DOSE DE RESGATE", "body": "Dose ingerida conhecida: 1 g de piridoxina para cada 1 g de isoniazida, IV em 3–5 min (bula DailyMed).\nDose desconhecida: adulto, 5 g IV em 10 min (Atlantic Canada Poison Centre).\nNesse esquema, se convulsão cessar antes dos 10 min, administrar o restante da dose inicial em 4 h.\nPersistência/recorrência: pode repetir 1 dose; discutir dose cumulativa com CIATox."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; continuar antídoto e tratamento da intoxicação.\nVigiar recorrência de convulsões, depressão respiratória e acidose.\nSem ROSC: manter ressuscitação e tratamento das causas."}], "supports": [{"x": 650, "y": 1460, "title": "PREPARO • CONFERIR", "body": "Exemplo se apresentação 100 mg/mL: 5 g = 50 mL.\nAdicionar SF 0,9% para volume FINAL de 100 mL → 50 mg/mL. Proteger da luz.\nConferir concentração disponível e protocolo de infusão.\nSem formulação IV: discutir 5 g por sonda, apenas com via aérea protegida; não atrasar suporte."}, {"x": 1220, "y": 1460, "title": "SE CONVULSÃO PERSISTIR", "body": "Rever piridoxina efetivamente administrada e dose de INH.\nContinuar protocolo de estado de mal; anestesia/UTI, via aérea e EEG se indicado.\nBloqueio neuromuscular pode ocultar crises: ausência de movimentos não prova controle.\nPesquisar coingestões e outras causas."}, {"x": 40, "y": 1460, "title": "ACIDOSE / DEPURAÇÃO", "body": "Controlar crises, restaurar perfusão e ventilação; seguir gasometria/lactato.\nBicarbonato apenas se indicado por acidemia grave e contexto, com monitorização.\nEXTRIP: diálise não é rotina. Considerar se piridoxina indisponível e crises refratárias ao tratamento GABAérgico."}, {"title": "Convulsão • suporte simultâneo", "body": "Lorazepam 0,1 mg/kg IV, máximo 4 mg; pode repetir uma vez se crise persiste, monitorando ventilação. Alternativa diazepam 0,15–0,2 mg/kg IV, máximo 10 mg. Benzodiazepínico não substitui piridoxina na intoxicação por INH; preparar via aérea se crises/depressão respiratória persistentes."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "Após cada intervenção: consciência, crises, ventilação, pressão e perfusão; ECG e sinais vitais contínuos nos graves.\nRepetir gasometria, lactato e eletrólitos; vigiar rabdomiólise e lesão renal/hepática.\nRegistrar dose cumulativa de piridoxina e resposta; não esperar dosagem de INH para tratar."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter observação hospitalar; confirmar controle das crises e recuperação metabólica."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever antídoto, estado de mal e coingestões; CIATox/UTI e suporte avançado."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP/ACLS; tratar a intoxicação em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Doses de resgate são em GRAMAS; não confundir com suplementação em miligramas usada na tuberculose.\nDescontaminação apenas se indicada e via aérea segura; não deve atrasar piridoxina ou controle das crises."}, "poster": "posters/16.png", "references": "Referências: DailyMed — Isoniazid • Atlantic Canada Poison Centre • EXTRIP", "clinical": {"exams": "Gasometria/lactato, glicemia, eletrólitos, creatinina, CK, AST/ALT; ECG e temperatura. Avaliar convulsões e acidose desproporcional. Dosagem de INH não é requisito para piridoxina; registrar quantidade ingerida quando conhecida.", "review": "Durante piridoxina, acompanhar crises/ventilação continuamente; após controle repetir gasometria, lactato e K conforme gravidade. Recorrência → benzodiazepínico, rever dose de piridoxina e via aérea."}}, {"id": 17, "name": "Ferro", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "ALERTA", "body": "Vômitos intensos, sangramento digestivo, choque ou acidose."}, {"x": 470, "y": 215, "title": "EXPOSIÇÃO AGUDA • ACIONAR CIATox", "body": "Identificar produto, quantidade e horário.\nCalcular mg de FERRO ELEMENTAR/kg; não usar a massa do sal."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Estabilizar e reconhecer toxicidade sistêmica precocemente."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP, ventilação e desfibrilação conforme ritmo; seguir ACLS.\nTratar intoxicação e distúrbios reversíveis em paralelo.\nNão atrasar ressuscitação para exames ou antídoto."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + INVESTIGAÇÃO", "body": "Via aérea, oxigenação e ventilação conforme necessidade; monitor cardíaco, SpO₂, pressão e acesso IV.\nChoque: cristaloide em alíquotas com reavaliação; vasopressor se necessário. Corrigir hipoglicemia.\nSolicitar ferro sérico, gasometria/lactato, glicose, eletrólitos, função renal/hepática e INR.\nRX de abdome se comprimidos: imagem negativa não exclui intoxicação."}, "main": {"x": 650, "y": 1020, "title": "DEFEROXAMINA • QUANDO E COMO INICIAR", "body": "Choque, acidose ou gastroenterite grave: iniciar com CIATox, sem esperar ferro sérico. Ferro >500 µg/dL (≈90 µmol/L) também indica quelação.\nSe indicada: 15 mg/kg/h IV em infusão contínua; NÃO administrar em bolus.\nEsquema adulto ACPC: máximo 6 g/24 h. Planejar redução/interrupção conforme resposta e dose acumulada.\nSem critérios: suporte e monitorização; repetir avaliação se houver piora."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e tratamento da causa.\nVigiar choque, acidose, hipoglicemia e falência hepática.\nSem ROSC: manter ressuscitação e correção das causas reversíveis."}], "supports": [{"x": 40, "y": 1460, "title": "DESCONTAMINAÇÃO", "body": "Carvão ativado não adsorve ferro.\nComprimidos retidos / carga importante: discutir irrigação intestinal com PEG com CIATox.\nNão realizar com instabilidade, via aérea desprotegida, obstrução/íleo ou sangramento significativo.\nNão atrasar suporte ou quelação."}, {"x": 650, "y": 1460, "title": "INFUSÃO • VIGILÂNCIA", "body": "Conferir reconstituição e diluição da apresentação disponível.\nRegistrar mg/kg/h e total em gramas; 15 mg/kg/h não é dose para manter 24 h sem ajuste.\nMonitorar pressão, respiração e diurese.\nInfusão rápida causa hipotensão; uso >24 h aumenta risco pulmonar."}, {"x": 1220, "y": 1460, "title": "FERRO • INTERPRETAÇÃO", "body": "Colher na chegada e perto de 4–6 h da ingestão; repetir se absorção tardia ou evolução incerta.\nLiberação prolongada: nova coleta em 6–8 h pode ser necessária.\nValor tardio baixo não exclui toxicidade. Após quelação, confirmar interferência do ensaio com laboratório."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • COM PULSO / APÓS ROSC", "body": "Após intervenções: consciência, ventilação, pressão/perfusão e diurese; monitorização contínua nos graves.\nSeguir acidose/lactato, glicose, função renal/hepática e INR. Ajustar suporte e quelação com CIATox.\nMelhora gastrointestinal pode preceder deterioração: fase latente de 6–24 h."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA SUSTENTADA", "body": "Suspender quelação com CIATox após recuperação clínica/metabólica e controle da absorção."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "UTI; rever absorção residual, quelação e falência orgânica. Oligúria exige avaliação especializada."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar imediatamente à RCP/ACLS; tratar intoxicação em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Urina avermelhada pode ocorrer com quelação; não usar sua cor isoladamente para decidir início ou suspensão.\nAlta depende de evolução, formulação, exames e CIATox; não liberar apenas porque cessaram os vômitos."}, "poster": "posters/17.png", "references": "Referências: Atlantic Canada Poison Centre (adulto) • RCH (avaliação toxicológica)", "clinical": {"exams": "Ferro sérico cerca de 4–6 h após ingestão; repetir se formulação de liberação lenta ou absorção persistente. Gasometria/lactato, glicemia, Na/K, creatinina, AST/ALT, INR e hemograma. RX abdominal para comprimidos radiopacos quando útil; RX normal não exclui exposição. Quelação não deve esperar nível se choque/acidose/gastroenterite grave.", "review": "PA/respiração contínuas sob deferoxamina; registrar dose acumulada, diurese, acidose, ferro e função hepática/INR. Fase latente de 6–24 h pode preceder choque. Suspensão depende de melhora clínica e metabólica, não apenas urina clara."}}, {"id": 18, "name": "Metemoglobinemia", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "SUSPEITAR", "body": "Cianose persistente apesar de O₂, dispneia e exposição oxidante."}, {"x": 470, "y": 215, "title": "RECONHECER • INTERROMPER EXPOSIÇÃO", "body": "Nitritos/nitratos, dapsona, benzocaína e outros oxidantes.\nAcionar emergência e CIATox; obter co-oximetria."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Suporte vital e reversão da incapacidade de transportar O₂."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP, O₂ e desfibrilação conforme ritmo; seguir ACLS.\nAzul de metileno em paralelo se metemoglobinemia ameaçadora à vida, avaliando contraindicações.\nNão atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ABCDE + CONFIRMAÇÃO", "body": "Administrar O₂ em alta concentração; ventilar/IOT se necessário. Monitorar ECG, pressão, consciência e perfusão.\nCo-oximetria em sangue arterial ou venoso: medir metemoglobina (MetHb). Solicitar hemograma, lactato, gasometria e função renal.\nSpO₂ e saturação calculada da gasometria podem enganar; PaO₂ normal não exclui hipóxia funcional.\nAmeaça à vida: não esperar resultado para organizar tratamento específico."}, "main": {"x": 650, "y": 1020, "title": "ANTÍDOTO INDICADO? • DECISÃO COM CIATox", "body": "Sintomas de hipóxia sistêmica, especialmente MetHb >20%, ou instabilidade: tratar. Considerar limiar menor se anemia/doença cardiopulmonar.\nQuadro leve, sem sintomas sistêmicos: retirar agente, O₂ e monitorar clínica/MetHb.\nSe indicado e sem contraindicação: azul de metileno 1 mg/kg IV em 5–30 min (esquema PROVAYBLUE).\nEm 1 h: se MetHb >30% ou sintomas persistirem, repetir 1 mg/kg uma vez; após 2 doses, buscar alternativas."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR e correção da metemoglobinemia.\nVigiar recorrência de hipóxia e lesão orgânica.\nSem ROSC: manter ressuscitação e tratamento da causa."}], "supports": [{"x": 40, "y": 1460, "title": "CONTRAINDICAÇÕES", "body": "Deficiência de G6PD ou alergia grave ao azul: não administrar; discutir alternativa.\nSerotonérgicos e opioides: risco de síndrome serotoninérgica; ponderar risco/benefício urgente.\nVigiar hemólise. Doses excessivas podem piorar MetHb.\nNão usar cor da pele isoladamente como resposta."}, {"x": 650, "y": 1460, "title": "PREPARO • CONFERIR", "body": "1 mg/kg corresponde a:\n5 mg/mL → 0,2 mL/kg.\n10 mg/mL (1%) → 0,1 mL/kg.\nConfirmar produto e bula; usar formulação injetável farmacêutica.\nPROVAYBLUE: diluição opcional em SG 5%; evitar SF.\nTFGe 15–59 mL/min/1,73 m²: dose única."}, {"x": 1220, "y": 1460, "title": "FALHA / INDISPONÍVEL", "body": "Rever diagnóstico, agente, G6PD e dose.\nGrave/refratária: discutir exsanguineotransfusão ou O₂ hiperbárico.\nÁcido ascórbico: alternativa se azul contraindicado/indisponível; ação lenta.\nNão substitui resgate imediato."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • CLÍNICA + CO-OXIMETRIA", "body": "Após intervenção e em 30–60 min: consciência, dispneia, perfusão, pressão e tendência da MetHb.\nRepetir co-oximetria conforme evolução; SpO₂ pode sofrer interferência adicional do corante.\nMonitorar Hb/hemólise, lactato e função renal; registrar dose acumulada e resposta."}, "outcomes": [{"x": 40, "y": 2260, "title": "MELHORA", "body": "Manter observação e medidas seriadas; dapsona/anilina podem causar rebote."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "UTI/CIATox; seguir critério de repetição ou resgate. Não acumular doses empiricamente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "RCP/ACLS imediatamente; tratamento específico em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Não perseguir apenas normalização da SpO₂: avaliar perfusão, clínica e MetHb medida por co-oximetria.\nEsquemas variam por produto/protocolo; a dose e os limites aqui seguem a bula PROVAYBLUE."}, "poster": "posters/18.png", "references": "Referências: AHA 2025 • DailyMed/PROVAYBLUE • Atlantic Canada Poison Centre", "clinical": {"exams": "Co-oximetria para MetHb; gasometria com lactato, hemograma, função renal e marcadores de hemólise conforme evolução. SpO₂ e PaO₂ isoladas não quantificam MetHb. Investigar G6PD e fármacos serotoninérgicos antes do azul quando viável sem atrasar resgate.", "review": "Reavaliar clínica e co-oximetria em 30–60 min; em 1 h decidir segunda dose conforme sintomas/MetHb, no máximo duas doses neste esquema. Vigiar hemólise e síndrome serotoninérgica; ausência de resposta exige alternativa, não repetição ilimitada."}}, {"id": 19, "name": "Reversão de anticoagulantes", "group": "Toxinas", "intro": [{"x": 40, "y": 215, "title": "EMERGÊNCIA", "body": "Sítio crítico, choque ou sangramento não controlado."}, {"x": 470, "y": 215, "title": "IDENTIFICAR • SUSPENDER ANTICOAGULANTE", "body": "Nome, dose, última administração, função renal e indicação.\nAcionar equipe, hematologia e controle da fonte."}, {"x": 1360, "y": 215, "title": "PRIORIDADE", "body": "Hemostasia + suporte circulatório + reversão quando indicada."}], "pcr": {"x": 40, "y": 615, "title": "SEM PULSO • PCR", "body": "RCP/ACLS; tratar hemorragia e hipovolemia em paralelo.\nControle da fonte, hemocomponentes e reversão específica quando indicada.\nNão atrasar RCP para exames."}, "assessment": {"x": 650, "y": 615, "title": "COM PULSO • ESTABILIZAR + CLASSIFICAR", "body": "ABCDE, monitorização, acessos IV e controle local da hemorragia; endoscopia/cirurgia/radiologia conforme fonte.\nHemograma, INR, TTPa, fibrinogênio, função renal e prova cruzada; transfusão conforme quadro.\nReversor: ameaça à vida, sítio crítico ou sangramento maior persistente apesar das medidas iniciais.\nSangramento menor: medidas locais e ajuste/suspensão individualizada; reversão não é rotina."}, "main": {"x": 650, "y": 1020, "title": "VARFARINA • SANGRAMENTO GRAVE", "body": "Vitamina K 5–10 mg IV lenta + concentrado de complexo protrombínico de 4 fatores (CCP4), simultaneamente.\nCCP4 (esquema Kcentra, unidades de fator IX):\nINR 2–<4: 25 UI/kg (máx. 2.500 UI). INR 4–6: 35 UI/kg (máx. 3.500 UI). INR >6: 50 UI/kg (máx. 5.000 UI).\nSem CCP4: plasma 10–15 mL/kg. Conferir produto/infusão; vitamina K isolada não produz reversão imediata."}, "rosc": [{"x": 40, "y": 1020, "title": "APÓS ROSC", "body": "Cuidados pós-PCR; continuar hemostasia e ressuscitação hemorrágica.\nSem ROSC: manter RCP e tratamento das causas.\nReversão não substitui controle da fonte."}], "supports": [{"x": 40, "y": 1460, "title": "DABIGATRANA", "body": "Idarucizumabe 5 g IV: dois frascos de 2,5 g/50 mL consecutivos, conforme bula.\nSem antídoto: discutir CCP4/CCP ativado e, em casos selecionados, hemodiálise.\nVigiar rebote, sobretudo na disfunção renal.\nNova dose apenas com especialista e evidência de efeito persistente."}, {"x": 650, "y": 1460, "title": "INIBIDORES DIRETOS Xa", "body": "Apixabana/rivaroxabana/edoxabana: CCP4 50 UI/kg IV (fora de bula); teto conforme protocolo.\nAndexanet: verificar regulação, disponibilidade e protocolo local.\nFDA: vendas nos EUA encerradas em dez/2025; alerta de segurança.\nEvitar associação empírica."}, {"x": 1220, "y": 1460, "title": "HEPARINAS • PROTAMINA", "body": "HNF: 1 mg/100 UI ainda ativa; ajustar ao tempo decorrido.\nEnoxaparina: <8 h, 1 mg/mg; 8–12 h, 0,5 mg/mg.\n≥12 h: pode não precisar; avaliar função renal.\nIV lenta: não exceder 50 mg/10 min. Reversão da enoxaparina é parcial; vigiar reação e hipotensão."}], "review": {"x": 100, "y": 1960, "title": "REAVALIAR • HEMOSTASIA + PERFUSÃO", "body": "Após intervenção: sangramento, pressão, consciência, perfusão, diurese e Hb seriada. Vigiar trombose.\nVarfarina: repetir INR após CCP4 (cerca de 30 min) e depois conforme evolução.\nDOAC: INR/TTPa normais não excluem efeito; usar anti-Xa calibrado ou teste específico de dabigatrana quando disponível."}, "outcomes": [{"x": 40, "y": 2260, "title": "CONTROLE", "body": "Planejar reinício da anticoagulação após hemostasia, considerando risco trombótico e causa."}, {"x": 630, "y": 2260, "title": "PERSISTÊNCIA / PIORA", "body": "Rever fonte e efeito residual; UTI/especialista. Não repetir CCP4 automaticamente."}, {"x": 1220, "y": 2260, "title": "PERDA DO PULSO", "body": "Retornar à RCP/ACLS; hemostasia e reposição em paralelo."}], "alert": {"x": 40, "y": 2530, "title": "ALERTAS", "body": "Vitamina K não reverte DOAC ou heparina; protamina não reverte varfarina ou DOAC.\nReversores aumentam risco trombótico. Fondaparinux e outros agentes exigem protocolo específico."}, "poster": "posters/19.png", "references": "Referências: ACC • DailyMed (Kcentra/Praxbind/protamina/enoxaparina) • FDA", "clinical": {"exams": "Hemograma/plaquetas, TP/INR, TTPa, fibrinogênio, função renal/hepática e tipagem/prova cruzada. Confirmar agente, dose e última tomada. An
